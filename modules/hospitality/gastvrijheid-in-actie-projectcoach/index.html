ea:focus{outline:2px solid var(--green)}.homeguide{margin:34px 0 10px;padding:22px 24px;background:var(--panel);border:1px solid var(--line);border-radius:16px}.homeguide h3{margin:7px 0}.homeguide .twocol{margin:15px 0}.homeguide .greenhint{margin-top:12px}.homeguide .privacy{margin-bottom:0}</style></head><body><header class="top"><div class="container"><div class="eyebrow">SVO · Hospitality</div><h1>Gastvrijheid in Actie</h1><p>Onderzoek je gasten. Vertel jouw verhaal.</p></div></header><main class="container" id="app"></main><footer class="foot"><div class="container">Gastvrijheid in Actie · Projectcoach v1.1 · Desktop</div></footer><script>
const DATA={"sections": [{"title": "Mijn werkplek en planning", "intro": "Beschrijf je leerbedrijf en jouw beginsituatie. Plan wanneer je de onderzoeken uitvoert.", "tip": "Je kunt bijvoorbeeld beschrijven dat je in een restaurant gasten ontvangt, bestellingen opneemt of bij de receptie werkt.", "theory": "Een gastcontact is ieder moment waarop jij of je collega contact heeft met een gast.", "groups": [{"title": "Mijn startpunt", "fields": [{"id": "f1_0_0", "label": "Wat voor werk doe ik op mijn leerbedrijf?"}, {"id": "f1_0_1", "label": "Welke verschillende soorten gasten kom ik daar tegen?"}, {"id": "f1_0_2", "label": "Waar ben ik al goed in in het contact met gasten?"}, {"id": "f1_0_3", "label": "Wat wil ik tijdens deze fase leren over gasten?"}]}, {"title": "Mijn planning", "fields": [{"id": "f1_1_0", "label": "Wanneer observeer ik drie gastinteracties?"}, {"id": "f1_1_1", "label": "Wanneer interview ik collega 1?"}, {"id": "f1_1_2", "label": "Wanneer interview ik collega 2?"}, {"id": "f1_1_3", "label": "Wanneer maak ik mijn analyse en PowerPoint?"}]}], "ref": "Mijn startpunt / Mijn planning"}, {"title": "Kies een gasttype", "intro": "Kijk eerst welke soorten gasten jouw bedrijf bezoeken. Kies daarna één gasttype dat je goed kunt onderzoeken.", "tip": "Denk aan vaste gasten, gezinnen met kinderen of zakelijke lunchgasten. Kies een groep die je op je werk regelmatig ziet.", "theory": "Een gasttype is een groep gasten met vergelijkbare kenmerken of behoeften. Een aanname is iets wat je vermoedt; een observatie is wat je echt ziet of hoort.", "groups": [{"title": "Gasttypes die ik tegenkom", "fields": [{"id": "f2_0_0", "label": "Gasttype 1 dat ik zie"}, {"id": "f2_0_1", "label": "Wat valt mij op bij gasttype 1?"}, {"id": "f2_0_2", "label": "Gasttype 2 dat ik zie"}, {"id": "f2_0_3", "label": "Wat valt mij op bij gasttype 2?"}, {"id": "f2_0_4", "label": "Gasttype 3 dat ik zie"}, {"id": "f2_0_5", "label": "Wat valt mij op bij gasttype 3?"}]}, {"title": "Mijn keuze", "fields": [{"id": "f2_1_0", "label": "Welk gasttype kies ik?"}, {"id": "f2_1_1", "label": "Waarom komt dit gasttype veel voor op mijn werkplek?"}, {"id": "f2_1_2", "label": "Wat denk ik nu dat deze gast belangrijk vindt?"}, {"id": "f2_1_3", "label": "Wat wil ik nog onderzoeken voordat ik dat zeker weet?"}]}, {"title": "Feit of aanname", "fields": [{"id": "f2_2_0", "label": "Welke waarneming heb ik al gedaan?"}, {"id": "f2_2_1", "label": "Wat is nog een aanname en hoe kan ik dit controleren?"}]}], "ref": "2. Mijn gasttypes"}, {"title": "Observeer drie gastcontacten", "intro": "Observeer minimaal drie verschillende contactmomenten met je gekozen gasttype. Noteer wat je werkelijk ziet en hoort. Gebruik geen herkenbare gastgegevens.", "tip": "Een gast vraagt naar de wachttijd. De medewerker noemt de tijd. De gast bestelt. Dat zijn waarnemingen; “de gast was ongeduldig” is een aanname.", "theory": "Bij observeren beschrijf je concreet gedrag. Trek pas conclusies wanneer je kunt uitleggen waarop ze gebaseerd zijn.", "groups": [{"title": "Gastcontact 1", "fields": [{"id": "f3_0_0", "label": "Datum / moment 1"}, {"id": "f3_0_1", "label": "Situatie 1"}, {"id": "f3_0_2", "label": "Wat deed of zei de gast? 1"}, {"id": "f3_0_3", "label": "Wat deed of zei de medewerker? 1"}, {"id": "f3_0_4", "label": "Hoe reageerde de gast? 1"}, {"id": "f3_0_5", "label": "Welke behoefte of verwachting lijkt zichtbaar? 1"}, {"id": "f3_0_6", "label": "Waar baseer ik die conclusie op? 1"}]}, {"title": "Gastcontact 2", "fields": [{"id": "f3_1_0", "label": "Datum / moment 2"}, {"id": "f3_1_1", "label": "Situatie 2"}, {"id": "f3_1_2", "label": "Wat deed of zei de gast? 2"}, {"id": "f3_1_3", "label": "Wat deed of zei de medewerker? 2"}, {"id": "f3_1_4", "label": "Hoe reageerde de gast? 2"}, {"id": "f3_1_5", "label": "Welke behoefte of verwachting lijkt zichtbaar? 2"}, {"id": "f3_1_6", "label": "Waar baseer ik die conclusie op? 2"}]}, {"title": "Gastcontact 3", "fields": [{"id": "f3_2_0", "label": "Datum 2_4", "label": "Belangrijkste tip of inzicht van collega 2"}]}, {"title": "Vergelijken", "fields": [{"id": "f4_3_0", "label": "Wat bevestigen of veranderen deze gesprekken?"}, {"id": "f4_3_1", "label": "Welke inzichten komen bij beide collega’s terug?"}, {"id": "f4_3_2", "label": "Wat verschilt en wat wil ik nog controleren?"}]}], "ref": "4. Mijn gesprekken met collega’s"}, {"title": "Maak je persona en gastanalyse", "intro": "Leg je observaties en interviews naast elkaar. Maak een onderbouwd gastprofiel (persona) en schrijf op wat je hebt ontdekt.", "tip": "Persona “Sam, 34 jaar, lunchgast”: wil weten welke gerechten snel klaar zijn. Onderbouw dit met observaties en gesprekken; verzin geen onderzoeksresultaten.", "theory": "Een persona is een fictief, herkenbaar profiel dat je baseert op echt onderzoek. De persona is niet een echte gast met persoonsgegevens.", "groups": [{"title": "Mijn persona", "fields": [{"id": "f5_0_0", "label": "Naam van mijn persona / gasttype"}, {"id": "f5_0_1", "label": "Kernkenmerken van mijn persona"}, {"id": "f5_0_2", "label": "Wat wil deze gast?"}, {"id": "f5_0_3", "label": "Wat vindt deze gast belangrijk?"}, {"id": "f5_0_4", "label": "Waar kan deze gast tegenaan lopen?"}, {"id": "f5_0_5", "label": "Welk bewijs ondersteunt mijn persona?"}]}, {"title": "Mijn gastanalyse", "fields": [{"id": "f5_1_0", "label": "Wat zijn de belangrijkste kenmerken en behoeften van mijn gasttype?"}, {"id": "f5_1_1", "label": "Hoe speelt mijn werkplek hier nu al goed op in?"}, {"id": "f5_1_2", "label": "Welke verbeterpunten zie ik voor de gastbeleving?"}, {"id": "f5_1_3", "label": "Welke observaties of interviews ondersteunen mijn conclusies?"}]}, {"title": "Extra verdieping niveau 3 (waar van toepassing)", "fields": [{"id": "f5_2_0", "label": "Welke commerciële behoefte of kans zie ik?"}, {"id": "f5_2_1", "label": "Welke kans mist mijn leerbedrijf mogelijk?"}, {"id": "f5_2_2", "label": "Wat is mijn idee?"}, {"id": "f5_2_3", "label": "Hoe helpt dit de gast én het bedrijf?"}]}], "ref": "5. Van informatie naar gastanalyse"}, {"title": "Feedback en reflectie", "intro": "Vraag feedback aan je praktijkbegeleider. Beschrijf een eigen praktijkmoment en reflecteer op wat je geleerd hebt. Het werkboek vraagt een reflectie van 250–300 woorden.", "tip": "Bijvoorbeeld: “Ik dacht dat snelheid het belangrijkste was, maar ontdekte dat duidelijke informatie voor deze gasten minstens zo belangrijk is.”", "theory": "Reflecteren betekent terugkijken op wat je deed, welk effect het had en wat je de volgende keer anders wilt doen.", "groups": [{"title": "Mijn belangrijkste praktijkmoment", "fields": [{"id": "f6_0_0", "label": "Wat gebeurde er?"}, {"id": "f6_0_1", "label": "Wat deed ik zelf?"}, {"id": "f6_0_2", "label": "Wat was het effect op de gast of het team?"}, {"id": "f6_0_3", "label": "Wat heb ik hiervan geleerd?"}]}, {"title": "Feedback van mijn praktijkbegeleider", "fields": [{"id": "f6_1_0", "label": "Naam / functie praktijkbegeleider en datum"}, {"id": "f6_1_1", "label": "TOP: wat doe ik goed?"}, {"id": "f6_1_2", "label": "TIP: wat kan ik verder ontwikkelen?"}, {"id": "f6_1_3", "label": "Wat ga ik met deze feedback doen?"}]}, {"title": "Mijn bewijsbank", "fields": [{"id": "f6_2_0", "label": "Welk bewijs heb ik verzameld?"}, {"id": "f6_2_1", "label": "Wat laat dit bewijs zien?"}, {"id": "f6_2_2", "label": "Waar gebruik ik het voor?"}]}, {"title": "Mijn reflectie (250–300 woorden)", "fields": [{"id": "f6_3_0", "label": "Wat heb ik over mijn gasten geleerd dat ik eerst niet wist?"}, {"id": "f6_3_1", "label": "Welke aanname bleek wel of niet te kloppen?"}, {"id": "f6_3_2", "label": "Wat heb ik geleerd door collega’s te spreken?"}, {"id": "f6_3_3", "label": "Wat doe ik nu anders in het contact met deze gast?"}, {"id": "f6_3_4", "label": "Waar wil ik mij in de volgende fase verder in ontwikkelen?"}, {"id": "f6_3_5", "label": "Mijn volledige reflectie van 250–300 woorden"}]}], "ref": "6. Feedback en persoonlijke ontwikkeling / 7. Mijn reflectie"}, {"title": "Bereid je PowerPoint voor", "intro": "Maak zelf je PowerPoint met zeven dia’s. Gebruik de belangrijkste resultaten van je eigen onderzoek. De app helpt met een overzicht, maar maakt de presentatie niet voor je.", "tip": "Gebruik weinig tekst per dia. Laat een concreet praktijkvoorbeeld zien en vertel mondeling wat je ontdekte.", "theory": "Een sterke presentatie bevat de hoofdpunten van je onderzoek, niet alle antwoorden uit het werkboek. Gebruik alleen foto’s die je mag delen.", "groups": [{"title": "Mijn selectie voor de presentatie", "fields": [{"id": "f7_0_0", "label": "Mijn gasttype in één zin"}, {"id": "f7_0_1", "label": "Mijn drie belangrijkste ontdekkingen"}, {"id": "f7_0_2", "label": "Mijn sterkste bewijs"}, {"id": "f7_0_3", "label": "Mijn belangrijkste verbeterpunt"}, {"id": "f7_0_4", "label": "Wat wil ik dat de kijker of luisteraar onthoudt?"}]}], "ref": "8. Mijn PowerPoint – 7 dia’s"}, {"title": "Controle en docentgesprek", "intro": "Controleer je onderzoek en PowerPoint. Laat beide aan je docent zien. De docent geeft feedback en bepaalt of je kunt doorgaan naar fase 2.", "tip": "Zorg dat je drie observaties, twee interviews, je persona, analyse, feedback, reflectie en je eigen PowerPoint kunt laten zien.", "theory": "Een GO/NO-GO is een begeleidingsafspraak in deze projectroute. Het is niet automatisch een officieel examencijfer.", "groups": [{"title": "Mijn terugblik", "fields": [{"id": "f8_0_0", "label": "Dit heb ik gedaan"}, {"id": "f8_0_1", "label": "Dit heb ik ontdekt"}, {"id": "f8_0_2", "label": "Dit is mijn sterkste bewijs"}, {"id": "f8_0_3", "label": "Deze feedback heb ik gebruikt"}, {"id": "f8_0_4", "label": "Hier ben ik trots op"}, {"id": "f8_0_5", "label": "Dit neem ik mee naar de volgende fase"}]}], "ref": "9. Mijn checkpoint / Mijn eindcheck"}], "phases": [["Gastanalyse", "Ontdek wie jouw gasten zijn", "7 dia’s"], ["Passend aanbod", "Adviseer gasten op een passende manier", "3–4 dia’s"], ["Reflectie", "Laat zien wat je hebt geleerd", "2–3 dia’s"], ["Commerciële kansen", "Ontdek verbeterkansen", "3–4 dia’s"], ["Uitvoeren en evalueren", "Breng je verbetering in de praktijk", "3–4 dia’s"]], "docs": {"1": "01 Template_Fase1_Gastanalyse_HERZIEN_MET_GROENE_VOORBEELDEN.docx", "3": "03 Template_Fase2_Passend_Aanbod_MET_VOORBEELDEN_WERKVERSIE.docx", "5": "05 Template_Fase3_Reflectie_ZWART_GROENE_VOORBEELDEN.docx", "7": "07 Template_Fase4_Commerciele_Kansen_Strategieen_WERKVERSIE.docx", "9": "09 Template_Fase5_Implementatie_Commerciele_Verbeterpunten_WERKVERSIE.docx"}};

const store={};const PHASE_TASKS={"2":[{"title":"Verder met mijn gast uit fase 1","intro":"Gebruik hetzelfde gasttype en de gastanalyse uit fase 1. Beschrijf daarna de guest journey: wat beleeft je gast bij de verschillende contactmomenten?","fields":["Wat is mijn gekozen gasttype?","Welke behoeften en verbeterpunten ontdekte ik in fase 1?","Vooraf: wat verwacht de gast?","Ontvangst: wat gebeurt er en wat heeft de gast nodig?","Tijdens het bezoek: wat gebeurt er en wat heeft de gast nodig?","Afrekenen en afscheid: wat gebeurt er en wat heeft de gast nodig?","Na het bezoek: wat kan mijn bedrijf doen?"],"example":"Een lunchgast wil vooraf de kaart kunnen bekijken, wordt bij binnenkomst begroet en wil bij het bestellen weten hoe lang het duurt.","lesson":"Een guest journey is de reis van de gast langs de contactmomenten. Kijk naar de hele ervaring en gebruik je bevindingen uit fase 1.","slides":[]},{"title":"Mijn passende aanbod","intro":"Ontwerp een aanbod dat aansluit op de behoeften van jouw gasttype.","fields":["Welk product, welke dienst of welk advies bied ik aan?","Welke behoefte van de gast past hierbij?","Waarom past dit bij mijn leerbedrijf?","Wat kost het of welke voorwaarden gelden?","Hoe vertel ik dit duidelijk en gastgericht aan de gast?","Wat moet ik nog controleren?"],"example":"Voor een lunchgast met weinig tijd adviseer je een lunchcombinatie waarvan je weet dat deze snel kan worden geserveerd.","lesson":"Een passend aanbod helpt de gast écht. Controleer altijd beschikbaarheid, prijs en afspraken op je werkplek. Verzin geen beloftes.","slides":[]},{"title":"Akkoord van mijn praktijkbegeleider","intro":"Bespreek het aanbod vóórdat je het in echte gastcontacten gebruikt.","fields":["Wat heb ik aan mijn praktijkbegeleider laten zien?","Welke feedback kreeg ik?","Welke aanpassing heb ik gedaan?","Naam praktijkbegeleider en datum","Is er toestemming om dit aanbod uit te proberen?"],"example":"Mijn praktijkbegeleider vond het aanbod passend, maar vroeg me eerst de actuele prijzen te controleren.","lesson":"Vraag expliciet toestemming. Een docent-GO en toestemming van je praktijkbegeleider zijn niet hetzelfde.","slides":[]},{"title":"Drie gastinteracties","intro":"Probeer het goedgekeurde aanbod in drie echte gastcontacten. Noteer wat er gebeurde zonder persoonsgegevens van gasten.","fields":["Gastcontact 1: situatie, mijn advies en reactie van de gast","Gastcontact 2: situatie, mijn advies en reactie van de gast","Gastcontact 3: situatie, mijn advies en reactie van de gast","Wat ging goed in deze drie contacten?","Wat viel mij op en wat kan beter?"],"example":"Bij het eerste contact vroeg de gast naar de wachttijd. Ik gaf twee opties; de gast koos de snelste.","lesson":"Noteer feitelijk wat je deed, zei en hoorde. Een gast die nee zegt, levert ook een leerervaring op.","slides":[]},{"title":"Mijn gastadviesrapport","intro":"Beschrijf één van de gastcontacten van voorbereiding tot afhandeling.","fields":["Voorbereiding: wat wist ik over de gastbehoefte?","Het gesprek: wat vroeg ik en welk advies gaf ik?","Afhandeling: wat spraken we af en hoe rondde ik af?","Terugkijken: wat ging goed en wat zou ik anders doen?"],"example":"Ik vroeg eerst waar de gast naar zocht, noemde twee opties en controleerde of mijn uitleg duidelijk was.","lesson":"Een goed gastadviesrapport laat je aanpak zien: voorbereiden, luisteren, passend adviseren, afronden en terugkijken.","slides":[]},{"title":"Reflectie op mijn communicatie","intro":"Kijk terug op hoe jij communiceerde tijdens de gastcontacten.","fields":["Hoe luisterde ik naar de gast?","Hoe stelde ik vragen en gaf ik uitleg?","Hoe reageerde ik op twijfels of een nee?","Wat kan ik nu beter?","Wat wil ik blijven oefenen?"],"example":"Ik merkte dat ik eerst te snel een product noemde. Later vroeg ik beter door naar wat de gast nodig had.","lesson":"Reflecteren is niet alleen zeggen dat iets goed of slecht ging. Noem een echt moment, je aanpak en wat je ervan leert.","slides":[]},{"title":"PowerPoint fase 2 en GO/NO-GO","intro":"Voeg je nieuwe resultaten toe aan je bestaande PowerPoint en bespreek je werk met je docent.","fields":["Welke onderdelen zijn af en wat moet ik nog controleren?","Welke feedback kreeg ik van mijn docent?","Wat neem ik mee naar fase 3?"],"example":"Laat een foto van je aanbod zien en vertel wat je tijdens drie echte gastcontacten ontdekte.","lesson":"Voeg dia’s toe aan de presentatie uit fase 1; maak niet opnieuw een presentatie.","slides":["Mijn guest journey","Mijn passende aanbod","Drie gastcontacten en gastadvies","Wat ik heb geleerd van mijn communicatie"]}],"3":[{"title":"Wat heb ik geleerd van fase 1 en 2?","intro":"Kijk terug op je onderzoek, je gastcontacten en je ontwikkeling.","fields":["Wat ging goed in fase 1 en welk voorbeeld laat dat zien?","Wat ging goed in fase 2 en welk voorbeeld laat dat zien?","Welke sterke punten heb ik in gastgerichtheid en communicatie?","Wat vond ik lastig of waar ging het mis?","Wat heb ik daardoor geleerd?"],"example":"Ik leerde bij observaties beter kijken naar wat gasten écht vragen. Bij het adviseren durfde ik meer door te vragen.","lesson":"Gebruik concrete voorbeelden uit fase 1 en 2. Reflectie gaat over jouw handelen en ontwikkeling.","slides":[],"sourceTip":"VOORBEELD / TIP  |  Je hoeft niet te bewijzen dat alles perfect ging. Juist een lastig gesprek kan laten zien wat je hebt geleerd."},{"title":"Twee of drie leerdoelen","intro":"Maak twee of drie haalbare leerdoelen en leg uit hoe je ermee gaat oefenen.","fields":["Leerdoel 1: wat wil ik verbeteren?","Leerdoel 1: hoe ga ik oefenen en wanneer is het gelukt?","Leerdoel 2: wat wil ik verbeteren?","Leerdoel 2: hoe ga ik oefenen en wanneer is het gelukt?","Eventueel leerdoel 3 en aanpak"],"example":"Ik wil bij elk adviesgesprek eerst minstens één open vraag stellen en mijn begeleider vragen of dat lukt.","lesson":"Een goed leerdoel is concreet, haalbaar en te controleren. Schrijf niet alleen: ik wil beter worden.","slides":[],"sourceTip":"VOORBEELD / TIP  |  Fase 1: “Ik ontdekte dat lunchgasten vaak weinig tijd hebben.” Fase 2: “Ik vroeg eerst hoeveel tijd een gast had en gaf daarna een passend advies.”"},{"title":"Mijn reflectieverslag","intro":"Schrijf een reflectieverslag van maximaal 500 woorden over je ontwikkeling in fase 1 en 2.","fields":["Mijn reflectieverslag (maximaal 500 woorden)"],"example":"Ik vond het lastig om een gast te adviseren. Door eerst te luisteren en door te vragen, werd mijn advies duidelijker.","lesson":"Beschrijf wat je deed, wat er gebeurde, wat je voelde of dacht, wat je leerde en wat je volgende keer anders doet.","slides":[],"sourceTip":"VOORBEELD / TIP  |  Bijvoorbeeld: rustig luisteren, vriendelijk begroeten, doorvragen, een duidelijke uitleg geven of rekening houden met dieetwensen."},{"title":"Gesprek met mijn praktijkbegeleider","intro":"Bespreek je ontwikkeling en leerdoelen met je praktijkbegeleider.","fields":["Datum en naam praktijkbegeleider","Welke feedback kreeg ik over mijn gastgerichtheid?","Welke feedback kreeg ik over mijn communicatie?","Wat spreken we af voor mijn ontwikkeling?"],"example":"Mijn praktijkbegeleider zag dat ik meer initiatief neem en adviseerde me rustiger te spreken tijdens drukte.","lesson":"Vraag om een concreet voorbeeld bij feedback. Leg vast wat je met de feedback gaat doen.","slides":[],"sourceTip":"VOORBEELD / TIP  |  Bijvoorbeeld: te snel adviseren, vergeten door te vragen, zenuwachtig zijn of niet weten hoe je op een klacht reageert. Beschrijf ook hoe je ermee omging."},{"title":"PowerPoint fase 3 en eindpresentatie niveau 2","intro":"Maak de laatste dia’s en bereid de complete presentatie van fase 1–3 voor.","fields":["Wat zijn mijn belangrijkste leerpunten?","Welke feedback van mijn begeleider wil ik laten zien?","Welke onderdelen van mijn complete presentatie moet ik nog verbeteren?","Welke feedback kreeg ik van mijn docent?"],"example":"Laat met twee echte praktijkmomenten zien hoe je als medewerker bent gegroeid.","lesson":"Niveau 2 is een volwaardige afronding. Gebruik je eerdere dia’s en voeg alleen de nieuwe reflectiedia’s toe.","slides":["Mijn ontwikkeling in fase 1 en 2","Mijn leerdoelen en feedback","Mijn conclusie en volgende stap"],"sourceTip":"VOORBEELD / TIP  |  Te vaag: “Ik wil beter communiceren.” Concreet: “Bij de komende vijf adviesgesprekken stel ik eerst twee vragen over de wensen van de gast, voordat ik iets aanbeveel.”"}],"4":[{"title":"Waar liggen commerciële kansen?","intro":"Gebruik je bestaande gasttype en guest journey om kansen te ontdekken die goed zijn voor gast én bedrijf.","fields":["Welke gastbehoeften en verbeterpunten neem ik mee uit eerdere fases?","Contactmoment 1: wat gebeurt er en welke kans zie ik?","Contactmoment 2: wat gebeurt er en welke kans zie ik?","Contactmoment 3: wat gebeurt er en welke kans zie ik?","Welke commerciële kans lijkt het meest geschikt en waarom?"],"example":"Bij het bestellen van koffie kun je een passend gebakje aanbieden als de gast daar belangstelling voor heeft.","lesson":"Een commerciële kans is niet alleen meer verkopen: het advies moet passen bij wat de gast nodig heeft.","slides":[],"sourceTip":"VOORBEELD / TIP  |  Je zag in fase 2 dat lunchgasten vaak haast hebben. Misschien kun je een snelle lunchcombinatie duidelijker aanbieden. Onderzoek eerst of dit echt een kans is."},{"title":"Probeer verkoopstrategieën uit","intro":"Probeer in verschillende situaties verkoopstrategieën en registreer wat er gebeurt.","fields":["Situatie 1: gastbehoefte, techniek, advies en reactie","Situatie 2: gastbehoefte, techniek, advies en reactie","Situatie 3: gastbehoefte, techniek, advies en reactie","Welke aanpak werkte en wat viel tegen?","Wat zeggen de gastreacties?"],"example":"Cross-selling: een passend extra product aanbieden. Upselling: een betere of uitgebreidere variant adviseren wanneer die echt past.","lesson":"Blijf gastgericht en vraag toestemming waar nodig. Noteer ook wanneer een gast niet ingaat op het aanbod.","slides":[],"sourceTip":"VOORBEELD / TIP  |  De officiële projectopdracht behandelt fase 4 en 5 samen. Wij gebruiken fase 4 voor onderzoeken, kort uitproberen en een plan maken. Het uitvoeren gedurende minimaal vier weken, meten en evalueren gebeurt in fase 5."},{"title":"Maak een verbetervoorstel","intro":"Werk één uitvoerbare verbetering uit voor je leerbedrijf.","fields":["Wat wil ik verbeteren?","Welke gastbehoefte en commerciële kans ondersteunt dit?","Hoe gaat het in de praktijk werken?","Welke mensen of materialen zijn nodig?","Hoe kan ik resultaat meten?","Welke risico’s of voorwaarden zie ik?"],"example":"We spreken af dat medewerkers vier weken bij passende lunchbestellingen een drankje adviseren en het aantal reacties tellen.","lesson":"Maak het voorstel concreet en meetbaar. Het moet in fase 5 echt uitvoerbaar zijn.","slides":[],"sourceTip":"VOORBEELD / TIP  |  Restaurant: gasten weten niet dat er een alcoholvrij arrangement is. Hotel: bij aankomst wordt het ontbijt niet genoemd. Lunchroom: een lunchdeal staat niet duidelijk op de kaart. Het hoeft niet om een nieuw product te gaan."},{"title":"Bespreek je plan met je praktijkbegeleider","intro":"Vraag feedback op je voorstel en leg voorwaarden voor de uitvoering vast.","fields":["Naam praktijkbegeleider en datum","Welke feedback kreeg ik?","Welke onderdelen heb ik aangepast?","Welke voorwaarden gelden voor de uitvoering?","Wat moet nog geregeld worden vóór fase 5?"],"example":"De praktijkbegeleider wil dat we de telling anoniem houden en het aanbod eerst met het team bespreken.","lesson":"Een docent-GO voor fase 4 betekent niet automatisch toestemming om te starten met de uitvoering.","slides":[],"sourceTip":"VOORBEELD / TIP  |  Upselling: een grotere of luxere variant adviseren wanneer dat echt bij de gast past. Cross-selling: een passend extra product aanbieden, bijvoorbeeld soep bij een lunch. Een nee van de gast is ook een bruikbare uitkomst."},{"title":"PowerPoint fase 4 en GO/NO-GO","intro":"Laat de commerciële kans, je experimenten en je uitvoerbare plan zien.","fields":["Welke onderdelen zijn compleet?","Welke feedback kreeg ik van mijn docent?","Welk plan neem ik mee naar fase 5?"],"example":"Laat de gastbehoefte, je uitgeteste verkoopaanpak en je voorstel in een logische volgorde zien.","lesson":"Voeg alleen nieuwe dia’s toe aan de presentatie die je al hebt.","slides":["Mijn gasttype en commerciële kans","Geteste verkoopstrategieën en reacties","Mijn verbetervoorstel","Uitvoering en meetplan voor fase 5"],"sourceTip":"VOORBEELD / TIP  |  Voorbeeld: een zichtbaar lunchmenu met broodje en drankje, omdat veel gasten snel willen kiezen. Voor de gast is het overzichtelijk; voor het bedrijf kan het zorgen voor meer verkoop van drankjes."}],"5":[{"title":"Maak afspraken over de uitvoering","intro":"Werk het goedgekeurde plan uit fase 4 uit en vraag toestemming voor uitvoering.","fields":["Mijn verbetering uit fase 4","Wat ga ik precies doen?","Startdatum en einddatum (minimaal vier weken)","Wat ga ik meten en hoe?","Toestemming praktijkbegeleider, naam en datum","Afgesproken feedbackmomenten"],"example":"We spreken af om vier weken bij passende lunchbestellingen een drankje te adviseren en het aantal keuzes bij te houden.","lesson":"Begin pas na toestemming. De uitvoering duurt minimaal vier weken. Gebruik alleen gegevens die je mag registreren.","slides":[],"sourceTip":"VOORBEELD / TIP  |  Voorbeeld: in fase 4 heb je ontdekt dat gasten vaak geen bijpassend drankje aangeboden krijgen. In fase 5 spreek je met je begeleider af hoe je dat vier weken gaat verbeteren en bijhouden."},{"title":"Voer mijn verbetering vier weken uit","intro":"Houd minimaal vier weken een logboek bij van uitvoering, gastreacties en feedback.","fields":["Week 1: wat deed ik, resultaat en feedback?","Week 2: wat deed ik, resultaat en feedback?","Week 3: wat deed ik, resultaat en feedback?","Week 4: wat deed ik, resultaat en feedback?","Extra weken of bijzondere gebeurtenissen"],"example":"In week 2 was het druk; daardoor kon ik mijn advies niet altijd geven. Dat noteer ik ook.","lesson":"Schrijf per week feitelijk wat er gebeurde. Vier weken uitvoering is een minimum, niet vier ingevulde zinnen zonder praktijk.","slides":[],"sourceTip":"VOORBEELD / TIP  |  Bijvoorbeeld: vier weken bij een lunchbestelling een passend drankje adviseren. Noteer hoe vaak je dit aanbiedt en hoe vaak gasten ervoor kiezen. Gebruik alleen gegevens die je mag registreren."},{"title":"Houd de bijverkoop bij","intro":"Registreer je verkooptechnieken, het aantal aanbiedingen en het aantal keren dat gasten het aanbod kozen.","fields":["Registratie 1: datum, techniek, aanbod, aantal aangeboden en gekozen","Registratie 2: datum, techniek, aanbod, aantal aangeboden en gekozen","Registratie 3: datum, techniek, aanbod, aantal aangeboden en gekozen","Registratie 4: datum, techniek, aanbod, aantal aangeboden en gekozen","Totaal aantal aanbiedingen","Totaal aantal keren gekozen","Welke gastreacties vielen op?"],"example":"Ik bood twintig keer een passend drankje aan; zeven gasten kozen het. Een nee telt ook mee.","lesson":"Gebruik echte aantallen. Vermeld het eerlijk wanneer gegevens niet beschikbaar zijn.","slides":[],"sourceTip":"VOORBEELD / TIP  |  Een actie hoeft niet elke dag perfect te verlopen. Schrijf ook op wanneer een gast nee zegt, of wanneer het te druk was om jouw aanpak te gebruiken."},{"title":"Bekijk de resultaten","intro":"Vergelijk je logboek en bijverkoopregistratie en bespreek beschikbare gegevens met je begeleider.","fields":["Wat werkte goed? Noem een aantal of voorbeeld.","Wat werkte minder goed?","Wat zeggen de gastreacties over tevredenheid?","Welke omzet- of verkoopgegevens zijn beschikbaar?","Welke conclusie kan ik op basis van deze gegevens wel en niet trekken?"],"example":"Zeven van twintig aanbiedingen werden gekozen. Dat zegt iets over deze acties, maar niet automatisch over de totale omzet.","lesson":"Trek alleen conclusies die je met je gegevens kunt function loadProject(e){const f=e.target.files?.[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(reader.result);if(!['SVO-Gastvrijheid-Projectcoach','SVO-Gastvrijheid-Fase1'].includes(obj.format)||!obj.answers||typeof obj.answers!=='object'||Array.isArray(obj.answers))throw Error('Onbekend projectbestand');if(Object.keys(store).some(k=>String(store[k]||'').trim())&&!confirm('Bestaande antwoorden vervangen door het gekozen projectbestand?'))return;for(const k of Object.keys(store))delete store[k];for(const [k,v] of Object.entries(obj.answers)){if(/^(f[1-8]_\d+_\d+|personal\d+|p[2-5]_\d+_\d+)$/.test(k)&&typeof v==='string')store[k]=v.slice(0,30000)}changed=false;render();alert('Je project is geladen.');}catch(err){alert('Dit bestand is geen geldig Projectcoach-projectbestand.')}e.target.value='';};reader.readAsText(f);}

isch naar school verstuurd.</p></div>`}

const THEORY=[[["Wat betekent het?", "Gastvrijheid begint bij aandacht voor de gast. Gastcontact is ieder moment waarop een gast contact heeft met jouw bedrijf: bij ontvangst, een vraag, een bestelling, een klacht of het afscheid."], ["Hoe pak je het aan?", "Beschrijf eerst jouw bedrijf: wat voor bedrijf is het, wie komen er en wat doe jij? Benoem daarna op welke momenten je gasten ontmoet. Maak een haalbare planning: wanneer kun je observeren en wanneer kun je collega's spreken?"], ["Voorbeeld uit de praktijk", "Bij een lunchroom begint gastcontact al wanneer iemand binnenkomt. Een medewerker kijkt op, begroet de gast en helpt met een tafel. Ook dat is een onderzoeksmoment."], ["Veelgemaakte fout", "Schrijf niet alleen 'het is gezellig'. Beschrijf wat je ziet: hoe worden gasten begroet, geholpen en uitgezwaaid?"]], [["Wat betekent het?", "Een gasttype is een groep gasten met vergelijkbare wensen of omstandigheden. Denk aan lunchgasten met weinig tijd, gezinnen met kinderen of gasten die advies willen. Dat zijn voorbeelden, geen vaste hokjes."], ["Hoe pak je het aan?", "Kies één gasttype dat je op jouw werkplek echt kunt onderzoeken. Beschrijf waarom je dit type kiest. Maak onderscheid tussen wat je al weet, wat je vermoedt en wat je nog wilt uitzoeken."], ["Voorbeeld uit de praktijk", "Je vermoedt dat zakelijke lunchgasten snel willen eten. Dat is een aanname. Als je meerdere gasten naar de bereidingstijd hoort vragen, heb je een observatie die je kunt onderzoeken."], ["Veelgemaakte fout", "Niet iedere gast uit dezelfde groep wil hetzelfde. Onderzoek verschillen en schrijf geen stereotiepe conclusies op."], ["Welke soorten gasten kun je tegenkomen?", "Je kunt gasten indelen naar hun situatie of wat ze nodig hebben. Voorbeelden zijn: zakelijke gasten (duidelijke afspraken en soms weinig tijd), recreatieve gasten (ontspanning en sfeer), gezinnen met kinderen (gemak en passende keuzes), vaste gasten (herkenning), internationale gasten (duidelijke communicatie), gasten met dieetwensen of allergieën (betrouwbare informatie), gasten die iets vieren (persoonlijke aandacht) en gasten met een klacht (serieus genomen worden). Dit zijn mogelijke behoeften, geen vaste eigenschappen van iedere gast."], ["Acht voorbeelden uit de praktijk", "1. Zakelijke lunchgast: vraagt hoe snel een gerecht klaar is. 2. Recreatieve gast: wil rustig zitten en advies over lokale producten. 3. Gezin: vraagt om kindvriendelijke keuzes. 4. Vaste gast: vindt herkenning prettig. 5. Internationale gast: vraagt om uitleg in een andere taal. 6. Gast met allergie: wil betrouwbare informatie over ingrediënten. 7. Feestelijke groep: wil samen iets bijzonders beleven. 8. Gast met klacht: wil gehoord worden en een oplossing. Kijk steeds wat déze gast werkelijk vraagt."], ["Hoe kies je jouw gasttype?", "Kijk welke gasten je vaak ziet op jouw leerbedrijf. Kies een groep die je tijdens het werk echt kunt observeren en waarover je twee collega’s kunt spreken. Beschrijf waarom je die groep kiest. Je hoeft nog niet alles over deze gasten te weten: dat ga je juist onderzoeken."], ["Meer lezen in de SVH-magazines", "Bekijk in je ELO de magazines Soorten gasten, De gast centraal en Gasten ontvangen. Die geven aanvullende uitleg. De Projectcoach bevat de basis die je nodig hebt om te beginnen."]], [["Wat betekent het?", "Observeren betekent bewust kijken en luisteren zonder meteen een oordeel te geven. Een feit is wat je werkelijk ziet of hoort. Een interpretatie is wat jij denkt dat dit betekent."], ["Hoe pak je het aan?", "Observeer drie verschillende gastcontacten. Noteer per contact de situatie, wat de gast zei of deed, wat de medewerker deed en hoe de gast reageerde. Schrijf daarna pas op welke behoefte je herkent en welk bewijs je daarvoor hebt."], ["Voorbeeld uit de praktijk", "Feit: 'De gast vroeg twee keer hoe lang de bestelling nog duurde.' Interpretatie: 'Misschien had de gast haast.' Onderbouwing: 'De gast zei dat hij binnen een half uur terug moest zijn.'"], ["Veelgemaakte fout", "Schrijf geen 'de gast was ongeduldig' zonder concreet gedrag te noemen. Noteer geen herkenbare persoonsgegevens van gasten."]], [["Wat betekent het?", "Een interview is een gericht gesprek waarmee je informatie verzamelt. Open vragen beginnen vaak met 'wat', 'hoe' of 'welke'. Doorvragen helpt om concrete voorbeelden te krijgen."], ["Hoe pak je het aan?", "Spreek twee collega's die ervaring hebben met jouw gekozen gasttype. Vraag welke wensen zij herkennen, wat goed werkt en wat beter kan. Noteer hun antwoorden en vergelijk daarna wat overeenkomt en wat verschilt."], ["Voorbeeld uit de praktijk", "Vraag: 'Welke vragen stellen lunchgasten vaak?' Doorvraag: 'Kun je een voorbeeld noemen van afgelopen week?' Zo krijg je meer dan alleen 'ze hebben haast'."], ["Veelgemaakte fout", "Stel niet alleen vragen waarop 'ja' of 'nee' mogelijk is. Neem antwoorden niet automatisch als feiten aan: vergelijk ze met je eigen observaties."]], [["Wat betekent het?", "Een persona is een verzonnen voorbeeldgast die een herkenbaar gasttype vertegenwoordigt. De naam mag fictief zijn, maar de wensen en kenmerken baseer je op jouw onderzoek. Een gastanalyse legt uit wat je uit observaties en interviews hebt geleerd."], ["Hoe pak je het aan?", "Gebruik je drie observaties en twee interviews. Beschrijf de persona: situatie, belangrijkste wensen, verwachtingen en mogelijke knelpunten. Leg daarna uit welke patronen je terugziet en welk bewijs daarbij hoort."], ["Voorbeeld uit de praktijk", "Persona: 'Sam, lunchgast met beperkte pauzetijd.' Observaties laten zien dat gasten naar wachttijden vragen. Collega's noemen duidelijke tijdinformatie belangrijk. Analyse: vooraf de wachttijd aangeven kan onzekerheid wegnemen."], ["Veelgemaakte fout", "Een persona is geen fantasieverhaal. Zet geen echte gastnaam of herkenbare persoonlijke informatie in je werk. Schrijf bij je conclusies waar je ze op baseert."], ["Van gasttype naar persona", "Een gasttype is een brede groep, zoals lunchgasten die weinig tijd hebben. Een persona is één verzonnen voorbeeldpersoon die de belangrijkste kenmerken van die groep zichtbaar maakt. Je verzint bijvoorbeeld een naam en situatie, maar de behoeften baseer je op echte observaties en gesprekken."], ["Een persona stap voor stap", "1. Kies het gasttype dat je onderzocht. 2. Lees je drie observaties terug. 3. Vergelijk de antwoorden van twee collega’s. 4. Noteer twee of drie behoeften die vaker terugkomen. 5. Maak een herkenbaar voorbeeldprofiel. 6. Schrijf bij je analyse welk bewijs je hebt en wat het bedrijf hiermee kan."], ["Voorbeeld: Sam in de lunchroom", "Sam is een fictieve lunchgast met een korte pauze. In je observaties vroegen meerdere gasten naar wachttijden. Twee collega’s vertelden dat een duidelijke tijdsinschatting helpt. In je persona schrijf je dat Sam snel duidelijkheid wil. In je analyse leg je uit waarop je die conclusie baseert en dat vooraf informeren over wachttijd kan helpen."], ["Feit, aanname en conclusie", "Feit: een gast vraagt naar de wachttijd. Aanname: deze gast heeft haast. Onderbouwde conclusie: meerdere observaties en collega’s laten zien dat duidelijke tijdinformatie voor dit gasttype belangrijk is. Trek nooit een conclusie alleen omdat een gast tot een bepaalde groep behoort."], ["Meer lezen in de SVH-magazines", "Bekijk in je ELO Soorten gasten en De gast centraal voor aanvullende achtergrond over verwachtingen, behoeften en gastgericht handelen."]], [["Wat betekent het?", "Feedback is informatie van iemand anders over wat goed gaat en wat beter kan. Reflecteren is zelf terugkijken op je handelen, de gevolgen en je volgende stap."], ["Hoe pak je het aan?", "Vraag je praktijkbegeleider om een concrete TOP en TIP. Beschrijf daarna wat je hebt gedaan, wat je opviel, wat je hebt geleerd en wat je volgende keer wilt proberen."], ["Voorbeeld uit de praktijk", "TOP: 'Je stelde een duidelijke vervolgvraag.' TIP: 'Geef gasten meer tijd om te antwoorden.' Reflectie: 'Ik merkte dat ik snel invulde wat iemand wilde; volgende keer luister ik eerst uit.'"], ["Veelgemaakte fout", "'Het ging goed' is geen sterke reflectie. Beschrijf een echte situatie en wat jij daaruit meeneemt."]], [["Wat betekent het?", "Een PowerPoint ondersteunt jouw mondelinge verhaal. Een goede dia heeft één duidelijke boodschap, weinig tekst en bij voorkeur een relevant beeld. Je presentatie is geen kopie van je werkboek."], ["Hoe pak je het aan?", "Gebruik de zeven voorgestelde dia's als inhoudelijke basis. Kies je beste onderzoeksresultaten. Voeg eigen foto's toe van je bedrijf, werkplek en activiteiten; laat waar mogelijk jezelf aan het werk zien. Schrijf kernwoorden en vertel de rest zelf."], ["Voorbeeld uit de praktijk", "Minder sterk: een dia met vijftien regels tekst over de ontvangst. Sterker: een eigen foto van de ontvangstbalie met 'Begroeting – Oogcontact – Duidelijkheid', waarbij jij een concrete situatie toelicht."], ["Veelgemaakte fout", "Gebruik geen verzonnen praktijkfoto's of AI-beelden alsof het jouw werk is. Vraag toestemming voor herkenbare personen en volg de fotoregels van je bedrijf."]], [["Wat betekent het?", "Afronden betekent controleren of jouw onderzoek logisch, compleet en begrijpelijk is. Een docentcontrole helpt je bepalen of je verder kunt; dat is niet automatisch een officieel examencijfer."], ["Hoe pak je het aan?", "Lees je antwoorden terug: heb je het gasttype beschreven, drie observaties gemaakt, twee collega's gesproken, een onderbouwde persona gemaakt en gereflecteerd? Kun je in je eigen woorden uitleggen hoe je conclusies zijn ontstaan?"], ["Voorbeeld uit de praktijk", "Een docent vraagt: 'Waarom denk je dat snelheid belangrijk is?' Jij kunt verwijzen naar een observatie én een uitspraak van een collega."], ["Veelgemaakte fout", "Alle vakjes vullen is niet hetzelfde als goed onderzoek doen. Controleer of je voorbeelden echt zijn en je conclusies bij het bewijs passen."]]];
function theoryHTML(i){return THEORY[i].map(([head,body])=>`<div class="theoryitem"><h4>${esc(head)}</h4><p>${esc(body)}</p></div>`).join("")}

function storyCard(item,i,phaseNumber){
const fields=item.refs.map(r=>{const f=phaseNumber===1?fieldAt(r):{id:`p${phaseNumber}_${r[0]}_${r[1]}`};return getVal(f.id).trim()}).filter(Boolean);
return `<div class="summarycard"><div class="sectionheading">DIA ${i+1} · PRESENTEER JE EIGEN VERHAAL</div><h3>${esc(item.title)}</h3><p><strong>Dit vertel je:</strong> ${esc(item.lead)}…</p><p class="privacy"><strong>Voorbeeld van een student:</strong> “${esc(item.example)}”</p><div class="greenhint"><strong>Jouw bouwstenen uit je onderzoek</strong>${fields.length?`<ul>${fields.slice(0,5).map(v=>`<li>${esc(v)}</li>`).join('')}</ul><p>Maak hier zelf één kort verhaal van. Neem de tekst niet letterlijk over als dat niet klopt met je ervaring.</p>`:'<p>Hier verschijnen jouw eigen antwoorden zodra je het onderzoek hebt ingevuld. Werk je op papier? Gebruik dan je werkboek.</p>'}</div><p><strong>Op de dia:</strong> een korte titel, maximaal enkele kernwoorden en een passend beeld. Vertel de rest zelf.</p><p><strong>Foto-idee:</strong> ${esc(item.photo)}</p></div>`}
function fase1DiaBouwer(){return `<div class="sectionheading">MIJN POWERPOINT · ZEVEN DIA’S</div><h3>Van onderzoek naar jouw verhaal</h3><p>Je hebt de vragen al beantwoord. Je presenteert niet de vragen, maar vertelt wat je hebt ontdekt, gedaan en geleerd. Gebruik je eigen antwoorden als bouwstenen. Het voorbeeld is fictief en niet bedoeld om letterlijk over te nemen.</p>${STORY_F1.map((x,i)=>storyCard(x,i,1)).join('')}<div class="greenhint"><strong>Maak je PowerPoint</strong><p>Gebruik het sjabloon als startpunt. Voeg je eigen kernwoorden en foto's toe. Je mag extra dia's maken.</p><div class="actions"><a class="btn" href="PowerPoint_sjabloon_Fase1_7_dias.pptx" download>↓ Download PowerPoint-sjabloon fase 1</a><button class="btn ghost" onclick="showStep(8)">Bekijk mijn volledige presentatiehulp →</button></div></div>`}
function stepContent(i){if(i===-1)return phaseIntro();if(i===8)return summaryHTML()+`<div class="actions"><a class="btn" href="PowerPoint_sjabloon_Fase1_7_dias.pptx" download>↓ PowerPoint-sjabloon fase 1</a></div>`;const s=DATA.sections[i];return `<div class="sectionheading">FASE 1 · OPDRACHT ${i+1} VAN 8</div><h2>${esc(s.title)}</h2><p>${esc(s.intro)}</p><div class="greenhint"><strong>Voorbeeld uit de praktijk</strong><p>${esc(s.tip)}</p></div><details class="theoryblock"><summary>Even opfrissen · uitleg en praktijkkennis</summary>${theoryHTML(i)}</details><details><summary>Ik loop vast. Hoe begin ik?</summary><p>Begin met een concrete situatie op je werk. Schrijf eerst op wat je hebt gezien of gehoord en gebruik de vragen hieronder. Je hoeft niet meteen een perfect antwoord te schrijven.</p></details>${i===6?fase1DiaBouwer():fieldsHTML(s)}<div class="where"><strong>Waar hoort dit bij in Word?</strong><p>Werkboek 01 · ${esc(s.ref)}</p></div><div class="footeractions"><button class="btn ghost" onclick="showStep(${i-1})">← Vorige</button><button class="btn" onclick="showStep(${i+1})">${i===7?'Naar mijn presentatiehulp →':'Volgende opdracht →'}</button></div>`}
function phaseOne(){return `<div class="topbar no-print"><button class="back" onclick="showHome()">← Terug naar projectroute</button><span class="note">Fase 1 · Werkboek 01</span></div>${toolbar()}<div class="worklayout">${stepRail()}<section class="workarea">${stepContent(step)}</section></div>`}
function phaseTasks(){return PHASE_TASKS[String(phase+1)]||[]}
function showPhaseStep(i){step=i;render();window.scrollTo({top:0,left:0,behavior:'instant'});}
function phaseRail(){const tasks=phaseTasks();return `<aside class="rail"><div class="sectionheading">FASE ${phase+1} · JOUW OPDRACHTEN</div><h3>${esc(DATA.phases[phase][0])}</h3><button class="${step===-1?'selected':''}" onclick="showPhaseStep(-1)"><span class="stepnum">⌂</span>Overzicht fase ${phase+1}</button>${tasks.map((t,i)=>`<button class="${step===i?'selected':''}" onclick="showPhaseStep(${i})"><span class="stepnum">${i+1}</span>${esc(t.title)}</button>`).join('')}<button class="${step===tasks.length?'selected':''}" onclick="showPhaseStep(${tasks.length})"><span class="stepnum">✓</span>Mijn presentatiehulp</button><div style="margin-top:16px">${doc(phase*2+1)}</div></aside>`}
function previousResearch(){const ids=['f2_1_0','f2_1_1','f5_0_0','f5_1_0','f5_1_2'];const vals=ids.map(id=>({id,val:getVal(id)})).filter(x=>x.val);return `<details><summary>Mijn eerdere onderzoek uit fase 1 bekijken</summary>${vals.length?vals.map(x=>`<p>${esc(x.val)}</p>`).join(''):'<p>Vul je gasttype en onderzoek eerst in bij fase 1, of pak je papieren werkboek erbij.</p>'}<button class="btn ghost" onclick="showPhase(0)">Naar fase 1 →</button></details>`}
function phaseSlideCards(){const items=STORY_LATER[phase+1]||[];return `<div class="greenhint"><strong>Van onderzoek naar jouw verhaal</strong><p>Voeg nieuwe dia’s toe aan je bestaande PowerPoint. Laat niet de vragen uit het werkboek zien, maar vertel wat jij in de praktijk hebt ontdekt, gedaan en geleerd. De voorbeelden zijn fictief.</p></div>${items.map((item,i)=>storyCard(item,i,phase+1)).join('')}<div class="actions"><a class="btn" href="PowerPoint_sjabloon_Fase${phase+1}.pptx" download>↓ PowerPoint-sjabloon fase ${phase+1}</a></div><p class="privacy">Dit is een inhoudelijke basis, geen verplicht maximum. Gebruik je eigen foto’s en echte resultaten.</p>`}
function phaseContent(){const tasks=phaseTasks();if(step===-1)return `<div class="sectionheading">FASE ${phase+1}</div><h2>${esc(DATA.phases[phase][0])}</h2><p>${esc(DATA.phases[phase][1])}</p><div class="greenhint"><strong>Verder bouwen op je eerdere werk</strong><p>Gebruik je antwoorden, observaties en presentatie uit de eerdere fases. Je hoeft je gasttype niet opnieuw te onderzoeken.</p></div>${previousResearch()}<div class="actions">${doc(phase*2+1)}<button class="btn" onclick="showPhaseStep(0)">Begin met opdracht 1 →</button></div><div class="info"><strong>Werken op papier of digitaal</strong><p>Gebruik het Word-werkboek, print het uit of vul de opdrachten hier in. Bewaar je digitale projectbestand regelmatig.</p></div>`;
if(step===tasks.length)return `<div class="sectionheading">FASE ${phase+1} · PRESENTATIEHULP</div><h2>Mijn nieuwe PowerPointdia’s</h2>${phaseSlideCards()}<div class="actions"><button class="btn ghost" onclick="showPhaseStep(${tasks.length-1})">← Terug naar opdracht</button></div>`;
const t=tasks[step];const isPresentation=!!t.slides.length;return `<div class="sectionheading">FASE ${phase+1} · OPDRACHT ${step+1} VAN ${tasks.length}</div><h2>${esc(t.title)}</h2><p>${esc(t.intro)}</p><div class="greenhint"><strong>Voorbeeld uit de praktijk</strong><p>${esc(t.example)}</p></div><details><summary>Even opfrissen · korte uitleg</summary><p>${esc(t.lesson)}</p>${t.sourceTip?`<p>${esc(t.sourceTip)}</p>`:''}</details>${step===0?previousResearch():''}<div class="modes"><button class="${mode==='app'?'selected':''}" onclick="chooseMode('app')">Hier in de app invullen</button><button class="${mode==='word'?'selected':''}" onclick="chooseMode('word')">Ik werk in mijn werkboek</button></div>${mode==='word'?`<div class="info"><h3>Gebruik het werkboek van fase ${phase+1}</h3><p>Je kunt het uitprinten of in Word invullen. De opdrachten hieronder volgen de inhoud van dit werkboek.</p>${doc(phase*2+1)}</div>`:`<section class="fieldgroup">${t.fields.map((f,j)=>{const id='p'+(phase+1)+'_'+step+'_'+j;return `<label for="${id}">${esc(f)}</label><textarea id="${id}" rows="3" placeholder="Schrijf wat je zelf hebt gedaan, gezien of geleerd…" oninput="updateField('${id}',this)">${esc(getVal(id))}</textarea>`}).join('')}</section>`}${isPresentation?`<h3>Maak nu je nieuwe dia’s</h3>${phaseSlideCards()}`:''}<div class="where"><strong>In het Word-werkboek</strong><p>Werkboek ${String(phase*2+1).padStart(2,'0')} · ${esc(t.title)}</p></div><div class="footeractions"><button class="btn ghost" onclick="showPhaseStep(${step-1})">← Vorige</button><button class="btn" onclick="showPhaseStep(${step+1})">${step===tasks.length-1?'Naar mijn presentatiehulp →':'Volgende opdracht →'}</button></div>`}
function otherPhase(i){return `<div class="topbar no-print"><button class="back" onclick="showHome()">← Terug naar projectroute</button><span class="note">Fase ${i+1} · Werkboek ${String(i*2+1).padStart(2,'0')}</span></div>${toolbar()}<div class="worklayout">${phaseRail()}<section class="workarea">${phaseContent()}</section></div>`}
function render(){app.innerHTML=page==='home'?home():phase===0?phaseOne():otherPhase(phase)}
window.addEventListener('beforeunload',e=>{if(changed){e.preventDefault();e.returnValue=''}});
render();
</script>
<style>
.autosave-banner{display:flex;justify-content:space-between;gap:18px;align-items:center;margin:0 0 24px;padding:14px 17px;background:#14271e;border:1px solid #246847;border-radius:12px}.autosave-banner strong{color:var(--green)}.autosave-banner small{display:block;color:#c5d7cc}.checkpoint-panel{border:1px solid #66536b;border-radius:14px;padding:20px;background:#1d1721}.checkpoint-row{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:14px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.checkpoint-row select{width:100%;background:#0f0e13;border:1px solid #625468;border-radius:8px;color:#fff;padding:10px}.checkpoint-meta{display:grid;grid-template-columns:1fr 1fr;gap:12px}.checkpoint-meta label{display:block;font-weight:650}.checkpoint-meta input,.checkpoint-panel textarea{width:100%;margin-top:5px;background:#0f0e13;border:1px solid #625468;border-radius:8px;color:#fff;padding:10px;font:inherit}.checkpoint-panel textarea{min-height:105px;resize:vertical}.example-gallery{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.example-card{border:1px solid var(--line);border-radius:15px;overflow:hidden;background:var(--panel)}.example-card img{display:block;width:100%;height:auto}.example-card-copy{padding:17px}.example-card-copy h4{margin:0 0 6px}.example-card-copy p{color:var(--muted);margin:0 0 12px}.teacher-downloads{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:15px}.teacher-downloads a{justify-content:flex-start}.desktop-note{margin:22px 0;padding:16px 18px;border-left:3px solid #d9b85f;background:#292317}.desktop-note strong{color:#f5d676}@media(max-width:900px){.checkpoint-row{grid-template-columns:1fr}.checkpoint-meta,.example-gallery,.teacher-downloads{grid-template-columns:1fr}}@media print{.checkpoint-panel{border:0;padding:0;background:white}.checkpoint-row{grid-template-columns:1fr 150px;color:black}.checkpoint-row select,.checkpoint-meta input,.checkpoint-panel textarea{border:1px solid #777;background:white;color:black}.autosave-banner{display:none}}
</style>
<script>
const PROJECT_STORAGE_KEY='svo-gastvrijheid-projectcoach-v1-1';
const CHECKPOINT_DOCS={
  0:'02 Checkpoint_Fase1_GO_NO_GO_Overdracht_Fase2.docx',
  1:'04 Checkpoint_Fase2_GO_NO_GO_Overdracht_Fase3.docx',
  2:'06 Checkpoint_Fase3_Afronding_Niveau2_Overdracht_Niveau3.docx',
  3:'08 Checkpoint_Fase4_GO_NO_GO_Overdracht_Fase5.docx'
};
const CHECKPOINTS={
  0:['Planning en beginsituatie zijn duidelijk','Eén gasttype is onderbouwd gekozen','Drie gastcontacten zijn feitelijk geobserveerd','Twee collega’s zijn geïnterviewd','Persona en gastanalyse zijn gebaseerd op bewijs','Feedback en reflectie zijn uitgewerkt','Presentatie fase 1 is voorbereid'],
  1:['Gasttype en onderzoek uit fase 1 zijn gebruikt','Guest journey is compleet beschreven','Passend aanbod sluit aan op de gastbehoefte','Praktijkbegeleider heeft toestemming gegeven','Drie echte gastinteracties zijn vastgelegd','Gastadviesrapport en communicatiereflectie zijn compleet','Presentatie fase 2 is toegevoegd'],
  2:['Fase 1 en 2 zijn met concrete voorbeelden geëvalueerd','Sterke punten en ontwikkelpunten zijn benoemd','Twee of drie haalbare leerdoelen zijn opgesteld','Reflectieverslag is compleet','Feedback van de praktijkbegeleider is verwerkt','Presentatie niveau 2 is compleet en persoonlijk'],
  3:['Hetzelfde gasttype en de guest journey zijn gebruikt','Commerciële kansen zijn op de werkplek onderzocht','Verkoopstrategieën zijn gastgericht uitgeprobeerd','Verbetervoorstel is concreet en meetbaar','Praktijkbegeleider heeft feedback gegeven','Uitvoering en meetplan voor fase 5 zijn haalbaar','Presentatie fase 4 is voorbereid']
};
let localSaveTimer=null;

function restoreLocalProject(){
  try{
    const saved=localStorage.getItem(PROJECT_STORAGE_KEY);
    if(!saved)return false;
    const parsed=JSON.parse(saved);
    const answers=parsed&&parsed.answers&&typeof parsed.answers==='object'?parsed.answers:parsed;
    if(!answers||typeof answers!=='object'||Array.isArray(answers))return false;
    for(const [key,value] of Object.entries(answers))if(typeof value==='string')store[key]=value.slice(0,30000);
    return true;
  }catch(_){return false}
}
function persistLocalProject(showStatus=false){
  try{
    localStorage.setItem(PROJECT_STORAGE_KEY,JSON.stringify({format:'SVO-Gastvrijheid-Projectcoach',version:3,savedAt:new Date().toISOString(),answers:store}));
    changed=false;
    if(showStatus){const stat=$('saveStatus');if(stat)stat.textContent='Automatisch opgeslagen om '+new Date().toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'});}
    return true;
  }catch(_){const stat=$('saveStatus');if(stat)stat.textContent='Automatisch opslaan lukt niet. Download een back-up.';return false}
}
function scheduleLocalSave(){clearTimeout(localSaveTimer);localSaveTimer=setTimeout(()=>persistLocalProject(true),350)}

const originalUpdateField=updateField;
updateField=function(id,el){originalUpdateField(id,el);scheduleLocalSave()};
const originalSaveProject=saveProject;
saveProject=function(){persistLocalProject(true);originalSaveProject()};
const originalLoadProject=loadProject;
loadProject=function(e){originalLoadProject(e);setTimeout(()=>persistLocalProject(true),600)};

function phaseRows(phaseIndex){
  if(phaseIndex===0)return DATA.sections.flatMap((section)=>section.groups.flatMap(group=>group.fields.map(field=>({group:section.title+' · '+group.title,label:field.label,value:getVal(field.id)}))));
  const tasks=PHASE_TASKS[String(phaseIndex+1)]||[];
  return tasks.flatMap((task,taskIndex)=>task.fields.map((label,fieldIndex)=>({group:task.title,label,value:getVal('p'+(phaseIndex+1)+'_'+taskIndex+'_'+fieldIndex)})));
}
function exportDocument(title,phaseIndexes){
  const sections=phaseIndexes.map(index=>'<section><h2>Fase '+(index+1)+' · '+esc(DATA.phases[index][0])+'</h2>'+phaseRows(index).map(row=>'<div class="answer"><h3>'+esc(row.group)+'</h3><strong>'+esc(row.label)+'</strong><p>'+ (esc(row.value)||'<em>Nog niet ingevuld</em>') +'</p></div>').join('')+'</section>').join('');
  return '<!doctype html><html lang="nl"><head><meta charset="utf-8"><title>'+esc(title)+'</title><style>@page{size:A4;margin:14mm}body{font:10pt/1.4 Arial,sans-serif;color:#172735;margin:0}h1{font-size:18pt}h2{font-size:14pt;color:#4a2442;break-before:page;border-bottom:2px solid #4a2442;padding-bottom:5px}section:first-of-type h2{break-before:auto}.answer{break-inside:avoid;margin:0 0 10px}.answer h3{font-size:10pt;margin:10px 0 3px;color:#35634f}.answer p{white-space:pre-wrap;margin:3px 0 9px;border-bottom:1px solid #c7c7c7;padding-bottom:7px}em{color:#777}</style></head><body><h1>'+esc(title)+'</h1><p>Geëxporteerd op '+new Date().toLocaleString('nl-NL')+'</p>'+sections+'</body></html>';
}
function exportCurrentPhase(){downloadText('Gastvrijheid_Fase_'+(phase+1)+'.html',exportDocument('Gastvrijheid in Actie · Fase '+(phase+1),[phase]),'text/html;charset=utf-8')}
function exportCompleteProject(){downloadText('Gastvrijheid_volledig_project.html',exportDocument('Gastvrijheid in Actie · Volledig project',[0,1,2,3,4]),'text/html;charset=utf-8')}

function checkpointDownload(phaseIndex){const file=CHECKPOINT_DOCS[phaseIndex];return file?'<a class="btn secondary" href="'+encodeURI(file)+'" download>↓ Word-checklist docent</a>':''}
function checkpointHTML(phaseIndex){
  const criteria=CHECKPOINTS[phaseIndex]||[];
  const rows=criteria.map((criterion,i)=>{const id='cp'+(phaseIndex+1)+'_criterion_'+i;return '<div class="checkpoint-row"><span>'+esc(criterion)+'</span><select onchange="updateField(\''+id+'\',this)"><option value="">Kies beoordeling</option><option value="Voldoende" '+(getVal(id)==='Voldoende'?'selected':'')+'>Voldoende</option><option value="Nog aanvullen" '+(getVal(id)==='Nog aanvullen'?'selected':'')+'>Nog aanvullen</option><option value="Niet van toepassing" '+(getVal(id)==='Niet van toepassing'?'selected':'')+'>Niet van toepassing</option></select></div>'}).join('');
  const base='cp'+(phaseIndex+1)+'_';
  return '<div class="sectionheading">DOCENTCHECKPOINT · FASE '+(phaseIndex+1)+'</div><h2>Beoordelingschecklist docent</h2><p>Vul de checklist in, noteer de feedback en bewaar de beoordeling als PDF. De beoordeling wordt automatisch in deze browser opgeslagen.</p><div class="checkpoint-panel"><div class="checkpoint-meta"><label>Naam student<input value="'+esc(getVal(base+'student'))+'" oninput="updateField(\''+base+'student\',this)"></label><label>Docent en datum<input value="'+esc(getVal(base+'teacher'))+'" oninput="updateField(\''+base+'teacher\',this)"></label></div>'+rows+'<label class="personalLabel">Feedback en herstelpunten<textarea oninput="updateField(\''+base+'feedback\',this)">'+esc(getVal(base+'feedback'))+'</textarea></label><label class="personalLabel">Eindbeslissing<select style="margin-left:10px;padding:9px;background:#0f0e13;color:white;border:1px solid #625468;border-radius:8px" onchange="updateField(\''+base+'decision\',this)"><option value="">Kies</option><option value="GO" '+(getVal(base+'decision')==='GO'?'selected':'')+'>GO</option><option value="NO-GO" '+(getVal(base+'decision')==='NO-GO'?'selected':'')+'>NO-GO</option></select></label><div class="actions no-print">'+checkpointDownload(phaseIndex)+'<button class="btn" onclick="window.print()">Print of bewaar als PDF</button><button class="btn ghost" onclick="exportCurrentPhase()">Exporteer fase '+(phaseIndex+1)+'</button></div></div>';
}
function openCheckpoint(){step='checkpoint';render();window.scrollTo(0,0)}

const originalStepContent=stepContent;
stepContent=function(i){return i==='checkpoint'?checkpointHTML(0):originalStepContent(i)};
const originalPhaseContent=phaseContent;
phaseContent=function(){return step==='checkpoint'?checkpointHTML(phase):originalPhaseContent()};
const originalStepRail=stepRail;
stepRail=function(){return originalStepRail().replace('</aside>','<button class="'+(step==='checkpoint'?'selected':'')+'" onclick="openCheckpoint()"><span class="stepnum">D</span><span>Docentcheckpoint</span></button><div style="margin-top:10px">'+checkpointDownload(0)+'</div></aside>')};
const originalPhaseRail=phaseRail;
phaseRail=function(){const html=originalPhaseRail();if(!CHECKPOINTS[phase])return html;return html.replace('</aside>','<button class="'+(step==='checkpoint'?'selected':'')+'" onclick="openCheckpoint()"><span class="stepnum">D</span><span>Docentcheckpoint</span></button><div style="margin-top:10px">'+checkpointDownload(phase)+'</div></aside>')};

toolbar=function(){return '<div class="toolbar no-print"><button onclick="saveProject()">↓ Back-up downloaden</button><label for="loadFile">↑ Back-up openen</label><input id="loadFile" type="file" accept=".json,application/json" style="display:none" onchange="loadProject(event)"><button onclick="exportCurrentPhase()">↓ Deze fase exporteren</button><button onclick="exportCompleteProject()">↓ Volledig project exporteren</button><span class="status" id="saveStatus">Antwoorden worden automatisch in deze browser opgeslagen.</span></div>'};

const originalHome=home;
home=function(){return '<div class="autosave-banner"><div><strong>Automatisch bewaren staat aan</strong><small>Je antwoorden en docentcheckpoints blijven lokaal in deze browser bewaard. Download regelmatig ook een back-up.</small></div><button class="btn ghost" onclick="saveProject()">Back-up downloaden</button></div>'+originalHome()+'<div class="desktop-note"><strong>Werk bij voorkeur op een laptop of computer</strong><p>Deze uitgebreide Projectcoach is bedoeld voor het volledige project en de eindpresentatie. Gebruik de mobiele projectapp in leerjaar 1, periode 1 voor snelle notities en opdrachten op je werkplek.</p></div><section class="homeguide"><div class="sectionheading">DOCENTCHECKPOINTS</div><h3>Beoordelingsformulieren per fase</h3><p>De docent kan de checklist in de Projectcoach invullen en als PDF bewaren. De oorspronkelijke Word-formulieren blijven ook beschikbaar.</p><div class="teacher-downloads">'+Object.entries(CHECKPOINT_DOCS).map(([index,file])=>'<a class="btn secondary" href="'+encodeURI(file)+'" download>↓ Checkpoint fase '+(Number(index)+1)+'</a>').join('')+'</div></section><section class="homeguide"><div class="sectionheading">VOORBEELDEN EINDPRESENTATIE</div><h3>Vertel vooral jouw eigen verhaal</h3><p>Gebruik deze voorbeelden voor de opbouw en uitstraling. Neem de inhoud niet letterlijk over. Werk met kernwoorden, eigen foto’s en resultaten uit jouw eigen onderzoek. Op de dia’s staat weinig tekst; tijdens de presentatie vertel jij zelf wat je hebt ontdekt, gedaan en geleerd.</p><div class="example-gallery"><article class="example-card"><a href="Voorbeeldpresentatie_Niveau_2.png" target="_blank"><img src="Voorbeeldpresentatie_Niveau_2.png" loading="lazy" alt="Voorbeeld van de opbouw van een presentatie voor Hospitality niveau 2"></a><div class="example-card-copy"><h4>Voorbeeldpresentatie niveau 2</h4><p>Een mogelijke opbouw van gastonderzoek, passend aanbod, uitvoering en persoonlijke ontwikkeling.</p><a class="btn ghost" href="Voorbeeldpresentatie_Niveau_2.png" target="_blank">Bekijk groot</a></div></article><article class="example-card"><a href="Voorbeeldpresentatie_Niveau_3.png" target="_blank"><img src="Voorbeeldpresentatie_Niveau_3.png" loading="lazy" alt="Voorbeeld van de opbouw van een presentatie voor Hospitality niveau 3"></a><div class="example-card-copy"><h4>Voorbeeldpresentatie niveau 3</h4><p>Een uitgebreidere opbouw met commerciële kansen, uitvoering, resultaten en aanbevelingen.</p><a class="btn ghost" href="Voorbeeldpresentatie_Niveau_3.png" target="_blank">Bekijk groot</a></div></article></div><div class="greenhint"><strong>Dit zijn voorbeelden, geen invulmodellen</strong><p>Maak je eigen presentatie met jouw leerbedrijf, jouw gasttype, jouw foto’s, jouw onderzoek en jouw conclusies.</p></div></section>'};

const restoredFromBrowser=restoreLocalProject();
render();
if(restoredFromBrowser){const stat=$('saveStatus');if(stat)stat.textContent='Eerder werk uit deze browser is geopend.';}
</script></body></html>
