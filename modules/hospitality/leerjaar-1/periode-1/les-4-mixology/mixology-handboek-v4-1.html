<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mixology Handboek V4.1</title>
<style>
:root{
  --bg:#0f1418; --panel:#171e24; --panel2:#202931; --text:#f4f6f7; --muted:#aeb9c2;
  --line:#2f3b44; --accent:#e7b857; --accent2:#8fd3c7; --danger:#ff8f8f;
  --good:#8fd3a8; --warn:#f2cf7a; --radius:18px;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:linear-gradient(180deg,#0c1115,#121920);color:var(--text)}
button,input,select{font:inherit}
button{cursor:pointer}
a{color:inherit}
.app{max-width:1180px;margin:auto;min-height:100vh;padding-bottom:80px}
.topbar{position:sticky;top:0;z-index:20;background:rgba(15,20,24,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.toprow{display:flex;gap:10px;align-items:center;padding:12px 16px}
.brand{font-weight:800;letter-spacing:.3px;white-space:nowrap}
.brand span{color:var(--accent)}
.search{flex:1;position:relative}
.search input{width:100%;background:#11181d;color:var(--text);border:1px solid var(--line);border-radius:14px;padding:11px 42px 11px 14px}
.search button{position:absolute;right:6px;top:5px;border:0;background:transparent;color:var(--muted);font-size:20px}
.iconbtn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;padding:10px 12px}
.navrow{display:flex;gap:8px;align-items:center;padding:0 16px 12px;overflow:auto}
.backbtn{border:0;background:transparent;color:var(--accent);font-weight:700;padding:6px 0}
.crumbs{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:14px;white-space:nowrap}
.crumbs button{border:0;background:transparent;color:var(--muted);padding:0}
main{padding:22px 16px}
.hero{background:radial-gradient(circle at 85% 20%,rgba(231,184,87,.16),transparent 34%),linear-gradient(135deg,#172128,#11171c);border:1px solid var(--line);border-radius:24px;padding:28px}
.hero h1{font-size:clamp(30px,5vw,56px);line-height:1;margin:0 0 12px}
.hero p{max-width:760px;color:var(--muted);font-size:18px}
.pill{display:inline-block;border:1px solid #5a4b2b;background:#221c10;color:#f4d28f;border-radius:999px;padding:6px 10px;font-size:13px;font-weight:700;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:20px}
.card{background:linear-gradient(180deg,var(--panel),#141b20);border:1px solid var(--line);border-radius:var(--radius);padding:18px;min-height:150px;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.card.click{transition:.18s transform,.18s border-color}
.card.click:hover{transform:translateY(-2px);border-color:#55646f}
.card h3{margin:8px 0 8px;font-size:21px}
.card p{color:var(--muted);margin:0;line-height:1.45}
.emoji{font-size:32px}
.section-title{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:6px 0 16px}
.section-title h2{font-size:30px;margin:0}
.section-title p{margin:0;color:var(--muted)}
.list{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;position:relative}
.item button.main{all:unset;cursor:pointer;display:block;width:100%}
.item h3{margin:2px 0 8px}
.meta{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;border:1px solid var(--line);background:#11171b;border-radius:999px;padding:5px 8px;color:#c8d0d6}
.fav{position:absolute;right:10px;top:10px;border:0;background:transparent;color:#d6d6d6;font-size:24px}
.fav.on{color:var(--accent)}
.detail-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
.detail-head h1{font-size:42px;margin:0 0 8px}
.detail-sub{color:var(--muted);font-size:18px}
.factgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}
.fact{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.fact b{display:block;color:var(--accent);font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.accordion{margin-top:18px}
.acc{border:1px solid var(--line);border-radius:15px;background:var(--panel);margin-bottom:10px;overflow:hidden}
.acc button{width:100%;display:flex;justify-content:space-between;align-items:center;background:transparent;border:0;color:var(--text);padding:15px 16px;font-weight:750;text-align:left}
.acc .body{display:none;padding:0 16px 16px;color:#d6dde2;line-height:1.55}
.acc.open .body{display:block}
.acc.open button{color:var(--accent)}
.recipe{width:100%;border-collapse:collapse;margin-top:8px}
.recipe td,.recipe th{border-bottom:1px solid var(--line);padding:10px;text-align:left}
.recipe th{color:var(--muted);font-size:13px}
.flow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.step{border:1px solid #42515c;border-radius:999px;padding:7px 10px;background:#11181d;font-size:13px}
.linkrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.linkbtn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;padding:10px 12px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filters select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px}
.flavour-bars{display:grid;gap:10px;margin-top:12px}
.barline{display:grid;grid-template-columns:120px 1fr 46px;align-items:center;gap:10px}
.bar{height:10px;background:#26323a;border-radius:999px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent))}
.notice{border-left:4px solid var(--accent);background:#1b211f;padding:14px 16px;border-radius:12px;margin:14px 0;color:#dfe5e8}
.problem{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.problem .item h3{font-size:20px}
.search-results{display:grid;gap:10px}
.result{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.empty{color:var(--muted);padding:24px 0}
.small{font-size:13px;color:var(--muted)}
footer{padding:30px 16px;color:var(--muted);font-size:13px;text-align:center}

.top10-wrap{position:relative}
.top10-wrap .item{padding-top:52px;min-height:150px}
.rank-badge{
  position:absolute;z-index:3;left:16px;top:12px;
  display:inline-flex;align-items:center;justify-content:center;
  min-width:44px;height:30px;padding:0 10px;
  border:1px solid #5a4b2b;background:#221c10;color:#f4d28f;
  border-radius:999px;font-size:13px;font-weight:800
}
.top10-wrap .fav{top:12px}
.top10-wrap .item h3{margin-top:0;padding-right:34px}



/* Practice Lab – assigned cocktail selector + walkthrough */
.fan-wrap{
  margin:22px auto 28px;
  display:grid;
  grid-template-columns:repeat(6,minmax(150px,1fr));
  gap:12px;
  align-items:stretch;
}
.fan-card{
  position:relative;width:auto;min-height:285px;padding:18px 16px;
  border-radius:22px;border:1px solid var(--line);
  background:linear-gradient(180deg,#1a242a,#11181d);
  box-shadow:0 12px 28px rgba(0,0,0,.22);
  cursor:pointer;text-align:left;color:var(--text);
  transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;
  touch-action:manipulation;
}
.fan-card:nth-child(1){transform:rotate(-3deg)}
.fan-card:nth-child(2){transform:rotate(-2deg)}
.fan-card:nth-child(3){transform:rotate(-1deg)}
.fan-card:nth-child(4){transform:rotate(1deg)}
.fan-card:nth-child(5){transform:rotate(2deg)}
.fan-card:nth-child(6){transform:rotate(3deg)}
.fan-card:hover,.fan-card:focus-visible{
  z-index:5;transform:translateY(-8px) rotate(0deg);
  border-color:#8a7440;box-shadow:0 18px 38px rgba(0,0,0,.35);
  outline:none;
}
.fan-card h3{font-size:21px;margin:8px 0;line-height:1.1}
.fan-card .glass{font-size:44px;line-height:1;margin-bottom:10px}
.fan-card .mini{color:var(--muted);font-size:13px}
.fan-card .tags{margin-top:12px}
.assign-banner{border:1px solid #5d5031;background:#201c12;border-radius:16px;padding:14px 16px;margin:14px 0}
.walk-hero{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:start}
.walk-hero .bigglass{font-size:72px}
.checklist{display:grid;gap:8px;margin-top:10px}
.checkline{display:flex;gap:10px;align-items:flex-start;background:#12191e;border:1px solid var(--line);border-radius:12px;padding:10px}
.checkline input{margin-top:3px;transform:scale(1.2)}
.tastebuttons{display:flex;gap:8px;flex-wrap:wrap}
.tastebuttons button{border:1px solid var(--line);background:#11181d;color:var(--text);border-radius:999px;padding:9px 12px}
.tastebuttons button.on{background:#2b2618;border-color:#75643d;color:#f4d28f}
.practice-done{border:1px solid #3f684e;background:#132219;border-radius:16px;padding:16px}
.practice-photo{max-width:100%;max-height:330px;border-radius:14px;border:1px solid var(--line);margin-top:10px}
.practice-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.signature-choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.signature-choice{
  border:1px solid var(--line);background:#11181d;color:var(--text);
  border-radius:16px;padding:14px;text-align:left;cursor:pointer;touch-action:manipulation
}
.signature-choice:hover,.signature-choice:focus-visible{border-color:#8a7440;outline:none}
.signature-choice.on{background:#282114;border-color:#9b7d36}
.signature-choice b{display:block;font-size:17px;margin-bottom:5px}
.signature-choice small{color:var(--muted)}
@media(max-width:1180px){.fan-wrap{grid-template-columns:repeat(3,1fr)}}
@media(max-width:760px){
 .fan-wrap{grid-template-columns:1fr 1fr;gap:10px}
 .fan-card,.fan-card:nth-child(n){min-height:220px;transform:none!important}
 .fan-card:hover,.fan-card:focus-visible{transform:none!important}
 .fan-card .glass{font-size:36px}
 .walk-hero{grid-template-columns:1fr}
 .practice-summary,.signature-choice-grid{grid-template-columns:1fr}
}
@media(max-width:430px){.fan-wrap{grid-template-columns:1fr}.fan-card{min-height:190px}}
/* Signature Serve walkthrough */
.sig-shell{max-width:980px;margin:0 auto}
.sig-progress{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:16px 0 22px}
.sig-dot{height:8px;border-radius:999px;background:#26323a}
.sig-dot.done{background:var(--accent)}
.sig-dot.active{background:var(--accent2)}
.sig-stephead{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:14px}
.sig-stephead h2{margin:0;font-size:30px}
.sig-stepnum{color:var(--accent);font-weight:800;font-size:14px}
.sig-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0}
.sig-card h3{margin:0 0 12px}
.sig-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:grid;gap:7px}
.field.full{grid-column:1/-1}
.field label{font-weight:750}
.field small{color:var(--muted)}
.field input,.field textarea,.field select{
  width:100%;background:#11181d;color:var(--text);border:1px solid var(--line);
  border-radius:12px;padding:12px 13px;outline:none
}
.field textarea{min-height:92px;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{border-color:#6c7d89}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px}
.chip{border:1px solid var(--line);background:#11181d;color:#dbe2e7;border-radius:999px;padding:7px 10px}
.chip.on{background:#2b2618;border-color:#6e5b2f;color:#f4d28f}
.tipbox{background:#141d21;border:1px dashed #45545e;border-radius:14px;padding:12px 14px;color:#c9d2d8;margin-top:10px}
.sig-actions{display:flex;justify-content:space-between;gap:10px;margin-top:20px;position:sticky;bottom:10px;background:rgba(15,20,24,.92);backdrop-filter:blur(8px);padding:10px;border:1px solid var(--line);border-radius:16px}
.primary{border:0;background:var(--accent);color:#16120a;font-weight:850;border-radius:12px;padding:12px 16px}
.secondary{border:1px solid var(--line);background:var(--panel2);color:var(--text);font-weight:750;border-radius:12px;padding:12px 16px}
.primary:disabled,.secondary:disabled{opacity:.45;cursor:not-allowed}
.photo-box{border:1px dashed #54636d;border-radius:16px;padding:14px;text-align:center;background:#11181d}
.photo-box img{max-width:100%;max-height:360px;border-radius:14px;margin-top:10px}
.photo-box input{max-width:100%}
.recipe-rows{display:grid;gap:8px}
.recipe-row{display:grid;grid-template-columns:1.4fr .7fr .7fr 42px;gap:8px}
.recipe-row input{width:100%;background:#11181d;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px}
.remove-row{border:1px solid var(--line);background:#221719;color:#ffc4c4;border-radius:10px}
.add-row{border:1px solid var(--line);background:#11181d;color:var(--text);border-radius:10px;padding:9px 11px}
.score-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.score-grid .field{background:#12191e;border:1px solid var(--line);border-radius:12px;padding:10px}
.review-block{border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0;background:#141b20}
.review-block h3{margin:0 0 8px}
.review-photo{width:min(100%,480px);border-radius:16px;border:1px solid var(--line)}
.req{color:#ffb7b7}
.kpi{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kpi .tag{font-size:13px}
@media(max-width:720px){
 .sig-grid,.score-grid{grid-template-columns:1fr}
 .recipe-row{grid-template-columns:1fr 1fr}
 .recipe-row .remove-row{grid-column:2}
 .sig-actions{bottom:6px}
}
@media print{
 body{background:white;color:#111}
 .topbar,footer,.sig-actions,.no-print{display:none!important}
 .app{max-width:none;padding:0}
 main{padding:0}
 .sig-shell{max-width:none}
 .print-sheet{display:block!important;color:#111;background:white}
 .review-block,.sig-card{break-inside:avoid;background:white;border:1px solid #bbb;color:#111}
 .tag{border-color:#bbb;background:white;color:#111}
 .review-photo{max-height:420px;object-fit:contain}
}

@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.list{grid-template-columns:repeat(2,1fr)}.factgrid{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.brand{display:none}.grid,.list,.problem,.factgrid{grid-template-columns:1fr}.hero{padding:20px}.detail-head h1{font-size:34px}.toprow{padding:10px}.navrow{padding:0 10px 10px}.barline{grid-template-columns:92px 1fr 40px}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="toprow">
      <div class="brand">MIXOLOGY <span>HANDBOEK</span></div>
      <div class="search">
        <input id="globalSearch" placeholder="Zoek op rum, limoen, shake, bitter..." aria-label="Zoeken">
        <button onclick="runSearch()">⌕</button>

  <main id="view"></main>
  <footer>Mixology Handboek V4.1 · mobiel Praktijklab + Signature keuzemenu · gegevens en favorieten blijven lokaal op dit apparaat</footer>
</div>

function toggleFav(id){
  favorites=isFav(id)?favorites.filter(x=>x!==id):[...favorites,id];
  saveFav(); render();
}
function pushRoute(r){
  historyStack.push(route);
  route=r; render(); window.scrollTo({top:0,behavior:'smooth'});
}
function goBack(){
  if(historyStack.length){route=historyStack.pop(); render(); window.scrollTo({top:0,behavior:'smooth'});}
  else goHome();
}
function goHome(){historyStack=[];route={type:'home'};render();window.scrollTo({top:0,behavior:'smooth'})}

function crumbs(items){
  const el=$('#crumbs'); el.innerHTML='';
  items.forEach((it,i)=>{
    if(i) el.insertAdjacentHTML('beforeend','<span>›</span>');
    const b=document.createElement('button'); b.textContent=it.label;
    b.onclick=it.action; el.appendChild(b);
  });
}

function practicePhoto(input){
 const f=input.files&&input.files[0];if(!f)return;
 const rd=new FileReader();rd.onload=e=>{const im=new Image();im.onload=()=>{
  const max=1100,sc=Math.min(1,max/im.width,max/im.height),cv=document.createElement('canvas');
  cv.width=Math.round(im.width*sc);cv.height=Math.round(im.height*sc);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);

 };im.src=e.target.result};rd.readAsDataURL(f);

function practiceNext(){
 const c=pc(); if(!c)return;
 if(practiceStage===1){
  if(c.mise.some((_,i)=>!practice.checks['m'+i]))return alert('Vink eerst je mise-en-place compleet af.');
 } else if(practiceStage===2){
  if(c.steps.some((_,i)=>!practice.checks['s'+i]))return alert('Doorloop en vink eerst alle bereidingsstappen af.');
 } else if(practiceStage===3){
  if(!practice.taste||!practice.observation.trim())return alert('Beoordeel eerst de smaak en noteer wat je proeft.');
 } else if(practiceStage===4){
  if(!practice.photo)return alert('Maak of upload eerst je bewijsfoto.');
  if(!practice.learning.trim())return alert('Noteer eerst jouw belangrijkste leerpunt.');
  practice.done=true;savePractice();
 }
 practiceStage=Math.min(5,practiceStage+1);render();window.scrollTo({top:0,behavior:'smooth'});
}
function practicePrev(){practiceStage=Math.max(1,practiceStage-1);render();window.scrollTo({top:0,behavior:'smooth'})}

 return {
  student:'',group:'',signatureChoice:'',drinkName:'',guest:'',occasion:'',alcohol:'Cocktail',price:'',
  tastes:[],experience:'',
  concept:'',why1:'',why2:'',
  v1:[{name:'',qty:'',unit:'ml'}],v1tech:'',v1glass:'',v1ice:'',v1garnish:'',
  scoreTaste:'3',scoreAroma:'3',scoreTemp:'3',scoreDilution:'3',scoreLook:'3',scoreGuest:'3',
  v1problem:'',change:'',changeWhy:'',
  v2:[{name:'',qty:'',unit:'ml'}],v2tech:'',v2glass:'',v2ice:'',v2garnish:'',method:'',
  photoFinal:'',photoDev:'',photoTest:'',
  menuText:'',menuPrice:'',
  salesQ:'',salesFollow:'',salesPitch:'',salesClose:'',

 };
}
function loadSig(){try{return {...blankSig(),...JSON.parse(localStorage.getItem(sigKey)||'{}')}}catch(e){return blankSig()}}
function saveSig(){localStorage.setItem(sigKey,JSON.stringify(sig))}
function setSig(k,v){sig[k]=v;saveSig()}
function val(k){return (sig[k]??'').toString().replaceAll('"','&quot;')}
function escText(v){return (v??'').toString().replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}
function tasteChip(t){
 const on=sig.tastes.includes(t);
 return `<button type="button" class="chip ${on?'on':''}" onclick="toggleTaste('${t}')">${t}</button>`;
}
function toggleTaste(t){
 sig.tastes=sig.tastes.includes(t)?sig.tastes.filter(x=>x!==t):[...sig.tastes,t].slice(0,3);
 saveSig(); render();
}
function sigProgress(){
 return `<div class="sig-progress">${[1,2,3,4,5,6,7,8].map(n=>`<div class="sig-dot ${n<sigStep?'done':n===sigStep?'active':''}"></div>`).join('')}</div>`;
}
function sigInput(label,key,ph='',type='text',help=''){
 return `<div class="field"><label>${label}</label><input type="${type}" value="${val(key)}" placeholder="${ph}" oninput="setSig('${key}',this.value)">${help?`<small>${help}</small>`:''}</div>`;
}
function sigArea(label,key,ph='',help=''){
 return `<div class="field full"><label>${label}</label><textarea placeholder="${ph}" oninput="setSig('${key}',this.value)">${escText(sig[key])}</textarea>${help?`<small>${help}</small>`:''}</div>`;
}
function sigSelect(label,key,opts){
 return `<div class="field"><label>${label}</label><select onchange="setSig('${key}',this.value)">${opts.map(o=>`<option ${sig[key]===o?'selected':''}>${o}</option>`).join('')}</select></div>`;
}
function recipeRows(which){
 const arr=sig[which]||[];
 return `<div class="recipe-rows">${arr.map((r,i)=>`<div class="recipe-row">
   <input placeholder="Ingrediënt, bv. limoensap" value="${(r.name||'').replaceAll('"','&quot;')}" oninput="updateRecipe('${which}',${i},'name',this.value)">
   <input placeholder="Hoeveelheid" value="${(r.qty||'').replaceAll('"','&quot;')}" oninput="updateRecipe('${which}',${i},'qty',this.value)">
   <select onchange="updateRecipe('${which}',${i},'unit',this.value)" style="background:#11181d;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px">
    ${['ml','cl','g','stuks','dash','top'].map(u=>`<option ${r.unit===u?'selected':''}>${u}</option>`).join('')}
   </select>
   <button class="remove-row" type="button" onclick="removeRecipeRow('${which}',${i})">×</button>
  </div>`).join('')}</div>
  <button class="add-row" type="button" onclick="addRecipeRow('${which}')">+ Ingrediënt toevoegen</button>`;
}
function updateRecipe(w,i,k,v){sig[w][i][k]=v;saveSig()}
function addRecipeRow(w){sig[w].push({name:'',qty:'',unit:'ml'});saveSig();render()}
function removeRecipeRow(w,i){if(sig[w].length>1)sig[w].splice(i,1);saveSig();render()}

function scoreField(label,key){
 return `<div class="field"><label>${label}</label><select onchange="setSig('${key}',this.value)">
 ${[1,2,3,4,5].map(n=>`<option ${sig[key]==n?'selected':''} value="${n}">${n}/5</option>`).join('')}
 </select></div>`;
}
function compressPhoto(input,key){
 const f=input.files&&input.files[0]; if(!f)return;
 const reader=new FileReader();
 reader.onload=e=>{
  const img=new Image();
  img.onload=()=>{
   const max=1200, scale=Math.min(1,max/img.width,max/img.height);
   const c=document.createElement('canvas'); c.width=Math.round(img.width*scale); c.height=Math.round(img.height*scale);
   c.getContext('2d').drawImage(img,0,0,c.width,c.height);
   sig[key]=c.toDataURL('image/jpeg',.78); saveSig(); render();
  };
  img.src=e.target.result;
 };
 reader.readAsDataURL(f);
}

 crumbs([{label:'Home',action:goHome},{label:'Smaakkompas',action:()=>pushRoute({type:'category',id:'flavours'})},{label:x.name,action:()=>{}}]);
 return `<div class="detail-head"><div><div class="emoji">${x.icon}</div><h1>${x.name}</h1><div class="detail-sub">${x.type}</div></div></div>
 <div class="flavour-bars">${Object.entries(x.bars).map(([k,v])=>`<div class="barline"><span>${k.replace('_',' ')}</span><div class="bar"><div class="fill" style="width:${v*20}%"></div></div><b>${v}/5</b></div>`).join('')}</div>
 <div class="accordion">
 ${accordion('🤝 Waarmee combineren?',x.works.map(w=>`<p><b>${w[0]}</b> — ${w[1]}</p>`).join(''))}
 ${accordion('⚠️ Wanneer wordt het te veel?',x.warning)}
 ${accordion('🍸 Cocktails met '+x.name,x.recipes.map(id=>{const r=DB.recipes.find(a=>a.id===id);return `<p><button class="linkbtn" onclick="pushRoute({type:'recipe',id:'${id}'})">${r.name} →</button></p>`}).join(''))}
 </div>`;
}

function problemDetail(id){
 const p=DB.problems.find(x=>x.id===id);
 crumbs([{label:'Home',action:goHome},{label:'Fix mijn drankje',action:()=>pushRoute({type:'category',id:'problems'})},{label:p.name,action:()=>{}}]);
 return `<div class="detail-head"><div><div class="emoji">${p.icon}</div><h1>${p.name}</h1></div></div>
 <div class="factgrid"><div class="fact"><b>Mogelijke oorzaken</b>${p.causes.map(x=>'• '+x).join('<br>')}</div><div class="fact"><b>Wat kun je testen?</b>${p.fix.map(x=>'• '+x).join('<br>')}</div></div>
 <div class="notice"><b>Mixoloog-regel:</b> ${p.note}</div>
 <div class="flow"><span class="step">PROEF</span><span class="step">BENOEM PROBLEEM</span><span class="step">VERANDER 1 DING</span><span class="step">PROEF OPNIEUW</span><span class="step">BEOORDEEL</span></div>`;
}
function techniqueDetail(id){
 const t=DB.techniques.find(x=>x.id===id);
 crumbs([{label:'Home',action:goHome},{label:'Technieken',action:()=>pushRoute({type:'category',id:'techniques'})},{label:t.name,action:()=>{}}]);
 return `<div class="detail-head"><div><div class="emoji">${t.icon}</div><h1>${t.name}</h1><div class="detail-sub">${t.what}</div></div></div>
 <div class="factgrid"><div class="fact"><b>Wanneer?</b>${t.when}</div><div class="fact"><b>Waarom?</b>${t.why}</div><div class="fact"><b>Veelgemaakte fout</b>${t.mistake}</div></div>
 ${accordion('▶ Stappen',`<div class="flow">${t.steps.map(s=>`<span class="step">${s}</span>`).join('')}</div>`)}
 ${accordion('🍸 Voorbeeldcocktails',t.examples.map(id=>{const r=DB.recipes.find(a=>a.id===id);return `<p><button class="linkbtn" onclick="pushRoute({type:'recipe',id:'${id}'})">${r.name} →</button></p>`}).join(''))}`;
}
function termsView(){
 crumbs([{label:'Home',action:goHome},{label:'Begrippen',action:()=>{}}]);
 return `<div class="section-title"><div><h2>📖 Begrippenbank</h2><p>Korte vakdefinities.</p></div></div>
 <div class="search-results">${DB.terms.sort((a,b)=>a[0].localeCompare(b[0])).map(t=>`<div class="result"><b>${t[0]}</b><div class="small">${t[1]}</div></div>`).join('')}</div>`;
}
function showFavorites(){
 const favRecipes=DB.recipes.filter(r=>isFav(r.id));
 historyStack.push(route); route={type:'favorites'}; render();
}
function favoritesView(){
 crumbs([{label:'Home',action:goHome},{label:'Favorieten',action:()=>{}}]);
 const favRecipes=DB.recipes.filter(r=>isFav(r.id));
 return `<div class="section-title"><div><h2>★ Favorieten</h2><p>Opgeslagen op dit apparaat.</p></div></div><div class="list">${favRecipes.map(recipeCard).join('')||'<div class="empty">Nog geen favorieten. Tik bij een recept op ☆.</div>'}</div>`;
}
function runSearch(){
 const q=$('#globalSearch').value.trim().toLowerCase();
 if(!q)return;
 historyStack.push(route); route={type:'search',q}; render();
}
function searchView(q){
 crumbs([{label:'Home',action:goHome},{label:'Zoeken',action:()=>{}}]);
 const results=[];
 DB.spirits.forEach(x=>{if((x.name+' '+x.short+' '+Object.values(x.facts).join(' ')).toLowerCase().includes(q)) results.push({kind:'Drank',name:x.name,desc:x.short,route:{type:'spirit',id:x.id}})});
 DB.recipes.forEach(x=>{if((x.name+' '+x.base+' '+x.taste+' '+x.tech+' '+x.ingredients.flat().join(' ')).toLowerCase().includes(q)) results.push({kind:'Recept',name:x.name,desc:x.base+' · '+x.taste,route:{type:'recipe',id:x.id}})});
 DB.ingredients.forEach(x=>{if((x.name+' '+x.type+' '+x.works.flat().join(' ')).toLowerCase().includes(q)) results.push({kind:'Smaak',name:x.name,desc:x.type,route:{type:'ingredient',id:x.id}})});
 DB.techniques.forEach(x=>{if((x.name+' '+x.what+' '+x.when).toLowerCase().includes(q)) results.push({kind:'Techniek',name:x.name,desc:x.what,route:{type:'technique',id:x.id}})});
 DB.problems.forEach(x=>{if((x.name+' '+x.causes.join(' ')+' '+x.fix.join(' ')).toLowerCase().includes(q)) results.push({kind:'Fix',name:x.name,desc:x.note,route:{type:'problem',id:x.id}})});
 DB.terms.forEach(x=>{if((x[0]+' '+x[1]).toLowerCase().includes(q)) results.push({kind:'Begrip',name:x[0],desc:x[1],route:null})});
 return `<div class="section-title"><div><h2>🔎 Zoekresultaten</h2><p>Voor “${q}”</p></div></div>
 <div class="search-results">${results.length?results.map(r=>`<div class="result" ${r.route?`onclick='pushRoute(${JSON.stringify(r.route)})' style="cursor:pointer"`:''}><span class="tag">${r.kind}</span><h3>${r.name}</h3><div class="small">${r.desc}</div></div>`).join(''):'<div class="empty">Geen resultaten gevonden.</div>'}</div>`;
}

function render(){
 const v=$('#view');
 if(route.type==='home') v.innerHTML=home();
 if(route.type==='category') v.innerHTML=category(route.id);
 if(route.type==='spirit') v.innerHTML=spiritDetail(route.id);
 if(route.type==='recipe') v.innerHTML=recipeDetail(route.id);
 if(route.type==='ingredient') v.innerHTML=ingredientDetail(route.id);
 if(route.type==='problem') v.innerHTML=problemDetail(route.id);
 if(route.type==='technique') v.innerHTML=techniqueDetail(route.id);
 if(route.type==='favorites') v.innerHTML=favoritesView();
 if(route.type==='signatureReview') v.innerHTML=signatureReviewView();
 if(route.type==='search') v.innerHTML=searchView(route.q);
}

$('#globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter')runSearch()});
render();
</script>
</body>
</html>
