e gecorrigeerde inkoopprijs per kg. Laat je berekening zien.","antwoord":"A € 5,62/kg; B € 1,38/kg.","uitwerking":["A. Inkoop: 6 × € 5,20 = € 31,20.","A. Bruikbaar: 6 − 450/1000 = 5.55 kg.","A. Gecorrigeerd: € 31,20 ÷ 5.55 kg = € 5,62 per kg.","B. Inkoop: 4 × € 1,10 = € 4,40.","B. Gecorrigeerd: € 4,40 ÷ 3.2 kg = € 1,38 per kg."],"punten":6,"beoordeling":[{"punten":3,"criterium":"A: 2 punten berekening, 1 punt juist resultaat"},{"punten":3,"criterium":"B: 2 punten berekening, 1 punt juist resultaat"}],"herkomst":"nieuw","bron":"Nieuw ontwikkeld in de stijl van examen 3289 A; geen officiële examenvraag","antwoordtype":"open","printbaar":true,"examengericht":true,"feedback_hint":"Maak je stappen zichtbaar en controleer de eenheden.","tags":["gewicht","gram-naar-kg"]},{"id":"M4-L3-01-kostprijs-met-opslag","module":4,"level":"examengericht","level_nummer":3,"variant":1,"vraagtype":"open","onderwerp":"kostprijs-met-opslag","context":"","vraag":"Een gerecht heeft een gecorrigeerde inkoopprijs van € 8,50 per portie. De kostenopslag bedraagt 55% over deze inkoopprijs. A. Bereken de kostenopslag en kostprijs per portie. B. Leg uit waarom de kostprijs niet hetzelfde is als de verkoopprijs of winst. Laat de berekening zien.","antwoord":"Kostenopslag € 4,68; kostprijs € 13,18.","uitwerking":["Kostenopslag = € 8,50 × 55/100 = € 4,68.","Kostprijs = € 8,50 + € 4,68 = € 13,18.","Kostprijs is de som van ingekochte goederen en toegerekende bedrijfskosten; daarmee is nog geen winst gemaakt."],"punten":4,"beoordeling":[{"punten":1,"criterium":"Juiste berekening kostenopslag"},{"punten":1,"criterium":"Juiste kostprijs"},{"punten":2,"criterium":"Correcte betekenis kostprijs inclusief kosten dekken en geen winst"}],"herkomst":"nieuw","bron":"Nieuw ontwikkeld in de stijl van examen 3289 A; geen officiële examenvraag","antwoordtype":"open","printbaar":true,"examengericht":true,"feedback_hint":"Maak je stappen zichtbaar en controleer de eenheden.","tags":[]},{"id":"M4-L3-02-kostprijs-met-opsl 100 = € 1.900.","Bedrijfsresultaat = € 1.900 − € 1.450 = € 450."],"antwoord":"Bedrijfsresultaat € 450","bron":"Nieuw ontwikkeld naar SVO-methode"},{"id":"M3-V1","module":3,"thema":"Calculeren bij de inkoop","onderwerp":"gecorrigeerde inkoopprijs","titel":"Basis: volledig uitgewerkt","vraag":"5 kg aardappelen à € 2,00/kg. Na schillen 4 kg bruikbaar.","stappen":["Totale inkoopkosten: 5 × € 2,00 = € 10,00.","Bruikbaar gewicht is 4 kg.","Gecorrigeerde inkoopprijs = € 10,00 ÷ 4 = € 2,50/kg."],"antwoord":"€ 2,50/kg","bron":"Nieuw ontwikkeld naar SVO-methode"},{"id":"M3-V2","module":3,"thema":"Calculeren bij de inkoop","onderwerp":"uien vergelijken","titel":"Verdieping: origineel SVO-uienvoorbeeld","vraag":"Voor 6 kg gesnipperde ui: vuil 10 kg à € 1/kg, schoon 8 kg à € 1,50/kg of gesnipperd 6 kg à € 2,50/kg.","stappen":["Vuile uien: 10 × € 1,00 = € 10,00; ÷ 6 = € 1,67/kg.","Schone uien: 8 × € 1,50 = € 12,00; ÷ 6 = € 2,00/kg.","Gesnipperde uien: 6 × € 2,50 = € 15,00; ÷ 6 = € 2,50/kg.","Alleen op grondstofkosten zijn vuile uien het goedkoopst; arbeidstijd is nog niet doorgerekend."],"antwoord":"€ 1,67/kg; € 2,00/kg; € 2,50/kg","bron":"SVO e-book Financieel, hoofdstuk 2, voorbeeld vuile/schone/gesnipperde uien; afronding op centen"},{"id":"M4-V1","module":4,"thema":"Calculeren bij de bewerking","onderwerp":"receptcalculatie","titel":"Basis: ingrediënten optellen","vraag":"Voor een gerecht: groente € 3,00, vlees € 5,00 en saus € 2,00. Bereken de inkoopprijs zonder toeslagen.","stappen":["Groente + vlees + saus = € 3,00 + € 5,00 + € 2,00.","Totale inkoopprijs = € 10,00."],"antwoord":"€ 10,00","bron":"Nieuw ontwikkeld naar SVO-methode"},{"id":"M4-V2","module":4,"thema":"Calculeren bij de bewerking","onderwerp":"kostprijs","titel":"Verdieping: toeslagen en porties","vraag":"Ingrediënten € 20,00. Condimententoeslag 5% van ingrediëntenkosten; kostenopslag 40% over de inkoopprijs inclusief condimenten. Vier porties.","stappen":["Condimenten: 5% × € 20,00 = € 1,00.","Inkoopprijs gerecht = € 20,00 + € 1,00 = € 21,00.","Kostenopslag = 40% × € 21,00 = € 8,40.","Kostprijs geheel = € 29,40.","Kostprijs per portie = € 29,40 ÷ 4 = € 7,35."],"antwoord":"€ 7,35/portie","bron":"Nieuwe berekening conform SVO-systematiek: 5% condimenten, daarna opgegeven kostenopslag"},{"id":"M5-V1","module":5,"thema":"Menu-engineering","onderwerp":"menu-engineering","titel":"Basis: categorie herkennen","vraag":"Product A heeft hoge afzet en hoge bijdrage aan de brutowinst.","stappen":["Kijk eerst naar afzet: hoog.","Kijk daarna naar brutowinstbijdrage: hoog.","Hoog + hoog = winnaar."],"antwoord":"Winnaar","bron":"Nieuw ontwikkeld naar SVO-methode"},{"id":"M5-V2","module":5,"thema":"Menu-engineering","onderwerp":"menu-engineering","titel":"Verdieping: rekenen, indelen en adviseren","vraag":"Product B: verkoopprijs excl. btw € 8, inkoopprijs € 3, 20 verkocht. Andere producten gemiddeld 40 stuks en € 150 totale brutowinstbijdrage.","stappen":["Brutowinst per stuk = € 8 − € 3 = € 5.","Totale brutowinstbijdrage = 20 × € 5 = € 100.","Afzet 20 < 40 is laag; bijdrage € 100 < € 150 is laag.","Categorie verliezer; bekijk prijs, presentatie of vraag voordat je het product schrapt."],"antwoord":"Verliezer; onderbouwd verbeteradvies","bron":"Nieuw uitgewerkt voorbeeld; drempels zijn expliciet gegeven oefenwaarden"},{"id":"M6-V1","module":6,"thema":"Kassabeheer","onderwerp":"kascontrole","titel":"Basis: kasverschil","vraag":"Beginkas € 100; contante ontvangsten € 350; geen contante uitgaven; werkelijk geteld € 445.","stappen":["Verwacht eindkasgeld = € 100 + € 350 = € 450.","Kasverschil = werkelijk − verwacht = € 445 − € 450 = −€ 5.","Een negatief verschil is een tekort."],"antwoord":"Kastekort € 5","bron":"Nieuw ontwikkeld naar SVO-methode"},{"id":"M6-V2","module":6,"thema":"Kassabeheer","onderwerp":"kascontrole","titel":"Verdieping: contante uitgave en pinbetaling","vraag":"Beginkas € 150; totale omzet € 900 waarvan € 650 per pin, contante uitgave met bon € 20, werkelijk geteld € 378.","stappen":["Contante omzet = € 900 − € 650 = € 250.","Verwacht eindkasgeld = € 150 + € 250 − € 20 = € 380.","Kasverschil = € 378 − € 380 = −€ 2.","Het is een kastekort van € 2; onderzoek bonnen en registraties."],"antwoord":"Kastekort € 2","bron":"Nieuw ontwikkeld naar SVO-methode"}],"examens":[{"id":"OEFENEXAMEN-1","titel":"Oefenexamen Financieel 1","punten_totaal":25,"vragen":["M2-L3-01-kostensoorten-en-brutowinst","M3-L3-01-gecorrigeerde-inkoopprijs","M4-L3-01-kostprijs-met-opslag","M5-L3-01-menu-engineering-indelen","M5-L3-01-menu-engineering-advies","M6-L3-01-kasbeheer-maatregelen"],"toelichting":"Nieuwe oefenvragen; dezelfde onderwerpen en 6+6+4+2+4+3-puntenverdeling als aangeleverd voorbeeld 3289. Open vragen docent-/zelfbeoordeling."},{"id":"OEFENEXAMEN-2","titel":"Oefenexamen Financieel 2","punten_totaal":25,"vragen":["M2-L3-02-kostensoorten-en-brutowinst","M3-L3-02-gecorrigeerde-inkoopprijs","M4-L3-02-kostprijs-met-opslag","M5-L3-02-menu-engineering-indelen","M5-L3-02-menu-engineering-advies","M6-L3-02-kasbeheer-maatregelen"],"toelichting":"Nieuwe oefenvragen; dezelfde onderwerpen en 6+6+4+2+4+3-puntenverdeling als aangeleverd voorbeeld 3289. Open vragen docent-/zelfbeoordeling."},{"id":"OEFENEXAMEN-3","titel":"Oefenexamen Financieel 3","punten_totaal":25,"vragen":["M2-L3-03-kostensoorten-en-brutowinst","M3-L3-03-gecorrigeerde-inkoopprijs","M4-L3-03-kostprijs-met-opslag","M5-L3-03-menu-engineering-indelen","M5-L3-03-menu-engineering-advies","M6-L3-03-kasbeheer-maatregelen"],"toelichting":"Nieuwe oefenvragen; dezelfde onderwerpen en 6+6+4+2+4+3-puntenverdeling als aangeleverd voorbeeld 3289. Open vragen docent-/zelfbeoordeling."}],"begrippen":[{"id":"begrip-001","module":1,"thema":"Financiële administratie en balans","term":"Financiële administratie","definitie":"Het vastleggen van geldzaken van een bedrijf, zoals verkopen, inkopen, betalingen en kosten.","voorbeeld":"Een bedrijf bewaart verkoopgegevens en inkoopfacturen.","vraag":"Waarom heeft de ondernemer deze gegevens nodig?","antwoord":"Om inzicht te krijgen en het bedrijf te kunnen sturen."},{"id":"begrip-002","module":1,"thema":"Financiële administratie en balans","term":"Inventariseren","definitie":"Op een bepaald moment vaststellen wat een bedrijf bezit en verschuldigd is. In de praktijk kan het ook specifiek gaan om het tellen van de voorraad.","voorbeeld":"De medewerker telt producten in de koeling; de ondernemer legt ook schulden en bezittingen vast.","vraag":"Waarom is dit een momentopname?","antwoord":"Na een verkoop of betaling veranderen de gegevens."},{"id":"begrip-003","module":1,"thema":"Financiële administratie en balans","term":"Voorraad","definitie":"Producten en grondstoffen die een bedrijf nog heeft en later gebruikt of verkoopt.","voorbeeld":"Er ligt 20 kg rijst in het magazijn.","vraag":"Is voorraad een bezit of een schuld?","antwoord":"Een bezit: het hoort links op de balans."},{"id":"begrip-004","module":1,"thema":"Financiële administratie en balans","term":"Bezittingen","definitie":"Alles wat een bedrijf aan waarde heeft, zoals voorraad, inventaris en geld op de bank.","voorbeeld":"Een oven, voorraad en banktegoed zijn bezittingen.","vraag":"Aan welke kant van de balans staan bezittingen?","antwoord":"Links: debet."},{"id":"begrip-005","module":1,"thema":"Financiële administratie en balans","term":"Schulden","definitie":"Bedragen die het bedrijf nog aan anderen moet betalen.","voorbeeld":"Een lening en een nog niet betaalde leveranciersfactuur.","vraag":"Aan welke kant van de balans staan schulden?","antwoord":"Rechts: credit."},{"id":"begrip-006","module":1,"thema":"Financiële administratie en balans","term":"Eigen vermogen","definitie":"Het deel van de bezittingen dat overblijft als je de schulden aftrekt.","voorbeeld":"€ 15.000 bezittingen min € 8.000 schulden = € 7.000 eigen vermogen.","vraag":"Is eigen vermogen altijd hetzelfde als geld op de bank?","antwoord":"Nee; het is een berekend bedrag en kan ook in voorraad of apparatuur vastzitten."},{"id":"begrip-007","module":1,"thema":"Financiële administratie en balans","term":"Balans","definitie":"Een overzicht van de bezittingen en de financiering ervan op één bepaald moment. Links en rechts zijn in totaal even groot.","voorbeeld":"Links € 15.000 aan bezittingen; rechts € 8.000 schulden en € 7.000 eigen vermogen.","vraag":"Wat controleer je altijd bij een balans?","antwoord":"Totaal debet = totaal credit."},{"id":"begrip-008","module":1,"thema":"Financiële administratie en balans","term":"Debet","definitie":"De linkerkant van de balans. Hier staan in deze basisopzet de bezittingen.","voorbeeld":"Voorraad € 2.000 staat links.","vraag":"Waar zet je een bedrijfsoven op de balans?","antwoord":"Links, debet."},{"id":"begrip-009","module":1,"thema":"Financiële administratie en balans","term":"Credit","definitie":"De rechterkant van de balans. Hier staan in deze basisopzet schulden en eigen vermogen.","voorbeeld":"Een banklening van € 6.000 staat rechts.","vraag":"Waar zet je een lening?","antwoord":"Rechts, credit."},{"id":"begrip-010","module":1,"thema":"Financiële administratie en balans","term":"Balanspost","definitie":"Eén afzonderlijk onderdeel met een waarde op de balans.","voorbeeld":"De post ‘voorraad’ bedraagt € 2.000.","vraag":"Is ‘eigen vermogen’ een balanspost?","antwoord":"Ja; deze staat rechts."},{"id":"begrip-011","module":1,"thema":"Financiële administratie en balans","term":"Debiteuren","definitie":"Klanten die een bedrijf nog moeten betalen; een vordering van het bedrijf.","voorbeeld":"Een klant moet nog € 450 betalen voor een bestelling.","vraag":"Links of rechts op de balans?","antwoord":"Links, als vordering/bezit."},{"id":"begrip-012","module":1,"thema":"Financiële administratie en balans","term":"Crediteuren","definitie":"Leveranciers aan wie het bedrijf nog moet betalen; een schuld van het bedrijf.","voorbeeld":"De leverancier krijgt nog € 300.","vraag":"Links of rechts op de balans?","antwoord":"Rechts, als schuld."},{"id":"begrip-013","module":2,"thema":"Winst, verlies, btw en kosten","term":"Omzet","definitie":"De opbrengst van verkopen, in deze financiële berekeningen exclusief btw.","voorbeeld":"Er worden 100 maaltijden verkocht voor € 8 exclusief btw: omzet € 800.","vraag":"Is omzet hetzelfde als winst?","antwoord":"Nee, kosten moeten nog worden afgetrokken."},{"id":"begrip-014","module":2,"thema":"Winst, verlies, btw en kosten","term":"Inkoopprijs verkopen","definitie":"De kosten van de producten of grondstoffen die horen bij wat verkocht is.","voorbeeld":"De ingrediënten van de verkochte maaltijden kosten samen € 320.","vraag":"Waarvoor gebruik je dit bij brutowinst?","antwoord":"Je trekt het van de omzet af."},{"id":"begrip-015","module":2,"thema":"Winst, verlies, btw en kosten","term":"Brutowinst","definitie":"Omzet exclusief btw min de inkoopprijs van wat verkocht is, vóór de overige bedrijfskosten.","voorbeeld":"€ 800 omzet − € 320 inkoopprijs verkopen = € 480 brutowinst.","vraag":"Is brutowinst al het eindresultaat?","antwoord":"Nee; bedrijfskosten moeten nog worden afgetrokken."},{"id":"begrip-016","module":2,"thema":"Winst, verlies, btw en kosten","term":"Bedrijfskosten","definitie":"Overige kosten om het bedrijf draaiend te houden, bijvoorbeeld huur, loon en energie.","voorbeeld":"Een bedrijf betaalt € 200 huur en energie voor de beschouwde periode.","vraag":"Wat gebeurt met het resultaat als de bedrijfskosten stijgen?","antwoord":"Bij gelijkblijvende overige gegevens daalt het resultaat."},{"id":"begrip-017","module":2,"thema":"Winst, verlies, btw en kosten","term":"Nettowinst / bedrijfsresultaat","definitie":"Het resultaat na aftrek van de inkoopprijs verkopen en de overige bedrijfskosten van de omzet. In de les gebruiken we een eenvoudige winst-en-verliesrekening.","voorbeeld":"€ 800 − € 320 − € 200 = € 280 resultaat.","vraag":"Wat betekent een negatief resultaat?","antwoord":"Verlies."},{"id":"begrip-018","module":2,"thema":"Winst, verlies, btw en kosten","term":"Winst- en verliesrekening","definitie":"Overzicht van opbrengsten en kosten over een periode, om te bepalen of het bedrijf winst of verlies maakt.","voorbeeld":"De ondernemer bekijkt de cijfers over afgelopen maand.","vraag":"Wat is het verschil met de balans?","antwoord":"De balans is op één moment; de winst-en-verliesrekening gaat over een periode."},{"id":"begrip-019","module":2,"thema":"Winst, verlies, btw en kosten","term":"Kengetal","definitie":"Een getal waarmee je prestaties van een bedrijf volgt of vergelijkt.","voorbeeld":"Omzet, brutowinst of personeelskosten per maand.","vraag":"Waarom vergelijk je kengetallen met vorige maand?","antwoord":"Om ontwikkelingen en afwijkingen te zien."},{"id":"begrip-020","module":2,"thema":"Winst, verlies, btw en kosten","term":"Vaste kosten","definitie":"Kosten die op korte termijn niet direct mee veranderen met hoeveel je verkoopt.","voorbeeld":"De maandelijkse huur blijft gelijk als je vandaag minder verkoopt.","vraag":"Is vaste kosten hetzelfde als directe kosten?","antwoord":"Nee; vast/variabel en direct/indirect zijn verschillende indelingen."},{"id":"begrip-021","module":2,"thema":"Winst, verlies, btw en kosten","term":"Variabele kosten","definitie":"Kosten die veranderen wanneer de productie of verkoop verandert.","voorbeeld":"Voor 100 porties heb je meer ingrediënten nodig dan voor 20.","vraag":"Noem één variabele kostenpost.","antwoord":"Bijvoorbeeld ingrediënten."},{"id":"begrip-022","module":2,"thema":"Winst, verlies, btw en kosten","term":"Directe kosten","definitie":"Kosten die direct aan een bepaald product of gerecht zijn toe te rekenen.","voorbeeld":"Het vlees dat in één specifieke maaltijd gaat.","vraag":"Kan een ingrediënt direct én variabel zijn?","antwoord":"Ja."},{"id":"begrip-023","module":2,"thema":"Winst, verlies, btw en kosten","term":"Indirecte kosten","definitie":"Kosten die niet rechtstreeks aan één product toe te rekenen zijn.","voorbeeld":"Algemene huur of administratiekosten.","vraag":"Waarom zijn energiekosten vaak indirect?","antwoord":"Omdat ze meestal niet rechtstreeks aan één specifiek gerecht worden toegerekend."},{"id":"begrip-024","module":2,"thema":"Winst, verlies, btw en kosten","term":"Btw","definitie":"Belasting over de toegevoegde waarde die de ondernemer bij verkopen berekent en volgens de regels verrekent.","voorbeeld":"Een consument betaalt een prijs inclusief btw.","vraag":"Is ontvangen btw zomaar winst voor het bedrijf?","antwoord":"Nee."},{"id":"begrip-025","module":2,"thema":"Winst, verlies, btw en kosten","term":"Prijs exclusief btw","definitie":"Prijs zonder btw.","voorbeeld":"Een product kost € 10,00 excl. 9% btw.","vraag":"Wat is de prijs inclusief btw?","antwoord":"€ 10,90."},{"id":"begrip-026","module":2,"thema":"Winst, verlies, btw en kosten","term":"Prijs inclusief btw","definitie":"De prijs die btw al bevat.","voorbeeld":"Een klant betaalt € 10,90 voor een artikel met 9% btw.","vraag":"Hoe vind je de prijs exclusief 9% btw?","antwoord":"€ 10,90 ÷ 1,09 = € 10,00."},{"id":"begrip-027","module":2,"thema":"Winst, verlies, btw en kosten","term":"Te betalen btw","definitie":"Btw die op verkopen aan klanten in rekening is gebracht.","voorbeeld":"Bij een verkoop wordt btw op de bon vermeld.","vraag":"Wat is het verschil met te vorderen btw?","antwoord":"Te vorderen btw is btw op zakelijke inkopen die volgens de regels kan worden verrekend."},{"id":"begrip-028","module":2,"thema":"Winst, verlies, btw en kosten","term":"Te vorderen btw","definitie":"Btw op zakelijke inkopen die een bedrijf volgens de btw-regels kan terugvragen of verrekenen.","voorbeeld":"De leverancier factureert btw over grondstoffen.","vraag":"Hoe verhoudt dit zich tot af te dragen btw?","antwoord":"Het wordt doorgaans verrekend met btw over verkopen."},{"id":"begrip-029","module":2,"thema":"Winst, verlies, btw en kosten","term":"Af te dragen btw","definitie":"Per saldo aan de Belastingdienst te betalen btw: btw over verkopen minus verrekenbare btw op inkopen.","voorbeeld":"€ 180 btw over verkopen − € 70 verrekenbare btw = € 110 af te dragen.","vraag":"Waarom is dit niet gelijk aan alle ontvangen btw?","antwoord":"Omdat verrekenbare inkoop-btw wordt afgetrokken."},{"id":"begrip-030","module":3,"thema":"Calculeren bij de inkoop","term":"Calculeren","definitie":"Met gegevens en formules uitrekenen wat een product of gerecht financieel kost.","voorbeeld":"Je berekent de prijs van bruikbare uien per kilo.","vraag":"Waarom calculeer je?","antwoord":"Om onderbouwde inkoop- en productiekeuzes te maken."},{"id":"begrip-031","module":3,"thema":"Calculeren bij de inkoop","term":"Inkoopgewicht","definitie":"Het gewicht van de grondstof zoals je die inkoopt, vóór bewerking.","voorbeeld":"Je koopt 10 kg ongeschilde uien.","vraag":"Is inkoopgewicht hetzelfde als bruikbaar gewicht?","antwoord":"Niet als er bewerkingsverlies is."},{"id":"begrip-032","module":3,"thema":"Calculeren bij de inkoop","term":"Bruikbaar gewicht","definitie":"Het deel van de ingekochte hoeveelheid dat na bewerking echt bruikbaar is.","voorbeeld":"Na snipperen blijft 6 kg uien over.","vraag":"Welke hoeveelheid gebruik je als deler voor gecorrigeerde prijs per bruikbare kg?","antwoord":"Het bruikbare gewicht."},{"id":"begrip-033","module":3,"thema":"Calculeren bij de inkoop","term":"Bewerkingsverlies","definitie":"De hoeveelheid die bij schoonmaken, snijden of andere bewerkingen verloren gaat.","voorbeeld":"10 kg ingekocht − 6 kg bruikbaar = 4 kg verlies.","vraag":"Hoe bereken je verlies in kg?","antwoord":"Inkoopgewicht − bruikbaar gewicht."},{"id":"begrip-034","module":3,"thema":"Calculeren bij de inkoop","term":"Verliespercentage","definitie":"Het bewerkingsverlies als percentage van het inkoopgewicht.","voorbeeld":"4 kg verlies ÷ 10 kg inkoop × 100% = 40%.","vraag":"Welk gewicht staat onder de breuk?","antwoord":"Het inkoopgewicht."},{"id":"begrip-035","module":3,"thema":"Calculeren bij de inkoop","term":"Rendement","definitie":"Het percentage van het inkoopgewicht dat bruikbaar overblijft.","voorbeeld":"6 kg bruikbaar ÷ 10 kg inkoop × 100% = 60%.","vraag":"Wat is de relatie met verliespercentage?","antwoord":"Samen 100% als al het gewichtsverlies is meegenomen."},{"id":"begrip-036","module":3,"thema":"Calculeren bij de inkoop","term":"Inkoopprijs","definitie":"Het bedrag dat je betaalt voor een ingekocht product of grondstof.","voorbeeld":"10 kg uien à € 1,00 kost € 10,00.","vraag":"Waarom kan deze prijs misleidend zijn?","antwoord":"Omdat verlies en bewerking de prijs per bruikbare kilo beïnvloeden."},{"id":"begrip-037","module":3,"thema":"Calculeren bij de inkoop","term":"Gecorrigeerde inkoopprijs","definitie":"De inkoopprijs omgerekend naar de werkelijk bruikbare hoeveelheid, nadat verlies is verwerkt.","voorbeeld":"€ 10,00 inkopen en 6 kg bruikbaar geeft € 1,67 per bruikbare kg (afgerond).","vraag":"Welke twee gegevens heb je nodig?","antwoord":"Totale inkoopkosten en bruikbaar gewicht."},{"id":"begrip-038","module":3,"thema":"Calculeren bij de inkoop","term":"Gebruiksklaar product","definitie":"Een product dat zonder verdere noodzakelijke voorbereiding kan worden gebruikt.","voorbeeld":"Voorgesneden uien.","vraag":"Is gebruiksklaar altijd goedkoper?","antwoord":"Niet per se; vergelijk de gecorrigeerde prijs en eventueel arbeidstijd."},{"id":"begrip-039","module":3,"thema":"Calculeren bij de inkoop","term":"Inslag keuken","definitie":"De grondstofwaarde die verband houdt met verkochte gerechten; niet elk ingekocht of afgeboekt product levert omzet op.","voorbeeld":"Personeelsmaaltijden en afschrijvingen worden in het SVO-voorbeeld apart behandeld.","vraag":"Waarom is inslag niet zonder meer hetzelfde als alle inkoop?","antwoord":"Niet alle ingekochte goederen leiden tot verkoop."},{"id":"begrip-040","module":4,"thema":"Calculeren bij de bewerking","term":"Receptcalculatie","definitie":"Berekening van de ingrediëntenkosten van een gerecht op basis van hoeveelheden en prijzen.","voorbeeld":"Voor een recept tel je de kosten van aardappelen, groente en vlees op.","vraag":"Moet je hoeveelheden eerst naar dezelfde eenheid omrekenen?","antwoord":"Ja, bijvoorbeeld gram naar kilogram."},{"id":"begrip-041","module":4,"thema":"Calculeren bij de bewerking","term":"Samengesteld product","definitie":"Product of gerecht dat uit meerdere ingrediënten bestaat.","voorbeeld":"Een lasagne bevat onder andere pasta, saus en kaas.","vraag":"Wat bereken je eerst?","antwoord":"De kosten per gebruikt ingrediënt."},{"id":"begrip-042","module":4,"thema":"Calculeren bij de bewerking","term":"Condimenten","definitie":"Kleine smaakgevende toevoegingen zoals kruiden en specerijen.","voorbeeld":"Peper, zout en een beetje paprikapoeder.","vraag":"Welke vereenvoudigde toeslag gebruikt het SVO-e-book vaak?","antwoord":"5% over de gecorrigeerde ingrediënteninkoopprijs van het gerecht."},{"id":"begrip-043","module":4,"thema":"Calculeren bij de bewerking","term":"Kostenopslag","definitie":"Een bedrag bovenop de inkoopprijs om toegerekende bedrijfskosten mee te nemen in de kostprijs.","voorbeeld":"€ 10,00 inkoopprijs + € 5,50 kostenopslag = € 15,50 kostprijs.","vraag":"Is kostenopslag hetzelfde als winst?","antwoord":"Nee, het dekt bedrijfskosten."},{"id":"begrip-044","module":4,"thema":"Calculeren bij de bewerking","term":"Kostenopslagpercentage","definitie":"Percentage waarmee je een kostenopslag berekent over de afgesproken grondslag.","voorbeeld":"55% van € 10,00 is € 5,50.","vraag":"Hoe bereken je de opslag?","antwoord":"Grondslag × percentage ÷ 100."},{"id":"begrip-045","module":4,"thema":"Calculeren bij de bewerking","term":"Kostenopslag per kg of stuk","definitie":"Vast bedrag aan toegerekende bedrijfskosten voor elke kg of elk stuk.","voorbeeld":"Bij € 2,00 opslag per kg geeft 3 kg € 6,00 kostenopslag.","vraag":"Is dit hetzelfde als een percentage?","antwoord":"Nee; de rekeneenheid en grondslag verschillen."},{"id":"begrip-046","module":4,"thema":"Calculeren bij de bewerking","term":"Kostprijs","definitie":"Inkoopprijs plus de toegerekende kosten om het product verkoopklaar te maken.","voorbeeld":"€ 10,00 ingrediënten + € 5,50 kostenopslag = € 15,50.","vraag":"Is kostprijs hetzelfde als verkoopprijs?","antwoord":"Nee."},{"id":"begrip-047","module":4,"thema":"Calculeren bij de bewerking","term":"Kostprijs per portie","definitie":"De kostprijs van het hele recept gedeeld door het aantal porties.","voorbeeld":"€ 15,50 voor 5 porties = € 3,10 per portie.","vraag":"Wat moet je controleren voor je deelt?","antwoord":"Dat het aantal porties en de totale kostprijs kloppen."},{"id":"begrip-048","module":4,"thema":"Calculeren bij de bewerking","term":"Verkoopprijs","definitie":"Het bedrag waarvoor het bedrijf een product aan de klant verkoopt; kan inclusief of exclusief btw worden vermeld.","voorbeeld":"Een gerecht heeft € 4,00 kostprijs en wordt voor € 7,00 excl. btw verkocht.","vraag":"Kan de verkoopprijs gelijkgesteld worden aan kostprijs?","antwoord":"Nee, beide zijn verschillende begrippen."},{"id":"begrip-049","module":5,"thema":"Menu-engineering","term":"Menu-engineering","definitie":"Producten vergelijken op verkoop en bijdrage aan brutowinst om het assortiment beter samen te stellen.","voorbeeld":"Een bedrijf onderzoekt welke maaltijden vaak verkocht worden en hoeveel ze opleveren.","vraag":"Welke twee dimensies spelen een hoofdrol?","antwoord":"Afzet en bijdrage aan brutowinst."},{"id":"begrip-050","module":5,"thema":"Menu-engineering","term":"Afzet","definitie":"Het aantal verkochte stuks of porties in een periode.","voorbeeld":"Van soep A zijn 60 porties verkocht.","vraag":"Wat is het verschil met omzet?","antwoord":"Afzet is aantal; omzet is geldbedrag."},{"id":"begrip-051","module":5,"thema":"Menu-engineering","term":"Brutowinst per product","definitie":"Verkoopprijs exclusief btw minus bijbehorende inkoopkosten per product.","voorbeeld":"€ 9 verkoopprijs − € 4 inkoop = € 5 brutowinst per stuk.","vraag":"Is dit de totale bijdrage van alle verkochte stuks?","antwoord":"Nee, vermenigvuldig met afzet voor totale bijdrage."},{"id":"begrip-052","module":5,"thema":"Menu-engineering","term":"Brutowinstbijdrage","definitie":"De totale brutowinst die een product in een periode oplevert.","voorbeeld":"€ 5 brutowinst per stuk × 20 verkochte stuks = € 100.","vraag":"Waarom is alleen winst per stuk niet genoeg?","antwoord":"Omdat ook het aantal verkopen meetelt."},{"id":"begrip-053","module":5,"thema":"Menu-engineering","term":"Winnaar","definitie":"In de SVO-indeling: hoge afzet en hoge bijdrage aan brutowinst.","voorbeeld":"Een maaltijd verkoopt veel én levert veel brutowinst op.","vraag":"Wat doe je vaak met een winnaar?","antwoord":"Behouden en zorgen dat kwaliteit en beschikbaarheid goed blijven."},{"id":"begrip-054","module":5,"thema":"Menu-engineering","term":"Hardloper","definitie":"In de SVO-indeling: hoge afzet, maar lage bijdrage aan brutowinst.","voorbeeld":"Een populair broodje levert relatief weinig brutowinst op.","vraag":"Wat kun je onderzoeken?","antwoord":"Of kosten, portiegrootte of verkoopprijs verantwoord te verbeteren zijn."},{"id":"begrip-055","module":5,"thema":"Menu-engineering","term":"Slaper","definitie":"In de SVO-indeling: lage afzet, maar hoge bijdrage aan brutowinst.","voorbeeld":"Een winstgevend gerecht wordt weinig besteld.","vraag":"Welk advies past vaak?","antwoord":"Zichtbaarheid of promotie verbeteren en effect controleren."},{"id":"begrip-056","module":5,"thema":"Menu-engineering","term":"Verliezer","definitie":"In de SVO-indeling: lage afzet én lage bijdrage aan brutowinst.","voorbeeld":"Een gerecht verkoopt weinig en levert weinig brutowinst op.","vraag":"Moet een verliezer altijd weg?","antwoord":"Nee; onderzoek ook klantbehoefte, functie in assortiment en verbeteropties."},{"id":"begrip-057","module":5,"thema":"Menu-engineering","term":"Assortimentsadvies","definitie":"Een beargumenteerd voorstel om producten te behouden, verbeteren, promoten of schrappen.","voorbeeld":"Promoot een slaper en controleer of de afzet toeneemt.","vraag":"Wat maakt advies overtuigend?","antwoord":"Cijfers én een duidelijke reden."},{"id":"begrip-058","module":6,"thema":"Kassabeheer","term":"Kassasysteem","definitie":"Systeem dat verkopen, betalingen en vaak ook andere bedrijfsgegevens registreert.","voorbeeld":"De kassa registreert pin- en contante betalingen.","vraag":"Waarom is juiste invoer belangrijk?","antwoord":"Om fouten en kasverschillen te voorkomen."},{"id":"begrip-059","module":6,"thema":"Kassabeheer","term":"Kassauitdraai","definitie":"Rapport met geregistreerde verkopen en betaalwijzen over een periode.","voorbeeld":"Aan het einde van de dienst bekijkt een medewerker het dagrapport.","vraag":"Waarvoor gebruik je dit?","antwoord":"Om de geregistreerde bedragen te controleren."},{"id":"begrip-060","module":6,"thema":"Kassabeheer","term":"Beginkasgeld","definitie":"Het contante wisselgeld dat bij aanvang van een dienst in de kassa zit.","voorbeeld":"De kassalade start met € 100.","vraag":"Hoort dit bij de contante omzet van die dag?","antwoord":"Nee."},{"id":"begrip-061","module":6,"thema":"Kassabeheer","term":"Contante ontvangsten","definitie":"Geld dat klanten fysiek contant betalen.","voorbeeld":"Klanten betalen samen € 230 contant.","vraag":"Hoort pinbetaling hierin?","antwoord":"Nee."},{"id":"begrip-062","module":6,"thema":"Kassabeheer","term":"Pinbetalingen","definitie":"Betalingen die elektronisch via een betaalterminal worden gedaan.","voorbeeld":"Er wordt € 480 gepind.","vraag":"Tel je pinbedragen op bij het fysieke kasgeld?","antwoord":"Nee."},{"id":"begrip-063","module":6,"thema":"Kassabeheer","term":"Kas opmaken","definitie":"Het controleren of het werkelijk aanwezige kasgeld klopt met het verwachte bedrag.","voorbeeld":"Na sluiting telt de medewerker de kassalade.","vraag":"Welke gegevens heb je nodig?","antwoord":"Beginkasgeld, contante ontvangsten, contante uitgaven/correcties en geteld eindgeld."},{"id":"begrip-064","module":6,"thema":"Kassabeheer","term":"Verwacht eindkasgeld","definitie":"Het kasbedrag dat er op basis van de registratie zou moeten zijn.","voorbeeld":"€ 100 begin + € 230 contant ontvangen − € 20 uitgaven = € 310.","vraag":"Hoe bereken je dit?","antwoord":"Begin + contante ontvangsten − geregistreerde contante uitgaven, met correcties."},{"id":"begrip-065","module":6,"thema":"Kassabeheer","term":"Werkelijk eindkasgeld","definitie":"Het bedrag dat bij de telling daadwerkelijk in de kassalade ligt.","voorbeeld":"Er wordt € 305 geteld.","vraag":"Hoe gebruik je dit voor de controle?","antwoord":"Vergelijk met verwacht eindkasgeld."},{"id":"begrip-066","module":6,"thema":"Kassabeheer","term":"Kasverschil","definitie":"Verschil tussen werkelijk geteld en verwacht kasgeld.","voorbeeld":"€ 305 werkelijk − € 310 verwacht = −€ 5.","vraag":"Wat betekent een negatieve uitkomst?","antwoord":"Een kastekort."},{"id":"begrip-067","module":6,"thema":"Kassabeheer","term":"Kastekort","definitie":"Er zit minder geld in de kas dan volgens de registratie verwacht wordt.","voorbeeld":"€ 5 minder dan verwacht.","vraag":"Wat doe je eerst?","antwoord":"Opnieuw controleren en volgens de bedrijfsprocedure melden."},{"id":"begrip-068","module":6,"thema":"Kassabeheer","term":"Kasoverschot","definitie":"Er zit meer geld in de kas dan verwacht.","voorbeeld":"€ 10 meer dan verwacht.","vraag":"Is dit automatisch een fooi voor een medewerker?","antwoord":"Nee; volg de afspraken van het bedrijf."},{"id":"begrip-069","module":6,"thema":"Kassabeheer","term":"Kasprocedure","definitie":"De afspraken voor registreren, afsluiten, tellen, corrigeren en melden van afwijkingen.","voorbeeld":"Retouren moeten met een bon worden vastgelegd.","vraag":"Waarom volgen medewerkers dezelfde procedure?","antwoord":"Zo zijn fouten sneller te ontdekken en te voorkomen."}],"aids":{"begrip-001":{"type":"basisbegrip","hint":"Vraag jezelf af: gaat het om wat het bedrijf heeft, of wat het nog moet betalen?","mistake":"Lees goed wat wordt gevraagd en verwissel dit be en, nog te betalen leveranciers en eigen vermogen. Die zet je rechts: credit."],["Reken het eigen vermogen uit","Voorbeeld: bezittingen € 15.000 en schulden € 8.000. Eigen vermogen = € 7.000."],["Controleer","Links € 15.000. Rechts € 8.000 schulden + € 7.000 eigen vermogen = € 15.000. Beide zijden zijn gelijk."]]},"winst":{"title":"Van omzet naar resultaat","steps":[["Bepaal de omzet","Gebruik de verkoopopbrengst zonder btw; bijvoorbeeld € 2.000."],["Trek de inkoopprijs verkopen af","€ 2.000 − € 800 = € 1.200 brutowinst."],["Trek overige bedrijfskosten af","€ 1.200 − € 700 = € 500 bedrijfsresultaat."],["Controleer de woorden","Omzet is niet brutowinst, en brutowinst is niet hetzelfde als nettowinst."]]},"kosten":{"title":"Kosten op twee manieren indelen","steps":[["Vraag 1: verandert de kostenpost met drukte?","Nee: meestal vast. Ja: meestal variabel."],["Vraag 2: hoort hij direct bij een specifiek product?","Ja: direct. Nee: indirect."],["Voorbeeld","Ingrediënten van een salade zijn vaak variabel én direct."],["Onthoud","Vast/variabel en direct/indirect zijn twee aparte vragen; je kiest dus niet maar één van de vier woorden."]]},"btw":{"title":"Btw: inclusief en exclusief","steps":[["Herken het tarief","Controleer welk tarief voor het betreffende product of de dienst geldt."],["Van exclusief naar inclusief","Bij 9% btw: € 10,00 × 1,09 = € 10,90."],["Van inclusief naar exclusief","Bij 9% btw: € 10,90 ÷ 1,09 = € 10,00."],["Voor de ondernemer","De ontvangen btw wordt verrekend met aftrekbare voorbelasting volgens de geldende regels."]]},"inkoop":{"title":"Van inkoopgewicht naar echte prijs","steps":[["Bereken totale inkoopkosten","5 kg à € 6 = € 30."],["Bepaal het bruikbare gewicht","Na bewerken blijft 4 kg over; verlies 1 kg."],["Bereken het rendement","4 ÷ 5 × 100% = 80%."],["Bereken de gecorrigeerde prijs","€ 30 ÷ 4 bruikbare kg = € 7,50 per kg."]]},"kostprijs":{"title":"Van ingrediënten naar kostprijs","steps":[["Bereken de ingrediëntkosten","Tel alle gebruikte hoeveelheden × hun gecorrigeerde prijs op."],["Pas een eventuele condimententoeslag toe","Bij de SVO-oefenmethode wordt vaak 5% gebruikt voor kleine smaakmakers, als die nog niet apart zijn doorberekend."],["Bereken de kostenopslag","Bij € 10 inkoopprijs en 40% opslag: € 4 aan toegerekende kosten."],["Bereken de kostprijs","€ 10 + € 4 = € 14. Deel zo nodig door het aantal porties."]]},"menu":{"title":"Hoe beoordeel je een assortiment?","steps":[["Kijk naar de afzet","Hoe vaak wordt het product verkocht?"],["Kijk naar brutowinst per product","Verkoopprijs exclusief btw minus inkoopprijs."],["Deel het product in","Hoge/lage afzet en hoge/lage bijdrage: winnaar, hardloper, slaper of verliezer."],["Geef een advies","Onderbouw met minstens twee gegevens; promoten, aanpassen of schrappen is een mogelijkheid, geen automatische regel."]]},"kas":{"title":"Een kasverschil controleren","steps":[["Begin met het wisselgeld","Stel: beginkasgeld € 100."],["Tel contante ontvangsten erbij","Bij € 320 contante betalingen is dit € 420. Pinbetalingen tel je niet mee."],["Verwerk geregistreerde kasuitgaven","€ 20 uitgave: verwacht eindkasgeld € 400."],["Vergelijk met de telling","Werkelijk € 390: verschil € 390 − € 400 = −€ 10; kastekort € 10. Onderzoek de oorzaak volgens procedure."]]}}};
