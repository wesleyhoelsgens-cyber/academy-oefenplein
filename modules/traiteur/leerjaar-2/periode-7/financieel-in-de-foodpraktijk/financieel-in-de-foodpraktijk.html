function home(){let tiles=TITLES.map((t,i)=>`<button class="tile" data-open="${i+1}"><span class="eyebrow">Module ${i+1}</span><h3>${esc(t)}</h3><span class="muted small">Theorie · voorbeelden · level 1, 2 en 3 · printopdrachten →</span></button>`).join('');$('app').innerHTML=heading('Digitale leer- en examentrainer','Wat wil je vandaag oefenen?')+`<p class="muted">Start direct bij level 3 als je de stof al beheerst. Level 1 en 2 zijn extra oefenhulp, geen verplichting.</p><button class="tile full" id="wordsHome"><h2>Begrippen & uitleg</h2><p>69 begrippen met voorbeelden, onthoudhulpen en stapsgewijze uitleg. Begin hier als een woord nog niet duidelijk is.</p></button><div class="grid">${tiles}</div><button class="tile full" id="examHome"><h2>Oefenexamens</h2><p>Drie examens van 25 punten in de stijl van SVO 3289. Nieuwe oefenvragen, geen officiële examens.</p></button>`;$('wordsHome').onclick=()=>navigate('words');$('examHome').onclick=()=>navigate('exams');document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>navigate('module',+b.dataset.open))}
function words(){let list=DATA.begrippen.filter(w=>(!wordModule||w.module===wordModule)&&[w.term,w.definitie,w.voorbeeld].join(' ').toLowerCase().includes(wordQuery.toLowerCase()));if(!list.some(w=>w.id===wordId))wordId=list[0]?.id||'';let w=list.find(x=>x.id===wordId);$('app').innerHTML=heading('Naslagwerk · 69 begrippen','Begrippen & uitleg')+`<p class="muted">Zoek een woord. Begin met de uitleg en bekijk bij moeilijke begrippen ook de onthoudhulp.</p><div class="row noprint"><input id="wordSearch" class="textin" style="flex:2" placeholder="Zoek een woord of uitleg…" value="${esc(wordQuery)}"><select id="wordFilter" style="flex:1"><option value="0">Alle thema's</option>${TITLES.map((t,i)=>`<option value="${i+1}" ${wordModule===i+1?'selected':''}>${esc(t)}</option>`).join('')}</select></div><div class="words"><div class="wordlist">${list.map(x=>`<button data-word="${esc(x.id)}" class="${x.id===wordId?'active':''}">${esc(x.term)}</button>`).join('')}</div><div class="panel worddetail" id="wordDetail">${wordHtml(w)}</div></div>`;$('wordSearch').oninput=e=>{wordQuery=e.target.value;words();$('wordSearch').focus();$('wordSearch').setSelectionRange(wordQuery.length,wordQuery.length)};$('wordFilter').onchange=e=>{wordModule=+e.target.value;words()};document.querySelectorAll('[data-word]').forEach(b=>b.onclick=()=>{wordId=b.dataset.word;words()});let b=$('wordReveal');if(b)b.onclick=()=>{b.insertAdjacentHTML('afterend',`<div class="notice">${esc(w.antwoord)}</div>`);b.remove()}}
function wordHtml(w){if(!w)return '<p>Geen begrippen gevonden.</p>';const aid=DATA.aids?.[w.term]||DATA.aids?.[w.id]||null;const guide=Array.isArray(DATA.guides)?DATA.guides.find(g=>g.module===w.module):null;return `<span class="eyebrow">Thema ${w.module}</span><h2>${esc(w.term)}</h2><h3>Wat betekent dit?</h3><p>${esc(w.definitie)}</p><div class="soft"><b>Voorbeeld</b><p>${esc(w.voorbeeld)}</p></div>${aid?`<div class="notice"><b>Onthoudhulp</b><p>${esc(typeof aid==='string'?aid:aid.hint||aid.ezelsbrug||aid.onthoudhulp||aid.tip||'')}</p>${aid.mistake?`<p><b>Veelgemaakte fout:</b> ${esc(aid.mistake)}</p>`:''}</div>`:''}${aid?.why?`<div class="soft"><b>Waarom leer je dit?</b><p>${esc(aid.why)}</p></div>`:''}<h3>Controleer jezelf</h3><div class="soft">${esc(w.vraag)}</div><button id="wordReveal" class="btn">Bekijk uitleg / antwoord</button><div class="separator"></div><button class="btn" id="goModule" onclick="navigate('module',${w.module})">Ga naar module ${w.module} →</button>`}
const LEARNING={"2":{"goals":["omzet, inkoopprijs verkopen, brutowinst, bedrijfskosten en bedrijfsresultaat uitleggen en eenvoudige bedragen berekenen;","de belangrijkste posten van een eenvoudige winst- en verliesrekening herkennen en interpreteren;","kosten indelen als vast of variabel én als direct of indirect;","in eigen woorden uitleggen wat te betalen, te vorderen en af te dragen btw betekenen;","een haalbare maatregel beschrijven waarmee een foodbedrijf kosten kan beheersen of brutowinst kan verbeteren."],"sections":[{"title":"Waarom kijken bedrijven naar hun cijfers?","blocks":[{"kind":"text","text":"Een bedrijf verkoopt producten en maakt daarvoor kosten. Veel omzet betekent niet automatisch veel winst. De ondernemer wil weten hoeveel producten zijn verkocht, wat de inkoop heeft gekost en welke andere kosten zijn gemaakt. Met die gegevens kan het bedrijf keuzes maken over bijvoorbeeld inkoop, roosters en verspilling."},{"kind":"text","text":"Denk even na: Een foodbedrijf heeft € 5.000 omzet. Heeft het bedrijf dan € 5.000 verdiend? Nee: de inkoop en overige kosten moeten er nog vanaf. Voor een eerlijke vergelijking werken we hieronder met bedragen zonder btw."}]},{"title":"Van omzet naar bedrijfsresultaat","blocks":[{"kind":"table","rows":[["Begrip","Betekenis"],["Omzet / opbrengst verkopen","De waarde van verkochte producten exclusief btw."],["Inkoopprijs verkopen","De inkoopwaarde van de producten die daadwerkelijk zijn verkocht."],["Brutowinst","Omzet minus inkoopprijs verkopen."],["Bedrijfskosten","Overige kosten, zoals huur, energie en personeel."],["Bedrijfsresultaat","Brutowinst minus bedrijfskosten: winst of verlies."]]},{"kind":"heading","text":"Rekenvoorbeeld: één periode"},{"kind":"table","rows":[["Post","Bedrag"],["Omzet exclusief btw","€ 5.000"],["Inkoopprijs verkopen","€ 2.000 −"],["Brutowinst","€ 3.000"],["Overige bedrijfskosten","€ 2.600 −"],["Bedrijfsresultaat: winst","€ 400"]]},{"kind":"text","text":"Rekenstappen: € 5.000 − € 2.000 = € 3.000 brutowinst. Daarna € 3.000 − € 2.600 = € 400 bedrijfsresultaat. Als de overige bedrijfskosten € 3.200 waren, zou het bedrijf € 200 verlies maken."},{"kind":"text","text":"Let op: omzet is niet hetzelfde als winst. Brutowinst is ook nog niet het bedrag dat de ondernemer overhoudt na de overige bedrijfskosten. In de oefeningen gebruiken we “bedrijfsresultaat”; het e-book bespreekt daarnaast het kengetal nettowinst."}]},{"title":"De winst- en verliesrekening begrijpen","blocks":[{"kind":"text","text":"Een winst- en verliesrekening verzamelt opbrengsten en kosten over een periode, bijvoorbeeld één maand of één jaar. Dit verschilt van de balans uit week 1: een balans is een momentopname van bezittingen, schulden en eigen vermogen. De winst- en verliesrekening laat juist zien wat in een periode is verdiend en uitgegeven."},{"kind":"heading","text":"Eenvoudige manier om de cijfers te lezen"},{"kind":"bullet","text":"Bekijk de periode: over welke maand of welk jaar gaat dit overzicht?"},{"kind":"bullet","text":"Zoek de omzet en inkoopprijs verkopen. Bereken of controleer de brutowinst."},{"kind":"bullet","text":"Bekijk de overige kosten en bereken het bedrijfsresultaat."},{"kind":"bullet","text":"Stel de vraag: waardoor is de winst hoog of laag? Welke post kan het bedrijf beïnvloeden?"},{"kind":"text","text":"Niet alle gegevens uit een boekhouding zijn geschikt voor direct vergelijken: kijk of bedragen exclusief btw zijn en of je over dezelfde periode spreekt."}]},{"title":"Vaste en variabele kosten","blocks":[{"kind":"text","text":"Deze indeling gaat over de vraag: veranderen de kosten wanneer er meer of minder producten worden gemaakt of verkocht?"},{"kind":"table","rows":[["Vaste kosten","Variabele kosten"],["Veranderen op korte termijn niet direct mee met productie of verkoop.","Bewegen mee met de productie, verkoop of drukte."],["Voorbeelden: huur, verzekering, afschrijving, vaste basisbezetting.","Voorbeelden: ingrediënten, sommige verpakkingen, extra inzet van oproepkrachten."]]},{"kind":"text","text":"Nuance: personeelskosten kunnen deels vast (basisbezetting) en deels variabel (extra uren) zijn. Ook kosten die op korte termijn vast zijn, kunnen op langere termijn veranderen."}]},{"title":"Directe en indirecte kosten","blocks":[{"kind":"text","text":"Deze tweede indeling gaat over een andere vraag: kun je de kosten rechtstreeks aan één product of gerecht koppelen?"},{"kind":"table","rows":[["Directe kosten","Indirecte kosten"],["Rechtstreeks toe te rekenen aan een bepaald product.","Niet rechtstreeks aan één specifiek product toe te rekenen."],["Voorbeelden: vlees of groenten in een gerecht; een specifieke verpakking.","Voorbeelden: algemene schoonmaak, huur, accountant en algemene energiekosten."]]},{"kind":"text","text":"Belangrijk: vast/variabel en direct/indirect zijn twee verschillende indelingen. Een ingrediënt kan tegelijk variabel én direct zijn. Huur is in een eenvoudige casus meestal vast én indirect. Laat studenten dus niet kiezen uit vier categorieën alsof ze elkaar uitsluiten."},{"kind":"heading","text":"Kort klassikaal voorbeeld"},{"kind":"table","rows":[["Kostenpost","Vast of variabel?","Direct of indirect?"],["Ingrediënten voor 30 maaltijden","Variabel","Direct"],["Huur bedrijfsruimte","Vast","Indirect"],["Specifiek bakje per verkochte maaltijd","Variabel","Direct"],["Vaste basisbezetting","Vast","Vaak indirect in deze eenvoudige casus"]]}]},{"title":"Btw in de financiële administratie","blocks":[{"kind":"text","text":"Btw is belasting die bij aankopen en verkopen een rol speelt. Bij verkoop ontvangt een bedrijf btw van klanten. Bij zakelijke inkopen betaalt het bedrijf vaak btw aan leveranciers. Het e-book maakt onderscheid tussen de volgende begrippen:"},{"kind":"table","rows":[["Begrip uit het e-book","Betekenis"],["Te betalen btw","Btw die het bedrijf over zijn verkopen verschuldigd is."],["Te vorderen btw","Btw op inkopen die het bedrijf, als aan de voorwaarden is voldaan, kan terugvragen/verrekenen."],["Af te dragen btw","In een eenvoudig voorbeeld: te betalen btw min te vorderen btw."]]}]},{"title":"Kostenbewust handelen in de foodpraktijk","blocks":[{"kind":"text","text":"Medewerkers kunnen niet iedere kostenpost veranderen, maar hebben wel invloed op bijvoorbeeld portionering, verspilling, opslag, werkvolgorde en zorgvuldig gebruik van materiaal. Een goede maatregel is concreet en controleerbaar."},{"kind":"table","rows":[["Waarneming","Mogelijke actie","Waarom relevant?"],["Er worden vaak te grote porties gemaakt.","Standaardporties afspreken en wegen.","Minder grondstofverbruik per verkocht product."],["Veel producten worden weggegooid.","Beter plannen, registreren en voorraad controleren.","Minder verspilling en afschrijving."],["Verpakkingen worden onnodig dubbel gebruikt.","Juiste verpakking en werkinstructie kiezen.","Lagere kosten voor materialen."]]},{"kind":"text","text":"Vermijd de denkfout dat “goedkoop inkopen” altijd de beste keuze is: kwaliteit, rendement, bereidingstijd en voedselveiligheid tellen ook mee. De berekeningen hiervoor komen terug in week 3 en 4."}]}],"source":"Theoriebuffer_Week_02_Winst_verlies_btw_kosten_v1.docx"},"3":{"goals":["uitleggen wat inkoopgewicht, bruikbaar gewicht en bewerkingsverlies zijn;","het verlies in kilogrammen en als percentage van het inkoopgewicht berekenen;","het rendement (bruikbaar deel) van een grondstof in procenten berekenen;","de gecorrigeerde inkoopprijs per kilogram bruikbaar product berekenen;","verschillende inkoopvormen vergelijken en je keuze onderbouwen."],"sections":[{"title":"Waarom calculeren bij de inkoop?","blocks":[{"kind":"text","text":"Een grondstof kan goedkoop lijken, terwijl een deel verloren gaat bij schoonmaken, ontbenen of bijsnijden. Een medewerker die alleen naar de prijs per ingekochte kilogram kijkt, vergelijkt producten dan niet eerlijk. Je moet weten wat één kilogram bruikbaar product werkelijk kost. Dit heet dit de gecorrigeerde inkoopprijs."},{"kind":"text","text":"Voorbeeld: een bedrijf koopt 5 kg grondstof, maar kan na bewerken nog slechts 4 kg gebruiken. De inkoopkosten worden verdeeld over die 4 kg, niet over de oorspronkelijke 5 kg."}]},{"title":"Begrippen die je nodig hebt","blocks":[{"kind":"table","rows":[["Begrip","Betekenis"],["Inkoopgewicht","Het totale gewicht dat je bij de leverancier koopt en betaalt."],["Bewerkingsverlies","Het deel dat bij schoonmaken of bewerken niet bruikbaar overblijft voor het gekozen gerecht."],["Bruikbaar gewicht","Het gewicht dat na de bewerking overblijft voor gebruik in het product."],["Rendement","Het bruikbare gewicht, uitgedrukt als percentage van het inkoopgewicht."],["Gecorrigeerde inkoopprijs","De inkoopkosten omgerekend naar één kilogram bruikbaar product."]]},{"kind":"text","text":"Let op: noteer bij iedere berekening de eenheid (g of kg). Reken eerst alle gewichten naar dezelfde eenheid om. 1 kg = 1.000 g; 360 g = 0,360 kg."}]},{"title":"Gewicht en verlies berekenen","blocks":[{"kind":"text","text":"Formule: bruikbaar gewicht = inkoopgewicht − bewerkingsverlies."},{"kind":"heading","text":"Uitgewerkt voorbeeld 1 – kip voor een salade"},{"kind":"text","text":"Je bereidt een salade met kip. Je koopt 5,000 kg kip. Bij het schoonmaken verlies je 360 gram. Reken dit eerst om: 360 g = 0,360 kg. Er blijft 5,000 − 0,360 = 4,640 kg bruikbare kip over."},{"kind":"text","text":"Controle: 4,640 kg bruikbare kip + 0,360 kg verlies = 5,000 kg ingekocht."}]},{"title":"Gecorrigeerde inkoopprijs berekenen","blocks":[{"kind":"text","text":"We gaan verder met de kip voor de salade. Je weet al dat je 5,000 kg inkoopt en na schoonmaken 4,640 kg overhoudt. Nu bereken je wat één kilogram bruikbare kip kost."},{"kind":"text","text":"Formule: gecorrigeerde inkoopprijs per kg = totale inkoopkosten ÷ bruikbaar gewicht in kg."},{"kind":"heading","text":"Uitgewerkt voorbeeld 2 – dezelfde kipcasus"},{"kind":"table","rows":[["Stap","Berekening","Uitkomst"],["1. Inkoopkosten","5 kg × € 6,90 per kg","€ 34,50"],["2. Bruikbaar gewicht","5,000 kg − 0,360 kg","4,640 kg"],["3. Gecorrigeerde inkoopprijs","€ 34,50 ÷ 4,640 kg","€ 7,44 per kg"]]},{"kind":"text","text":"Uitleg: de leverancier rekent € 6,90 per ingekochte kilogram, maar één kilogram daadwerkelijk bruikbare kip kost door bewerkingsverlies afgerond € 7,44. Rond bij geldbedragen pas aan het eind af op twee decimalen."},{"kind":"heading","text":"Snel herkennen van veelgemaakte fouten"},{"kind":"bullet","text":"De inkoopkosten delen door 5 kg in plaats van door 4,640 kg. Dan vergeet je het verlies."},{"kind":"bullet","text":"360 gram als 360 kilogram gebruiken of rechtstreeks van 5 kg aftrekken zonder omrekening."},{"kind":"bullet","text":"Het verliespercentage optellen bij de inkoopprijs zonder eerst te controleren wat bruikbaar overblijft."},{"kind":"bullet","text":"Een uitkomst zonder € /kg noteren, waardoor niet duidelijk is wat is berekend."}]},{"title":"Inkoopvormen vergelijken: de uiencasus","blocks":[{"kind":"text","text":"Voor 6 kg gesnipperde uien vergelijk je drie inkoopmogelijkheden. De gegevens hieronder komen uit de SVO-rekenvoorbeelden. Kijk niet alleen naar de prijs per ingekochte kilogram, maar bereken wat je betaalt per kilogram bruikbaar product."},{"kind":"table","rows":[["Inkoopvorm","Ingekocht","Totale inkoop","Bruikbaar","Gecorrigeerd / kg"],["Vuile uien","10 kg × € 1,00","€ 10,00","6 kg","€ 1,67"],["Schone uien","8 kg × € 1,50","€ 12,00","6 kg","€ 2,00"],["Gesnipperde uien","6 kg × € 2,50","€ 15,00","6 kg","€ 2,50"]]},{"kind":"text","text":"Op basis van alléén de grondstofkosten zijn de vuile uien het voordeligst. Maar daar is meer schoonmaak- en snijwerk voor nodig. Als je tijd, loonkosten of andere bewerkingskosten wilt meewegen, heb je extra gegevens nodig. Trek dus niet automatisch de conclusie dat de goedkoopste grondstof altijd de beste totale bedrijfskeuze is."}]},{"title":"Van rekenen naar een inkoopadvies","blocks":[{"kind":"text","text":"Een goed advies bestaat uit drie onderdelen: (1) de juiste vergelijking op basis van hetzelfde bruikbare gewicht, (2) een concrete berekening met eenheid, en (3) een uitleg van factoren die niet in de berekening zijn opgenomen, zoals voorbereidingstijd of productkwaliteit."},{"kind":"text","text":"Voorbeeldadvies: “Op grondstofkosten kosten de vuile uien € 1,67 per kg bruikbaar product, tegenover € 2,50 voor gebruiksklare uien. Dat is € 0,83 per kg verschil. Voor een definitieve keuze moeten we nog nagaan hoeveel extra arbeid het schoonmaken kost.”"}]},{"title":"Oefenen – drie oplopende opgaven","blocks":[{"kind":"heading","text":"Opgave 1 – gewichten"},{"kind":"text","text":"Je koopt 8,0 kg aardappelen. Na schillen houd je 6,8 kg over. Bereken het verlies in kg, het verliespercentage en het rendement."},{"kind":"heading","text":"Opgave 2 – gecorrigeerde inkoopprijs"},{"kind":"text","text":"Je koopt 3,0 kg groenten voor € 2,40 per kg. Na schoonmaken blijft 2,4 kg over. Bereken de totale inkoopkosten en de gecorrigeerde inkoopprijs per kilogram."},{"kind":"heading","text":"Opgave 3 – vergelijken en adviseren"},{"kind":"text","text":"Optie A: 5 kg onbewerkte grondstof voor € 2,00 per kg; 4 kg bruikbaar. Optie B: 4 kg gebruiksklaar voor € 2,65 per kg; geen verlies. Bereken de gecorrigeerde inkoopprijs van beide opties en geef een financieel onderbouwd advies op grondstofkosten."}]}],"source":"Theoriebuffer_Week_03_Calculeren_bij_de_inkoop_v1.docx"},"4":{"goals":["een recept omrekenen naar de juiste hoeveelheid en de grondstofkosten optellen;","uitleggen waarom de gecorrigeerde inkoopprijs nodig is voor een gerechtcalculatie;","een kostenopslag in procenten of in euro’s per kilogram/stuk herkennen en toepassen;","de kostprijs van een gerecht of portie berekenen, met juiste eenheid en tussenstappen;","uitleggen wat het verschil is tussen inkoopprijs, kostprijs en verkoopprijs."],"sections":[{"title":"Van grondstof naar gerecht","blocks":[{"kind":"text","text":"In week 3 rekende je uit hoeveel één kilogram bruikbare grondstof werkelijk kost. Bij een gerecht gebruik je meestal meerdere ingrediënten. Van ieder ingrediënt bepaal je eerst de kosten voor de hoeveelheid die het recept nodig heeft. Daarna tel je deze bedragen op."},{"kind":"text","text":"Gebruik bij producten met bewerkingsverlies de gecorrigeerde inkoopprijs per kg bruikbaar product. Gebruik bij ingrediënten zonder relevant verlies de gewone prijs per kg of per stuk. Het uitgangspunt is: reken op dezelfde basis als de hoeveelheid die in het recept staat."},{"kind":"heading","text":"Eenvoudige receptberekening"},{"kind":"table","rows":[["Ingrediënt","Hoeveelheid voor 4 porties","Prijs op bruikbare basis","Kosten"],["Aardappelen","0,80 kg","€ 2,50 per kg","€ 2,00"],["Groenten","0,60 kg","€ 3,00 per kg","€ 1,80"],["Vlees/alternatief","0,40 kg","€ 9,00 per kg","€ 3,60"],["Totaal","","","€ 7,40"]]},{"kind":"text","text":"Formule: kosten ingrediënt = hoeveelheid in kg × prijs per kg. Voor 4 porties zijn de berekende grondstofkosten € 7,40. Per portie: € 7,40 ÷ 4 = € 1,85. Dit is nog niet de volledige kostprijs."}]},{"title":"Wat zijn condimenten en kleine toevoegingen?","blocks":[{"kind":"text","text":"Kruiden, specerijen en kleine garneringen noemen we condimenten. In de SVO-calculatiemethode rekenen we hiervoor met een toeslag van 5% over de ingrediëntenkosten. Dit is de afspraak die je bij deze oefeningen gebruikt."},{"kind":"text","text":"Voorbeeld: de ingrediënten kosten samen € 7,40. De condimententoeslag is € 7,40 × 0,05 = € 0,37. De totale ingrediëntenkosten worden € 7,40 + € 0,37 = € 7,77."},{"kind":"text","text":"Onthoud: condimententoeslag is iets anders dan de kostenopslag voor overige bedrijfskosten."}]},{"title":"Waarom een kostenopslag?","blocks":[{"kind":"text","text":"Voor het maken en leveren van een gerecht zijn er meer kosten dan de grondstoffen alleen. Denk aan personeelsuren, energie, huur, afschrijving en verpakking. Bij deze berekeningen heet het toerekenen van deze bedrijfskosten aan producten de kostenopslag. Na het optellen van inkoopprijs en kostenopslag ontstaat de kostprijs."},{"kind":"text","text":"SVO-formule: kostprijs product = inkoopprijs + kostenopslag."},{"kind":"heading","text":"Twee manieren van kostenopslag voor je berekening"},{"kind":"table","rows":[["Methode","Benodigde gegevens","Toepassing"],["Percentage","Inkoopprijs product en het geldende kostenopslagpercentage","Opslagbedrag = inkoopprijs × opslagpercentage / 100"],["Bedrag per kg of stuk","Hoeveelheid kg/stuks en opslagbedrag per kg of stuk","Opslagbedrag = hoeveelheid × opslag per kg/stuk"]]},{"kind":"text","text":"De hoogte van het kostenopslagpercentage of het bedrag per kg/stuk moet uit bedrijfsgegevens, begroting of een expliciet opgegeven oefencasus komen. Studenten verzinnen dit niet zelf."}]},{"title":"Volledig rekenen met kostenopslag in procenten","blocks":[{"kind":"heading","text":"Voorbeeld 1 – bereken de kostprijs voor vier porties"},{"kind":"table","rows":[["Stap","Berekening","Uitkomst"],["1. Ingrediënten","€ 7,40","€ 7,40"],["2. Condimenten 5%","€ 7,40 × 0,05","€ 0,37"],["3. Inkoopprijs gerecht","€ 7,40 + € 0,37","€ 7,77"],["4. Kostenopslag 55%","€ 7,77 × 0,55","€ 4,2735"],["5. Kostprijs 4 porties","€ 7,77 + € 4,2735","€ 12,04"],["6. Kostprijs per portie","€ 12,0435 ÷ 4","€ 3,01"]]},{"kind":"text","text":"Reken bij geldbedragen met voldoende decimalen en rond de uiteindelijke kostprijs af op centen."},{"kind":"heading","text":"Een belangrijk onderscheid"},{"kind":"text","text":"Een kostenopslag is niet hetzelfde als winst. De kostprijs is ook nog niet de consumentenprijs. Wil je weten hoe de volledige verkoopprijs wordt opgebouwd? Open dan het prijsschema bovenaan de module."}]},{"title":"Kostenopslag per kilogram of per stuk","blocks":[{"kind":"text","text":"Een tweede werkwijze voor je berekening is een vast opslagbedrag per kilogram of per stuk. Dit vraagt een betrouwbare administratie van geproduceerde of verkochte hoeveelheden."},{"kind":"heading","text":"Voorbeeld B – opslag per portie"},{"kind":"text","text":"Een gerecht heeft een inkoopprijs van € 2,80 per portie. Het bedrijf rekent met € 1,60 kostenopslag per portie. Kostprijs = € 2,80 + € 1,60 = € 4,40 per portie."},{"kind":"text","text":"Voorbeeld C – opslag per kilogram : inkoopprijs voor 3 kg bereid product = € 18,00. Kostenopslag € 2,00 per kg. Totale opslag 3 × € 2,00 = € 6,00. Totale kostprijs € 24,00; kostprijs per kg € 8,00."}]},{"title":"Stappenplan voor elke receptcalculatie","blocks":[{"kind":"bullet","text":"1. Noteer hoeveel porties of hoeveel kilogram je moet maken."},{"kind":"bullet","text":"2. Lees het recept nauwkeurig en reken alle hoeveelheden naar dezelfde passende eenheden om."},{"kind":"bullet","text":"3. Bepaal per ingrediënt de (gecorrigeerde) inkoopprijs op bruikbare basis."},{"kind":"bullet","text":"4. Bereken en tel de ingredientkosten op; verwerk condimenten indien de gekozen methode dat vraagt."},{"kind":"bullet","text":"5. Bepaal het juiste kostenopslagpercentage of opslagbedrag uit de casus/bedrijfsgegevens."},{"kind":"bullet","text":"6. Bereken de volledige kostprijs van het gerecht en daarna per portie of per kg."},{"kind":"bullet","text":"7. Controleer je uitkomst, noteer euro’s en hoeveelheden, en leg de berekening uit."},{"kind":"text","text":"Controleer ook of de recepthoeveelheid en de inkoophoeveelheid niet door elkaar worden gehaald. De kostprijs van vier porties is niet vanzelf dezelfde als de kostprijs per portie."}]},{"title":"Rekenen – drie oplopende oefeningen","blocks":[{"kind":"heading","text":"Opgave 1 – recept omrekenen"},{"kind":"text","text":"Een recept voor 4 porties bevat 600 g groente. Je maakt 10 porties. Hoeveel kilogram groente heb je nodig? De bruikbare groente kost € 3,20 per kg. Bereken de groentekosten."},{"kind":"heading","text":"Opgave 2 – kostenopslag"},{"kind":"text","text":"Een gerecht heeft een inkoopprijs van € 12,00. Het bedrijf rekent met een kostenopslag van 40%. Bereken de opslag en de kostprijs."},{"kind":"heading","text":"Opgave 3 – integrale calculatie"},{"kind":"text","text":"Voor 5 porties bedragen de ingrediëntenkosten € 15,00. Gebruik de 5%-condimententoeslag  en daarna een kostenopslag van 60%. Bereken de inkoopprijs inclusief condimenten, de totale kostprijs en de kostprijs per portie."}]}],"source":"Theoriebuffer_Week_04_Calculeren_bij_de_bewerking_v1.docx"},"5":{"goals":["uitleggen wat menu-engineering is en waarom een foodbedrijf dit gebruikt;","afzet, verkoopprijs, inkoopprijs en brutowinst uit productgegevens aflezen en waar nodig berekenen;","een product onderbouwd indelen als winnaar, hardloper, slaper of verliezer;","een haalbaar assortimentsadvies geven en dat met cijfers uitleggen;","vertellen hoe jouw leerbedrijf verkoopgegevens gebruikt om keuzes te maken."],"sections":[{"title":"Waarom menu-engineering?","blocks":[{"kind":"text","text":"Een foodbedrijf verkoopt verschillende gerechten en producten. Sommige verkopen vaak, andere bijna nooit. Sommige leveren per verkocht stuk veel brutowinst op, andere weinig. Met menu-engineering vergelijk je die twee kenmerken en maak je beter onderbouwde keuzes over het assortiment."},{"kind":"text","text":"Je kijkt dus niet alleen naar wat populair is, maar ook naar wat een product financieel bijdraagt. De ondernemer beslist vervolgens of een product behouden, aangepast, extra gepromoot of eventueel vervangen wordt."}]},{"title":"De kernbegrippen","blocks":[{"kind":"table","rows":[["Begrip","Betekenis"],["Afzet","Het aantal verkochte stuks of porties in een bepaalde periode."],["Omzet","De verkoopopbrengst. Bij berekeningen in deze les: exclusief btw."],["Inkoopprijs","Kosten van de ingekochte ingrediënten of producten."],["Brutowinst per product","Verkoopprijs exclusief btw minus inkoopprijs van het product."],["Brutowinstpercentage","Brutowinst gedeeld door verkoopprijs exclusief btw × 100%."],["Assortiment","Het geheel van producten dat een bedrijf aanbiedt."]]},{"kind":"text","text":"Let op: brutowinst per portie (in euro’s), brutowinstpercentage en totale brutowinst per week zijn verschillende cijfers. Benoem altijd welk cijfer je gebruikt en vergelijk producten op dezelfde manier."}]},{"title":"De vier categorieën volgens het SVO-e-book","blocks":[{"kind":"table","rows":[["Categorie","Afzet","Bijdrage brutowinst","Kenmerk"],["Winnaar","Hoog","Hoog","Wordt vaak verkocht en levert relatief veel brutowinst op."],["Hardloper","Hoog","Laag","Wordt vaak verkocht maar levert relatief weinig brutowinst op."],["Slaper","Laag","Hoog","Levert per verkoop goed op, maar wordt weinig gekozen."],["Verliezer","Laag","Laag","Wordt weinig verkocht en levert relatief weinig op."]]},{"kind":"text","text":"Hoog of laag is geen vast universeel getal. Gebruik in een oefening duidelijke grenzen (zoals een afgesproken afzetgrens en brutowinstdoelstelling) of een expliciete vergelijking binnen het assortiment. Zonder zulke grenzen kun je een product niet altijd eenduidig classificeren."}]},{"title":"Rekenvoorbeeld: van verkoopcijfers naar inzicht","blocks":[{"kind":"text","text":"Fictief foodbedrijf: alle prijzen zijn exclusief btw. De cijfers hieronder zijn didactische oefengegevens, geen echte bedrijfsresultaten."},{"kind":"table","rows":[["Product","Verkoopprijs","Inkoopprijs","Afzet / week"],["Maaltijdbowl A","€ 10,00","€ 3,50","65"],["Warme wrap B","€ 8,00","€ 3,60","70"],["Salade C","€ 9,00","€ 2,70","20"],["Lunchbroodje D","€ 6,00","€ 3,30","18"]]},{"kind":"heading","text":"Stap 1 – Bereken de brutowinst per product"},{"kind":"text","text":"Brutowinst per product = verkoopprijs exclusief btw − inkoopprijs."},{"kind":"table","rows":[["Product","Berekening","Brutowinst / stuk"],["A","€ 10,00 − € 3,50","€ 6,50"],["B","€ 8,00 − € 3,60","€ 4,40"],["C","€ 9,00 − € 2,70","€ 6,30"],["D","€ 6,00 − € 3,30","€ 2,70"]]},{"kind":"heading","text":"Stap 2 – Bereken het brutowinstpercentage"},{"kind":"text","text":"Brutowinstpercentage = (brutowinst per stuk ÷ verkoopprijs exclusief btw) × 100%."},{"kind":"table","rows":[["Product","Berekening","Brutowinst %"],["A","€ 6,50 ÷ € 10,00 × 100","65%"],["B","€ 4,40 ÷ € 8,00 × 100","55%"],["C","€ 6,30 ÷ € 9,00 × 100","70%"],["D","€ 2,70 ÷ € 6,00 × 100","45%"]]},{"kind":"heading","text":"Stap 3 – Spreek de beoordelingsgrenzen af"},{"kind":"text","text":"Voor deze oefening spreken we af: hoge afzet = minimaal 40 porties per week; hoge brutowinst = minimaal 60% van de verkoopprijs. Deze oefengrenzen zijn gekozen om de berekening te leren, niet als algemene bedrijfsnorm."},{"kind":"table","rows":[["Product","Afzet hoog/laag","Brutowinst hoog/laag","Indeling"],["A","65 = hoog","65% = hoog","Winnaar"],["B","70 = hoog","55% = laag","Hardloper"],["C","20 = laag","70% = hoog","Slaper"],["D","18 = laag","45% = laag","Verliezer"]]},{"kind":"heading","text":"Stap 4 – Controleer wat het bedrijf in totaal verdient"},{"kind":"text","text":"Totale brutowinst per week = afzet × brutowinst per stuk. Voor product A: 65 × € 6,50 = € 422,50. Voor B: 70 × € 4,40 = € 308,00. Voor C: 20 × € 6,30 = € 126,00. Voor D: 18 × € 2,70 = € 48,60."},{"kind":"text","text":"Deze extra vergelijking helpt bij een advies, maar vervangt de afgesproken categoriegrenzen niet. De invloed van bereidingstijd, afval en bedrijfskosten kan daarnaast belangrijk zijn."}]},{"title":"Wat adviseer je de ondernemer?","blocks":[{"kind":"text","text":"Een goede classificatie is pas de eerste stap. Daarna moet je uitleggen wat de cijfers betekenen en wat een haalbare actie is. Het gaat om een beredeneerd advies, niet om één automatisch verplicht besluit."},{"kind":"table","rows":[["Categorie","Mogelijk advies","Let op"],["Winnaar","Kwaliteit en beschikbaarheid bewaken; goed zichtbaar houden.","Controleer of de productiecapaciteit voldoende is."],["Hardloper","Inkoop of receptuur verbeteren zonder kwaliteit te verliezen.","De afzet is al hoog; kleine verbeteringen kunnen veel effect hebben."],["Slaper","Meer bekendheid geven of de presentatie/plaats op het menu verbeteren.","Onderzoek eerst waarom klanten het product weinig kiezen."],["Verliezer","Onderzoek oorzaak; product aanpassen of mogelijk schrappen.","Ook een product met lage afzet kan strategische waarde hebben."]]}]},{"title":"Eerst zelf nadenken – korte oefening","blocks":[{"kind":"text","text":"Fictieve oefencijfers: doel hoge afzet minimaal 30 stuks per week; doel hoge brutowinst minimaal 60%."},{"kind":"table","rows":[["Product","Afzet","Brutowinst %"],["Maaltijd X","45","64%"],["Maaltijd Y","12","67%"],["Maaltijd Z","50","49%"],["Maaltijd Q","10","43%"]]},{"kind":"text","text":"Opdracht A. Schrijf bij elk product de juiste categorie. Opdracht B. Kies één product en formuleer één haalbare verbetering. Noem minstens twee cijfers uit de tabel in je uitleg."}]},{"title":"Aandachtspunten bij het interpreteren","blocks":[{"kind":"bullet","text":"Controleer of de verkoopcijfers betrekking hebben op dezelfde periode."},{"kind":"bullet","text":"Let erop dat bedragen exclusief btw worden vergeleken."},{"kind":"bullet","text":"Maak onderscheid tussen omzet, brutowinst in euro’s en brutowinstpercentage."},{"kind":"bullet","text":"Trek geen conclusies uit één cijfer: populariteit én brutowinst zijn nodig."},{"kind":"bullet","text":"Een assortimentsadvies houdt ook rekening met kwaliteit, beschikbaarheid en bedrijfsdoelen."}]}],"source":"Theoriebuffer_Week_05_Menu_engineering_v1.docx"},"6":{"goals":["uitleggen waarom zorgvuldig kassabeheer belangrijk is voor een foodbedrijf;","benoemen welke verkoop- en betaalgegevens een kassasysteem kan leveren;","de belangrijkste stappen van een kascontrole uitleggen;","een eenvoudig kasverschil berekenen en mogelijke oorzaken onderzoeken;","maatregelen voorstellen om kasverschillen te beperken."],"sections":[{"title":"Wat is kassabeheer?","blocks":[{"kind":"text","text":"Kassabeheer is het zorgvuldig registreren, controleren en verantwoorden van betalingen en verkopen. Een kassasysteem is meer dan een geldlade: het kan verkoopgegevens vastleggen, betalingen onderscheiden en rapportages leveren. Het doel is een betrouwbare registratie van de geldstroom met zo min mogelijk kasverschillen."},{"kind":"text","text":"Een goed kassasysteem helpt de medewerker bij het afrekenen, de leidinggevende bij controles en bestellingen en de ondernemer bij het volgen van de omzet. De precieze mogelijkheden hangen af van het systeem dat het bedrijf gebruikt."},{"kind":"heading","text":"Welke informatie kan uit een kassa komen?"},{"kind":"table","rows":[["Gegeven","Waarom nuttig?"],["Totale omzet","Inzicht in de verkopen over een dag of periode"],["Omzet per product","Zien welke producten veel of weinig worden verkocht"],["Betaalwijze","Contant, pin, creditcard of betaling op rekening onderscheiden"],["Correcties en retouren","Afwijkende transacties terugvinden"],["Omzet per tijdstip","Drukke en rustige momenten herkennen"]]},{"kind":"text","text":"Let op: een omzetoverzicht is niet automatisch een overzicht van de winst. Voor winstberekeningen zijn ook inkoop en andere kosten nodig."}]},{"title":"Afspraken en verantwoordelijkheden","blocks":[{"kind":"text","text":"Een kassaprocedure verschilt per bedrijf. Mogelijke afspraken gaan over inloggen met een eigen code, correct aanslaan, retouren registreren, kasgeld veilig bewaren, bevoegdheden en wie een controle uitvoert. Medewerkers volgen de richtlijnen van hun eigen leerbedrijf."},{"kind":"text","text":"Het vierogenprincipe betekent dat twee personen samen een controle uitvoeren. Dit is een mogelijke controlemaatregel, geen universele verplichting. Ook elektronische betalingen nemen kasverschillen met contant geld niet volledig weg."}]},{"title":"Kas opmaken: stap voor stap","blocks":[{"kind":"text","text":"Aan het einde van een dienst wordt vastgesteld of het werkelijk aanwezige geld overeenkomt met het bedrag dat volgens de registratie aanwezig moet zijn. Dit heet hiervoor onder andere onderstaande controles:"},{"kind":"bullet","text":"Controleer de geregistreerde omzet en betalingen op rekening."},{"kind":"bullet","text":"Controleer pin-, creditcard- en andere elektronische betalingen."},{"kind":"bullet","text":"Controleer correcties, foutieve aanslagen en retouren."},{"kind":"bullet","text":"Controleer eventuele contante uitgaven uit de kas met bijbehorende bonnen."},{"kind":"bullet","text":"Tel het aanwezige contante geld."},{"kind":"bullet","text":"Vergelijk het getelde bedrag met het verwachte contante bedrag en onderzoek verschillen."},{"kind":"heading","text":"Eenvoudig rekenvoorbeeld – oefencasus"},{"kind":"text","text":"Beginwisselgeld € 100,00. Contante ontvangsten € 385,00. Een gedocumenteerde contante uitgave bedraagt € 25,00. Bij afsluiting wordt € 455,00 geteld."},{"kind":"table","rows":[["Berekening","Bedrag"],["Beginwisselgeld","€ 100,00"],["+ Contante ontvangsten","€ 385,00"],["– Contante uitgave","€ 25,00"],["= Verwacht kasgeld","€ 460,00"],["Werkelijk geteld","€ 455,00"],["Kasverschil (geteld – verwacht)","– € 5,00"]]},{"kind":"text","text":"Er is in dit voorbeeld een kastekort van € 5,00. De berekening vertelt nog niet hoe het verschil is ontstaan. Controleer eerst de registratie en de geldstromen; een verschil is niet automatisch bewijs van een fout door een bepaalde medewerker."}]},{"title":"Kasverschillen herkennen en onderzoeken","blocks":[{"kind":"heading","text":"Kastekort en kasoverschot"},{"kind":"text","text":"Als er minder kasgeld aanwezig is dan verwacht, is er een kastekort. Als er meer kasgeld aanwezig is, is er een kasoverschot. In beide gevallen moeten medewerkers de bedrijfsprocedure volgen en het verschil zorgvuldig vastleggen."},{"kind":"heading","text":"Mogelijke oorzaken"},{"kind":"bullet","text":"Verkeerd wisselgeld teruggegeven."},{"kind":"bullet","text":"Contante betaling geboekt als pin of andersom."},{"kind":"bullet","text":"Retour, korting of correctie onjuist geregistreerd."},{"kind":"bullet","text":"Contante kasuitgave niet goed verwerkt."},{"kind":"bullet","text":"Tel- of invoerfout tijdens de kascontrole."},{"kind":"text","text":"De juiste reactie is niet meteen iemand aanwijzen, maar systematisch controleren: welke transactie wijkt af, is de betaalwijze correct, kloppen de bonnen en wie moet volgens de procedure worden ingeschakeld?"}]},{"title":"Gegevens gebruiken om het bedrijf te verbeteren","blocks":[{"kind":"text","text":"Kassarapporten kunnen helpen bij bestellingen, personeelsplanning en het beoordelen van het assortiment. Daarmee sluit deze les aan op week 5: menu-engineering gebruikt onder andere verkoopcijfers. Kassabeheer gaat dus niet alleen over contant geld, maar ook over betrouwbare informatie."},{"kind":"heading","text":"Denkvraag"},{"kind":"text","text":"Een product wordt de hele week nauwelijks verkocht, maar er worden toch veel grondstoffen voor besteld. Welke informatie uit het kassasysteem kan helpen bij een beter bestelbesluit?"}]},{"title":"Verwerking en korte kennischeck","blocks":[{"kind":"bullet","text":"Noem drie gegevens die een kassasysteem kan leveren."},{"kind":"bullet","text":"Leg uit waarom het belangrijk is pinbetalingen apart te controleren."},{"kind":"bullet","text":"Verwacht kasgeld: € 320,00. Werkelijk geteld: € 326,50. Is er een tekort of overschot, en hoeveel?"},{"kind":"bullet","text":"Noem twee maatregelen waarmee een bedrijf het risico op kasverschillen verkleint."}]},{"title":"Kassabeheer op jouw leerbedrijf","blocks":[{"kind":"text","text":"Onderzoek hoe kassabeheer op jouw leerbedrijf werkt. Vraag je praktijkbegeleider om uitleg als je iets niet weet. Welk kassasysteem gebruikt je leerbedrijf? Hoe worden contante en digitale betalingen geregistreerd? Wie controleert de kas? Wat gebeurt er bij een kasverschil? Welke afspraken helpen fouten voorkomen? Gebruik zo nodig je eerdere praktijk- of theorieopdrachten. Deel geen vertrouwelijke bedrijfsgegevens."}]}],"source":"Theoriebuffer_Week_06_Kassabeheer_v1.docx"}};
const LEARNING_ACTIVITIES={"2":[{"title":"Kosten herkennen","prompt":"De maandelijkse huur van het bedrijfspand is in deze casus:","options":["Vaste en indirecte kosten","Variabele en directe kosten","Vaste en directe kosten"],"correct":0,"why":"Huur verandert hier niet mee met het aantal verkochte porties en is niet direct aan één portie toe te rekenen."},{"title":"Van omzet naar resultaat","prompt":"Omzet € 5.000, inkoopprijs verkopen € 2.000. Wat is de brutowinst?","options":["€ 7.000","€ 3.000","€ 2.000"],"correct":1,"why":"Brutowinst = omzet − inkoopprijs verkopen = € 3.000. Overige kosten komen pas daarna."}],"3":[{"title":"Gewichten lezen","prompt":"Je koopt 5 kg kip, waarvan 360 gram verloren gaat. Hoeveel kilogram blijft bruikbaar?","options":["4,640 kg","4,360 kg","4,950 kg"],"correct":0,"why":"360 gram is 0,360 kg; 5 − 0,360 = 4,640 kg."},{"title":"Welke prijs vergelijken?","prompt":"Welke prijs is juist bij het vergelijken van grondstoffen met bewerkingsverlies?","options":["Prijs per ingekochte kilogram","Gecorrigeerde prijs per bruikbare kilogram","De laagste kassaprijs"],"correct":1,"why":"De bruikbare hoeveelheid verschilt door het verlies. Vergelijk daarom de gecorrigeerde prijs per kg bruikbaar product."}],"4":[{"title":"Condimenten toepassen","prompt":"Ingrediëntkosten zijn € 20 en de afgesproken condimententoeslag is 5%. Hoe groot is de toeslag?","options":["€ 1,00","€ 5,00","€ 4,00"],"correct":0,"why":"€ 20 × 0,05 = € 1,00. De condimententoeslag is iets anders dan de kostenopslag."},{"title":"Kostprijs vaststellen","prompt":"Een gerecht kost € 12 aan inkoop en krijgt 40% kostenopslag. Wat is de kostprijs?","options":["€ 12,40","€ 16,80","€ 28,80"],"correct":1,"why":"40% van € 12 is € 4,80. Kostprijs = € 12 + € 4,80 = € 16,80."}],"5":[{"title":"De vier categorieën","prompt":"Een gerecht heeft een hoge afzet en lage brutowinstbijdrage. Wat is het?","options":["Slaper","Winnaar","Hardloper"],"correct":2,"why":"Een hardloper verkoopt goed maar levert relatief weinig brutowinst op volgens de gehanteerde indeling."},{"title":"Adviseren met gegevens","prompt":"Een gerecht heeft weinig afzet en een hoge brutowinst per verkoop. Welke eerste actie past het beste?","options":["Onderzoeken hoe de verkoop te stimuleren","Onmiddellijk van de kaart halen","Zonder onderzoek de prijs verlagen"],"correct":0,"why":"Bij een slaper onderzoek je de zichtbaarheid en oorzaken van lage afzet voordat je een besluit neemt."}],"6":[{"title":"Kas opmaken","prompt":"Beginwisselgeld € 100, contant ontvangen € 385 en kasuitgave € 25. Wat verwacht je te tellen?","options":["€ 510","€ 460","€ 485"],"correct":1,"why":"€ 100 + € 385 − € 25 = € 460."},{"title":"Kasverschil beoordelen","prompt":"Je verwacht € 460 en telt € 455. Wat doe je?","options":["€ 5 tekort vastleggen en transacties controleren","Het tekort stilzwijgend aanvullen","De telling negeren"],"correct":0,"why":"Een tekort moet worden vastgelegd en systematisch onderzocht, niet verborgen."}]};
const LEARNING_CHECKS={"2":[["Een bedrijf heeft € 5.000 omzet, € 2.000 inkoopprijs verkopen en € 2.600 overige kosten. Bereken de brutowinst en het bedrijfsresultaat.","Brutowinst: € 5.000 − € 2.000 = € 3.000. Bedrijfsresultaat: € 3.000 − € 2.600 = € 400."],["Leg het verschil uit tussen vaste/variabele kosten en directe/indirecte kosten.","Vast/variabel beschrijft of kosten met de afzet meebewegen; direct/indirect beschrijft of kosten aan een product zijn toe te rekenen."],["Waarom is omzet niet hetzelfde als winst?","Van de omzet moeten de inkoopprijs verkopen en overige bedrijfskosten nog worden afgetrokken."]],"3":[["Je koopt 8 kg aardappelen en houdt 6,8 kg bruikbaar over. Bereken verliespercentage en rendement.","Verlies 1,2 kg; 1,2 ÷ 8 × 100% = 15%. Rendement = 85%."],["Je betaalt € 18 voor 6 kg product en houdt 4,5 kg over. Wat is de gecorrigeerde inkoopprijs?","€ 18 ÷ 4,5 kg = € 4,00 per kg bruikbaar product."],["Waarom vergelijk je inkoopvormen per kilogram bruikbaar product?","Omdat je alleen zo het bewerkingsverlies eerlijk meerekent en dezelfde bruikbare hoeveelheid vergelijkt."]],"4":[["Leg uit waarom je soms de gecorrigeerde inkoopprijs gebruikt in een receptcalculatie.","Omdat er verlies kan ontstaan bij de voorbewerking, waardoor de prijs per bruikbare kilogram hoger wordt."],["Een gerecht heeft € 8,50 inkoopprijs en 55% kostenopslag. Bereken de kostprijs.","Opslag: 8,50 × 0,55 = € 4,675; kostprijs € 13,175, afgerond € 13,18."],["Wat is het verschil tussen de toeslag voor condimenten en de kostenopslag?","Condimenten zijn kleine ingrediënten/toevoegingen; de kostenopslag dekt overige bedrijfskosten."]],"5":[["Wat zijn de twee criteria waarmee menu-engineeringproducten worden ingedeeld?","Afzet en brutowinst(bijdrage volgens de afgesproken methode/grenswaarden)."],["Een product verkoopt weinig maar heeft een hoge brutowinst. In welke categorie valt het?","Slaper: lage afzet, hoge brutowinst."],["Waarom is één hoog brutowinstpercentage niet voldoende voor een assortimentadvies?","Ook de afzet, totale bijdrage en context/bedrijfsdoelstellingen zijn van belang."]],"6":[["Beginwisselgeld € 100, contant ontvangen € 385 en contant uitgegeven € 25. Wat is het verwachte kasgeld?","€ 100 + € 385 − € 25 = € 460."],["Je telt € 455 terwijl je € 460 verwacht. Wat constateer je?","Kastekort van € 5. Controleer registraties en geldstromen."],["Noem drie manieren om kasverschillen te voorkomen.","Bijvoorbeeld vaste telprocedure, betalingen per betaalwijze controleren en retouren/correcties registreren."]]};
function moduleScreen(){if(mod===1){moduleOneRestored();return}const l=LEARNING[mod];$('app').innerHTML=heading(`Module ${String(mod).padStart(2,'0')} · Financieel in de foodpraktijk`,TITLES[mod-1])+`<p class="muted">Leer de financiële vaardigheden stap voor stap of begin meteen met examengericht oefenen.</p><section class="panel route-panel"><h2>Kies zelf je route</h2><p><b>Level 3 is examengericht.</b> Levels 1 en 2 bieden extra ondersteuning, maar zijn niet verplicht.</p><div class="row route-actions"><button class="btn primary" id="goLearn">Leren en weekcheck ↓</button><button class="btn level-control l1" data-level="1">Level 1 · Basis</button><button class="btn level-control l2" data-level="2">Level 2 · Toepassen</button><button class="btn level-control l3" data-level="3">★ Level 3 · Examengericht</button><button class="btn" id="toPrint">Print oefenopdrachten</button></div><div class="digital-exam-notice"><div class="digital-exam-title">▣ Het examen maak je op de computer</div><p>Oefen ook digitaal: zet je belangrijke berekeningen, tussenstappen en antwoorden volledig in de digitale invulvelden. Oefenen op kladpapier helpt, maar vergeet niets over te nemen.</p></div></section><h2 class="route-subtitle">Leren, oefenen en weekcheck</h2><p class="muted">Je kunt de uitleg rustig doorlopen. De oefenlevels blijven direct bereikbaar.</p><div class="panel"><h2>Na deze module kun je…</h2><div class="goal-list">${l.goals.map(g=>`<div class="goal"><span aria-hidden="true">✓</span>${esc(g)}</div>`).join('')}</div></div>${l.sections.map((sec,i)=>lessonSection(sec,i)).join('')}<div class="panel"><h2>Voorbeelden stap voor stap</h2><p>Bekijk eerst het basisvoorbeeld en daarna de verdiepingsopgave. Schrijf de tussenstappen op en controleer de eenheden.</p>${DATA.voorbeelden.filter(x=>x.module===mod).map((x,i)=>`<div class="worked-example"><span class="tag">${i===0?'Voorbeeld 1 · Basis':'Voorbeeld 2 · Verdieping'}</span><h3>${esc(x.titel)}</h3><p>${esc(x.vraag)}</p>${x.stappen.map((s,j)=>`<div class="step"><b>Stap ${j+1}.</b> ${esc(s)}</div>`).join('')}<div class="notice success"><b>Antwoord:</b> ${esc(x.antwoord)}</div></div>`).join('')}</div><div class="panel"><h2>Interactief leren</h2><p class="muted">Controleer of je het belangrijkste begrijpt. Je ziet de uitleg nadat je een keuze maakt.</p>${LEARNING_ACTIVITIES[mod].map((a,i)=>`<section class="activity"><h3>${esc(a.title)}</h3><p>${esc(a.prompt)}</p><div class="activity-choices">${a.options.map((o,j)=>`<button class="btn" data-activity="${i}" data-answer="${j}">${esc(o)}</button>`).join('')}</div><div class="activity-feedback" id="activity-${i}" aria-live="polite"></div></section>`).join('')}</div><div class="panel"><h2>Zelf oefenen · kies je level</h2><p>Level 3 sluit aan bij zelfstandig examengericht werken. Je kunt op ieder level beginnen.</p><div class="row route-actions">${[1,2,3].map(n=>`<button class="btn level-control l${n}" data-level="${n}">Level ${n} · ${n===1?'Basis':n===2?'Toepassen':'Examengericht'}</button>`).join('')}<button class="btn" id="printBottom">Print oefenen</button></div></div><div class="panel weekcheck"><h2>Weekcheck zonder hulp</h2><p>Maak de vragen eerst zelfstandig. De uitwerkingen verschijnen pas nadat je de weekcheck hebt ingeleverd.</p>${LEARNING_CHECKS[mod].map((a,i)=>`<div class="check-question"><b>Vraag ${i+1}</b><p>${esc(a[0])}</p><textarea rows="3" data-week-answer="${i}" placeholder="Schrijf je berekening en antwoord…">${esc(weekDraft(mod,i))}</textarea></div>`).join('')}<div class="row"><button class="btn primary" id="checkReveal">Weekcheck nakijken</button><button class="btn" id="checkReset">Weekcheck opnieuw</button></div><div id="checkAnswers" aria-live="polite"></div></div>`;document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>startPractice(+b.dataset.level));$('goLearn').onclick=()=>document.querySelector('.goal-list').scrollIntoView({behavior:'smooth'});for(const id of ['toPrint','printBottom'])$(id).onclick=()=>{printLevel='all';navigate('print')};document.querySelectorAll('[data-activity]').forEach(b=>b.onclick=()=>{let a=LEARNING_ACTIVITIES[mod][+b.dataset.activity];let ok=+b.dataset.answer===a.correct;let d=$('activity-'+b.dataset.activity);d.className='activity-feedback notice '+(ok?'success':'');d.innerHTML=`<b>${ok?'Goed gekozen.':'Nog niet juist.'}</b><p>${esc(a.why)}</p>`});document.querySelectorAll('[data-week-answer]').forEach(el=>el.oninput=()=>{let drafts=JSON.parse(localStorage.getItem('financial-weekchecks-v08')||'{}');drafts[`m${mod}-${el.dataset.weekAnswer}`]=el.value;localStorage.setItem('financial-weekchecks-v08',JSON.stringify(drafts))});$('checkReveal').onclick=()=>{$('checkAnswers').innerHTML=`<div class="notice"><h3>Antwoordmodel weekcheck · controleer jezelf</h3>${LEARNING_CHECKS[mod].map((a,i)=>`<p><b>Vraag ${i+1}:</b> ${esc(a[1])}</p>`).join('')}<p>Open antwoorden beoordeel je zelf aan de hand van de uitwerking.</p></div>`};$('checkReset').onclick=()=>{if(!confirm('Alleen deze weekcheck opnieuw beginnen?'))return;let ds=JSON.parse(localStorage.getItem('financial-weekchecks-v08')||'{}');LEARNING_CHECKS[mod].forEach((_,i)=>delete ds[`m${mod}-${i}`]);localStorage.setItem('financial-weekchecks-v08',JSON.stringify(ds));moduleScreen()}}
function weekDraft(m,i){try{return JSON.parse(localStorage.getItem('financial-weekchecks-v08')||'{}')[`m${m}-${i}`]||''}catch{return ''}}
function lessonSection(sec,i){const blocks=sec.blocks.map(b=>{if(b.kind==='heading')return b.text.startsWith('Extra oefenen:')?`<h3 class="extra-subhead">${esc(b.text)}</h3>`:`<h3>${esc(b.text)}</h3>`;if(b.kind==='bullet')return `<p class="lesson-bullet"><span aria-hidden="true">•</span>${esc(b.text)}</p>`;if(b.kind==='table'){let rr=b.rows;return `<div class="tablewrap"><table class="learning-table"><thead><tr>${rr[0].map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rr.slice(1).map(row=>`<tr>${row.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}return `<p class="lesson-paragraph">${esc(b.text)}</p>`}).join('');return `<section class="panel lesson-section"><div class="lesson-index">LEERONDERDEEL ${i+1}</div><h2>${esc(sec.title)}</h2>${mod===4&&i===0?priceGuide():''}${mod===3&&i===2?chickenCase():''}${blocks}${mod===3&&i===2?extraMath():''}${mod===3&&i===3?'<div class="soft"><b>We gaan verder met de kipcasus</b><p>In het vorige onderdeel hield je 4,640 kg bruikbare kip over. Nu bereken je de prijs per bruikbare kilogram.</p></div>':''}${practiceSolutions(mod,i)}${drillButtons(mod,i+1)}</section>`}
function startPractice(n){level=n;qpos=0;const key=`m${mod}l${level}`;attempt=saved[key]&&!saved[key].done?saved[key]:{answers:{},done:false,started:Date.now()};saved[key]=attempt;persist();navigate('practice')}

function isBalanceForm(q){return /^M1-L3-\d+-balans$/.test(q.id)}
function balanceFacts(q){const m=q.vraag.match(/heeft:\s*(.*?)\.\s*Stel de balans/i);if(!m)return [];let body=m[1].replace(/\s+en\s+nog te betalen/ig,'. nog te betalen');return body.split(/\.\s+/).map(x=>x.trim()).filter(Boolean).map(x=>{let k=x.match(/^(.*?)\s+(€\s*[\d.,]+)/);return k?{name:k[1].replace(/^en\s+/i,'').trim(),amount:k[2].trim()}:null}).filter(Boolean)}
function displayQuestion(q){let facts=isBalanceForm(q)?balanceFacts(q):[];let txt=q.vraag||'';let context=q.context||'';if(facts.length){const a=txt.split(/\.\s*Stel de balans/i);context='Een foodbedrijf heeft de volgende financiële gegevens.';txt='Stel de balans op en bereken het eigen vermogen. Leg kort uit waarom debet en credit gelijk zijn.'}
const raw=txt.replace(/\s+([A-C])\.\s+/g,'\n$1. ');const matches=[...raw.matchAll(/(?:^|\n)([A-C])\.\s*([^\n]+)/g)];let taskHTML='';if(matches.length){taskHTML=`<ol class="q-tasks" type="A">${matches.map(x=>`<li>${esc(x[2])}</li>`).join('')}</ol>`}else if(facts.length){taskHTML='<ol type="A" class="q-tasks"><li>Plaats de bezittingen en schulden bij de juiste balanszijde.</li><li>Bereken het eigen vermogen en vul dit in.</li><li>Controleer of beide totalen gelijk zijn en leg uit waarom.</li></ol>'}else{taskHTML=`<p class="q-prose">${esc(raw)}</p>`}
return `<section class="q-section">${context?`<h3 class="q-section-title">Situatie</h3><p class="q-prose">${esc(context)}</p>`:''}${facts.length?`<h3 class="q-section-title">Gegevens</h3><table class="q-datalist"><thead><tr><th>Balanspost</th><th>Bedrag</th></tr></thead><tbody>${facts.map(f=>`<tr><td>${esc(f.name[0].toUpperCase()+f.name.slice(1))}</td><td>${esc(f.amount)}</td></tr>`).join('')}</tbody></table>`:''}<h3 class="q-section-title">Opdracht</h3>${taskHTML}</section>`}
function balanceWorkspace(q,stored='',editable=true){let v;try{v=JSON.parse(stored||'{}')}catch(e){v={}};if(!v||typeof v!=='object'||!v.debet)v={debet:[],credit:[],totals:['',''],why:stored||''};const part=(side,i)=>`<div class="balance-side"><h4>${i===0?'DEBET – Bezittingen':'CREDIT – Eigen vermogen en schulden'}</h4><div class="balance-rows">${Array.from({length:5},(_,j)=>`<div class="balance-entry"><input aria-label="${side} post ${j+1}" data-side="${side}" data-index="${j}" data-field="post" value="${esc((v[side]?.[j]||{}).post||'')}" placeholder="Post" ${editable?'':'disabled'}><input aria-label="${side} bedrag ${j+1}" data-side="${side}" data-index="${j}" data-field="amount" inputmode="decimal" value="${esc((v[side]?.[j]||{}).amount||'')}" placeholder="€ 0,00" ${editable?'':'disabled'}></div>`).join('')}</div><div class="balance-total"><span>Totaal ${side}</span><input data-total="${i}" aria-label="Totaal ${side}" value="${esc(v.totals?.[i]||'')}" placeholder="€ 0,00" ${editable?'':'disabled'}></div></div>`;
return `<section class="q-workspace"><h3 class="q-section-title">Jouw balans – vul de lege vakken in</h3><div class="balance-grid">${part('debet',0)}${part('credit',1)}</div><div class="balance-why"><label for="balanceWhy">C. Uitleg: waarom moeten de totalen gelijk zijn?</label><textarea id="balanceWhy" ${editable?'':'disabled'} placeholder="Schrijf je onderbouwing…">${esc(v.why||'')}</textarea></div></section>`}
function harvestAnswer(q,original){if(!isBalanceForm(q))return original;const payload={debet:[],credit:[],totals:['',''],why:document.getElementById('balanceWhy')?.value||''};document.querySelectorAll('[data-side]').forEach(el=>{let a=payload[el.dataset.side],i=+el.dataset.index;if(!a[i])a[i]={post:'',amount:''};a[i][el.dataset.field]=el.value});document.querySelectorAll('[data-total]').forEach(el=>payload.totals[+el.dataset.total]=el.value);return JSON.stringify(payload)}
function readableAnswer(q,v){if(!isBalanceForm(q))return esc(v||'Geen antwoord');try{let p=JSON.parse(v);return `<div class="q-review"><b>Debet:</b> ${(p.debet||[]).filter(x=>x.post||x.amount).map(x=>esc(x.post)+' '+esc(x.amount)).join(' · ')||'Niet ingevuld'}<p><b>Credit:</b> ${(p.credit||[]).filter(x=>x.post||x.amount).map(x=>esc(x.post)+' '+esc(x.amount)).join(' · ')||'Niet ingevuld'}</p><p><b>Totalen:</b> ${esc((p.totals||[]).join(' / '))}</p><p><b>Uitleg:</b> ${esc(p.why||'Geen uitleg')}</p></div>`}catch(e){return esc(v||'Geen antwoord')}}
function modelForBalance(q){const facts=balanceFacts(q);const has=(name)=>facts.find(x=>x.name.toLowerCase().includes(name))?.amount||'';const a=[['Inventaris',has('inventaris')],['Voorraad',has('voorraad')],['Banktegoed',has('banktegoed')]],b=[['Banklening',has('banklening')],['Leveranciers',has('leveranciers')]];const own=(q.antwoord.match(/eigen vermogen\s*(€\s*[\d.,]+)/i)||[])[1]||'';b.push(['Eigen vermogen',own]);const sum=(q.antwoord.match(/Debet\s*(€\s*[\d.,]+)/i)||[])[1]||'';return `<div class="balance-grid model-grid">${[['DEBET – Bezittingen',a],['CREDIT – Eigen vermogen en schulden',b]].map(([title,rows])=>`<div class="balance-side"><h4>${title}</h4><table class="q-datalist"><tbody>${rows.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join('')}<tr><th>Totaal</th><th>${esc(sum)}</th></tr></tbody></table></div>`).join('')}</div>`}
function printWorkspace(q,isAnswer){if(!isBalanceForm(q))return !isAnswer?'<div class="printline"></div><div class="printline"></div><div class="printline"></div><div class="printline"></div>':'';
 const facts=balanceFacts(q);const has=(name)=>facts.find(x=>x.name.toLowerCase().includes(name))?.amount||'';
 const own=(q.antwoord.match(/eigen vermogen\s*(€\s*[\d.,]+)/i)||[])[1]||'';
 const amountValue=s=>Number(String(s).replace(/[^\d,.-]/g,'').replace(/\./g,'').replace(',','.'))||0;
 const deb=[['Inventaris',has('inventaris')],['Voorraad',has('voorraad')],['Banktegoed',has('banktegoed')]];
 const cred=[['Banklening',has('banklening')],['Leveranciers',has('leveranciers')],['Eigen vermogen',own]];
 const total=deb.reduce((a,b)=>a+amountValue(b[1]),0);
 const euro=n=>'€ '+new Intl.NumberFormat('nl-NL',{minimumFractionDigits:0,maximumFractionDigits:2}).format(n);
 const cells=(side,i)=>isAnswer&&side[i]?`<td>${esc(side[i][0])}</td><td>${esc(side[i][1])}</td>`:'<td>&nbsp;</td><td>&nbsp;</td>';
 let rows=Array.from({length:5},(_,i)=>`<tr>${cells(deb,i)}${cells(cred,i)}</tr>`).join('');
 return `<table class="printed-balance"><colgroup><col style="width:34%"><col style="width:16%"><col style="width:34%"><col style="width:16%"></colgroup><thead><tr><th colspan="2">DEBET – Bezittingen</th><th colspan="2">CREDIT – Financiering</th></tr></thead><tbody>${rows}<tr class="printed-balance-total"><th>Totaal debet</th><th>${isAnswer?euro(total):'&nbsp;'}</th><th>Totaal credit</th><th>${isAnswer?euro(total):'&nbsp;'}</th></tr></tbody></table>${isAnswer?'':`<p class="print-explanation"><b>Toelichting:</b></p><div class="printline"></div><div class="printline"></div><div class="printline"></div>`}`
}

function qHtml(q,i,stored,readonly=false){let options=q.opties;return `<div class="eyebrow">${esc(q.onderwerp||'Oefening')} · ${q.punten?esc(q.punten)+' punten · ':''}Vraag ${i+1}</div>${displayQuestion(q)}${options?.length?`<h3 class="q-section-title">Kies je antwoord</h3>`+options.map((o,j)=>`<button class="choice ${stored===o?'chosen':''}" data-option="${esc(o)}" ${readonly?'disabled':''}>${esc(o)}</button>`).join(''):isBalanceForm(q)?balanceWorkspace(q,stored,!readonly):`<h3 class="q-section-title">Jouw uitwerking</h3><textarea id="freeAnswer" class="answer" ${readonly?'disabled':''} placeholder="Schrijf je antwoord en eventuele tussenberekeningen op…">${esc(stored||'')}</textarea>`}`}
function practice(){let arr=questions(mod,level);if(!arr.length){navigate('module');return}if(qpos>=arr.length)qpos=arr.length-1;let q=arr[qpos],v=attempt.answers[q.id];$('app').innerHTML=heading(`Module ${mod} · level ${level}`,level===3?'Examengericht oefenen':level===2?'Toepassen':'Basis oefenen')+`<div class="practice-toolbar"><p class="muted">Vraag ${qpos+1} van ${arr.length} · ${level===3?'Zelfstandig oefenen zonder hints.':'Gebruik zo nodig de uitleg en voorbeelden.'}</p><button class="btn btn-reset-level" id="resetCurrentLevel">↻ Level opnieuw beginnen</button></div>${level===3?'<div class="exam-brief">Examentip: werk gerust op kladpapier, maar neem je berekeningen en belangrijke tussenstappen ook volledig over in de digitale invulvelden.</div>':''}<div class="progress"><i class="${'bar-level-'+level}" style="width:${100*(qpos+1)/arr.length}%"></i></div><div class="panel question-card ${'question-level-'+level}">${qHtml(q,qpos,v)}${level<3?`<div id="instant"></div><button class="btn" id="hint">Bekijk uitleg na beantwoorden</button>`:''}<div class="sticky-actions"><button class="btn" id="prev" ${qpos===0?'disabled':''}>← Vorige</button><button class="btn primary ${'level-control l'+level}" id="next">${qpos===arr.length-1?'Afronden en nakijken':'Volgende →'}</button></div></div><button class="btn" id="back">Terug naar module</button>`;let draft=v||'';document.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{draft=b.dataset.option;document.querySelectorAll('[data-option]').forEach(c=>c.classList.toggle('chosen',b===c))});let area=$('freeAnswer');if(area)area.oninput=e=>draft=e.target.value;const store=()=>{attempt.answers[q.id]=harvestAnswer(q,draft);persist()};$('prev').onclick=()=>{store();qpos--;practice()};$('next').onclick=()=>{store();if(qpos===arr.length-1){attempt.done=true;persist();navigate('results')}else{qpos++;practice()}};$('back').onclick=()=>{store();navigate('module')};$('resetCurrentLevel').onclick=()=>{if(confirm(`Level ${level} opnieuw beginnen? Alleen de antwoorden van dit level worden gewist.`)){delete saved[`m${mod}l${level}`];persist();startPractice(level)}};if($('hint'))$('hint').onclick=()=>{store();$('instant').innerHTML=`<div class="notice"><b>Voorbeelduitwerking</b>${(q.uitwerking||[]).map(s=>`<p>${esc(s)}</p>`).join('')}<b>Antwoord: ${esc(q.antwoord)}</b></div>`}}

function results(){let arr=questions(mod,level), key=`m${mod}l${level}`;attempt=saved[key]||attempt;let objective=arr.filter(q=>q.opties?.length);let ok=objective.filter(q=>String(attempt.answers[q.id]||'').trim().toLowerCase()===String(q.antwoord).trim().toLowerCase()).length;$('app').innerHTML=heading(`Module ${mod} · level ${level}`,'Jouw antwoorden en uitleg')+`<div class="notice"><b>${ok} van ${objective.length} automatisch controleerbare keuzevragen goed.</b><p>Open antwoorden en berekeningen controleer je zelf met het modelantwoord. Deze worden niet automatisch als goed of fout beoordeeld.</p>${level===3?'<p>Bij onzekerheid: herhaal gericht level 1 of 2. Dit is geen officieel examencijfer.</p>':''}</div>${arr.map((q,i)=>`<div class="panel"><span class="eyebrow">Vraag ${i+1} · ${esc(q.onderwerp)}</span>${displayQuestion(q)}<div class="soft"><b>Jouw antwoord</b>${readableAnswer(q,attempt.answers[q.id])}</div><b>Modelantwoord</b>${isBalanceForm(q)?modelForBalance(q):""}<p>${esc(q.antwoord)}</p>${(q.uitwerking||[]).map(s=>`<div class="step">${esc(s)}</div>`).join('')}${q.beoordeling?.length?`<p class="small"><b>Beoordeling:</b> ${q.beoordeling.map(x=>esc(x.criterium)).join(' · ')}</p>`:''}</div>`).join('')}<div class="row"><button class="btn" id="again">Opnieuw oefenen (reset level)</button><button class="btn" id="goBack">Terug naar module</button><button class="btn primary" id="toPrint">Print opdrachten</button></div>`;$('again').onclick=()=>{delete saved[key];persist();startPractice(level)};$('goBack').onclick=()=>navigate('module');$('toPrint').onclick=()=>{printLevel=String(level);navigate('print')}}
function printing(){let sel=printLevel==='all'?DATA.opgaven.filter(q=>q.module===mod):questions(mod,+printLevel);$('app').innerHTML=heading(`Module ${mod}`,'Printbare oefenopdrachten')+`<p>Stel een oefenblad samen. Opdrachten en antwoordmodel worden apart afgedrukt. Je kunt via de printdialoog ook opslaan als PDF.</p><div class="panel"><div class="row"><label>Level <select id="printLevel"><option value="all" ${printLevel==='all'?'selected':''}>Alle levels</option>${[1,2,3].map(n=>`<option value="${n}" ${printLevel==n?'selected':''}>Level ${n}</option>`).join('')}</select></label><label>Aantal <select id="printCount">${[5,10,15,20].map(n=>`<option value="${n}" ${printCount===n?'selected':''}>${n}</option>`).join('')}</select></label></div><div class="row" style="margin-top:16px"><button class="btn primary" id="printQuestions">Print opgaven</button><button class="btn" id="printModel">Print antwoordmodel</button><button class="btn" id="backModule">Terug naar module</button></div></div><p class="muted small">Er is ruimte om berekeningen op te schrijven. Printen opent een apart venster; alleen na klikken worden de antwoorden afgedrukt.</p>`;$('printLevel').onchange=e=>{printLevel=e.target.value;printing()};$('printCount').onchange=e=>{printCount=+e.target.value;printing()};$('backModule').onclick=()=>navigate('module');$('printQuestions').onclick=()=>printDoc(false);$('printModel').onclick=()=>printDoc(true)}
function printDoc(isAnswer){let arr=(printLevel==='all'?DATA.opgaven.filter(x=>x.module===mod):questions(mod,+printLevel)).slice(0,printCount);let body=arr.map((q,i)=>`<section class="printitem"><h2>Opdracht ${i+1} ${q.punten?`(${q.punten} punten)`:''}</h2>${displayQuestion(q)}${isAnswer?`${printWorkspace(q,true)}<div class="model-answer"><h3>Antwoord en uitwerking</h3><p><b>${esc(q.antwoord)}</b></p>${(q.uitwerking||[]).map(s=>`<p>${esc(s)}</p>`).join('')}${(q.beoordeling||[]).map(x=>`<p>${esc(x.criterium)}</p>`).join('')}</div>`:q.opties?.length?q.opties.map(o=>`<p class="choiceprint">☐ ${esc(o)}</p>`).join(''):printWorkspace(q,false)}</section>`).join('');let w=window.open('','_blank');if(!w){alert('Sta pop-upvensters toe om af te drukken.');return}w.document.write(`<!doctype html><html lang="nl"><head><meta charset="utf-8"><title>${isAnswer?'Antwoordmodel':'Opgaven'} – Module ${mod}</title><style>@page{size:A4;margin:10mm 12mm}*{box-sizing:border-box}body{font:9pt/1.32 Arial,sans-serif;margin:0;color:#172735}h1{font-size:15pt;line-height:1.15;margin:0 0 3px}body>p{font-size:8pt;margin:0 0 5mm;color:#526474}h2{font-size:11.5pt;line-height:1.2;margin:0 0 3mm}.printitem{break-before:page;page-break-before:always;break-after:page;page-break-after:always;break-inside:avoid-page;page-break-inside:avoid;margin:0;padding:0}.printitem:first-of-type{break-before:auto;page-break-before:auto}.printitem:last-child{break-after:auto;page-break-after:auto}.printline{border-bottom:1px solid #999;height:7mm}.q-section{margin:7px 0}.q-section-title{font-weight:700;font-size:8.2pt;letter-spacing:.04em;text-transform:uppercase;margin:5px 0 2px}.q-prose{margin:0 0 4px}.q-datalist{width:100%;border-collapse:collapse}.q-datalist td,.q-datalist th{border:1px solid #aebcc6;padding:4px 5px;text-align:left}.q-datalist td:last-child{text-align:right}.q-tasks{padding-left:18px;margin:4px 0 7px}.q-tasks li{margin:2px 0}.balance-grid{display:grid;grid-template-columns:1fr 1fr;border:1px solid #9caab6;margin:7px 0}.balance-side+ .balance-side{border-left:1px solid #9caab6}.balance-side h4{margin:0;padding:5px;font-size:8.2pt;background:#f0f2f4}.balance-side .q-datalist{margin:0}.printed-balance{width:100%;border-collapse:collapse;table-layout:fixed;margin:7px 0;page-break-inside:avoid}.printed-balance th,.printed-balance td{border:1px solid #9caab6;padding:4px 6px;height:25px;vertical-align:middle;text-align:left}.printed-balance thead th{background:#edf1f3;font-size:8.2pt;line-height:1.18;height:28px}.printed-balance th:nth-child(3),.printed-balance td:nth-child(3){border-left:2px solid #718899}.printed-balance tr>td:nth-child(2),.printed-balance tr>td:nth-child(4),.printed-balance tr>th:nth-child(2),.printed-balance tr>th:nth-child(4){text-align:right}.printed-balance-total th{background:#f3f5f6;font-weight:700}.print-explanation{margin:7px 0 2px}.model-answer{padding-top:4px;font-size:8.3pt;line-height:1.25}.choiceprint{margin:3px 0}</style></head><body><h1>${isAnswer?'Antwoordmodel':'Oefenopdrachten'} – Module ${mod}</h1><p>${esc(TITLES[mod-1])} · ${isAnswer?'docent / zelfcontrole':'naam: ___________________ datum: __________'}</p>${body}</body></html>`);w.document.close();w.focus();setTimeout(()=>w.print(),300)}
function exams(){$('app').innerHTML=heading('Voorbereiding','Oefenexamens Financieel')+`<p>Drie oefenexamens in de stijl van examen 3289, elk 25 punten. Dit zijn geen officiële SVO-examens. Open vragen vergelijk je zelf met beoordelingscriteria.</p><div class="exam-brief">Maak de opgaven digitaal. Werk eventueel op kladpapier, maar vul je berekeningen en tussenstappen ook digitaal in.</div><div class="grid">${DATA.examens.map((e,i)=>`<div class="panel exam-card"><div class="eyebrow">Oefenexamen ${i+1}</div><h2>25 punten</h2><p>6 onderdelen · geen hints tijdens het examen</p><p class="small muted">${saved[`exam${i}`]? 'Eerdere antwoorden staan op deze computer.':'Nog niet gestart.'}</p><button class="btn level-control l3" data-exam="${i}">${saved[`exam${i}`]?'Verder / bekijken':'Start examen'}</button><button class="btn btn-reset-level" data-exam-reset="${i}">↻ Opnieuw beginnen</button></div>`).join('')}</div>`;document.querySelectorAll('[data-exam]').forEach(b=>b.onclick=()=>{examId=+b.dataset.exam;qpos=0;navigate('examrun')});document.querySelectorAll('[data-exam-reset]').forEach(b=>b.onclick=()=>{const i=+b.dataset.examReset;if(confirm(`Oefenexamen ${i+1} opnieuw beginnen? Alleen dit oefenexamen wordt gewist.`)){delete saved[`exam${i}`];persist();examId=i;qpos=0;navigate('examrun')}})}

function examItems(){let ids=DATA.examens[examId].vragen;return ids.map(id=>DATA.opgaven.find(q=>q.id===id)).filter(Boolean)}
function examrun(){let ex=DATA.examens[examId],arr=examItems();if(!arr.length){navigate('exams');return}let q=arr[qpos];let key=`exam${examId}`;let at=saved[key]||{answers:{}};saved[key]=at;$('app').innerHTML=heading(ex.titel,`Vraag ${qpos+1} van ${arr.length}`)+`<p class="muted">${q.punten||0} punten · Antwoorden en modeluitwerkingen verschijnen pas na afronden.</p><div class="panel">${qHtml(q,qpos,at.answers[q.id])}<div class="sticky-actions"><button class="btn" id="eprev" ${qpos===0?'disabled':''}>← Vorige</button><button class="btn primary" id="enext">${qpos===arr.length-1?'Examen afronden':'Volgende →'}</button></div></div>`;let draft=at.answers[q.id]||'';let area=$('freeAnswer');if(area)area.oninput=e=>draft=e.target.value;document.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{draft=b.dataset.option;document.querySelectorAll('[data-option]').forEach(c=>c.classList.toggle('chosen',b===c))});function saveAnswer(){at.answers[q.id]=harvestAnswer(q,draft);persist()}$('eprev').onclick=()=>{saveAnswer();qpos--;examrun()};$('enext').onclick=()=>{saveAnswer();if(qpos===arr.length-1){if(confirm('Examen afronden en antwoordmodel bekijken?'))navigate('examresults')}else{qpos++;examrun()}}}
function examresults(){let arr=examItems(),at=saved[`exam${examId}`]||{answers:{}};$('app').innerHTML=heading(DATA.examens[examId].titel,'Antwoordmodel en zelfbeoordeling')+`<div class="notice">De maximale score is 25 punten. Geef jezelf punten met behulp van de criteria; open antwoorden worden niet automatisch beoordeeld.</div>${arr.map((q,i)=>`<div class="panel"><div class="eyebrow">Vraag ${i+1} · ${q.punten||0} punten</div>${displayQuestion(q)}<div class="soft"><b>Jouw antwoord</b>${readableAnswer(q,at.answers[q.id])}</div><b>Modelantwoord</b>${isBalanceForm(q)?modelForBalance(q):""}<p>${esc(q.antwoord)}</p>${(q.uitwerking||[]).map(s=>`<div class="step">${esc(s)}</div>`).join('')}${(q.beoordeling||[]).map(x=>`<p class="small">${esc(x.punten)} punten: ${esc(x.criterium)}</p>`).join('')}</div>`).join('')}<button class="btn" id="restart">Dit examen opnieuw maken</button> <button class="btn" id="eBack">Terug naar oefenexamens</button>`;$('restart').onclick=()=>{delete saved[`exam${examId}`];persist();qpos=0;navigate('examrun')};$('eBack').onclick=()=>navigate('exams')}
function progress(){$('app').innerHTML=heading('Lokale opslag','Mijn voortgang')+`<p class="muted">Alle voortgang blijft lokaal in deze browser op deze computer. Er wordt niets naar de docent verzonden.</p><div class="panel">${TITLES.map((t,i)=>`<h3>Module ${i+1}: ${esc(t)}</h3><div class="row">${[1,2,3].map(n=>`<span class="tag">Level ${n}: ${saved[`m${i+1}l${n}`]?.done?'Afgerond':saved[`m${i+1}l${n}`]?'Gestart':'Niet gestart'}</span>`).join('')}<button class="btn push" data-reset="${i+1}">Reset module</button></div><div class="separator"></div>`).join('')}</div>`;document.querySelectorAll('[data-reset]').forEach(b=>b.onclick=()=>{if(confirm('Alle voortgang van deze module opnieuw instellen?')){[1,2,3].forEach(n=>delete saved[`m${b.dataset.reset}l${n}`]);persist();progress()}})}

let drillGroup=null,drillPosition=0,drillAnswers={},drillRevealed={};
function drillGroups(m,s){return [...new Set(DRILLS.filter(d=>d.module===m&&d.section===s).map(d=>d.topic))]}
function drillButtons(m,s){let ts=drillGroups(m,s);if(!ts.length)return '';return `<div class="drill-links"><b>Oefen wat je net hebt geleerd</b><p>Maak tien sommen, van eenvoudig naar uitdagender. Je kunt ieder onderwerp apart oefenen.</p>${ts.map(t=>`<button class="btn drill-start" data-drill-mod="${m}" data-drill-sec="${s}" data-drill-topic="${esc(t)}">10 sommen · ${esc(t)} →</button>`).join('')}</div>`}
function startDrill(m,s,t){mod=+m;drillGroup=DRILLS.filter(d=>d.module===+m&&d.section===+s&&d.topic===t);drillPosition=0;drillAnswers={};drillRevealed={};navigate('drill')}
function drillPage(){if(!drillGroup?.length){navigate('module');return}const q=drillGroup[drillPosition],val=drillAnswers[q.id]||'',end=drillPosition===drillGroup.length-1;
$('app').innerHTML=heading(`Module ${mod} · extra oefenen`,q.topic)+`<p class="muted">Som ${drillPosition+1} van ${drillGroup.length} · Eerst zelf rekenen, daarna nakijken.</p><div class="progress"><i style="width:${(drillPosition+1)*10}%"></i></div><div class="panel drill-question"><h2>Som ${drillPosition+1}</h2><p>${esc(q.question)}</p><label for="drillAnswer"><b>Jouw antwoord en berekening</b></label><textarea id="drillAnswer" class="answer" placeholder="Schrijf je berekening en eindantwoord op">${esc(val)}</textarea><div class="row" style="margin-top:12px"><button class="btn" id="revealDrill">${drillRevealed[q.id]?'Verberg uitwerking':'Bekijk uitwerking stap voor stap'}</button><button class="btn" id="drillPrev" ${drillPosition===0?'disabled':''}>← Vorige</button><button class="btn primary" id="drillNext">${end?'Oefenreeks afronden':'Volgende som →'}</button></div><div id="drillExplain">${drillRevealed[q.id]?drillExplain(q):''}</div></div><button class="btn" id="drillBack">Terug naar uitleg</button>`;
$('drillAnswer').oninput=e=>drillAnswers[q.id]=e.target.value;
$('revealDrill').onclick=()=>{drillAnswers[q.id]=$('drillAnswer').value;drillRevealed[q.id]=!drillRevealed[q.id];drillPage()};
$('drillPrev').onclick=()=>{drillAnswers[q.id]=$('drillAnswer').value;drillPosition--;drillPage()};
$('drillNext').onclick=()=>{drillAnswers[q.id]=$('drillAnswer').value;if(end){drillFinish()}else{drillPosition++;drillPage()}};
$('drillBack').onclick=()=>drillReturn()}
function drillReturn(){const section=drillGroup?.[0]?.section||1;navigate('module');if(mod!==1){const blocks=document.querySelectorAll('.lesson-section');blocks[section-1]?.scrollIntoView({block:'start'});}}
function drillExplain(q){return `<div class="soft"><h3>Zo reken je dit uit</h3>${q.steps.map((s,i)=>`<p><b>Stap ${i+1}.</b> ${esc(s)}</p>`).join('')}<div class="notice success"><b>Antwoord: ${esc(q.answer)}</b></div></div>`}
function drillFinish(){let seen=drillGroup.filter(q=>drillAnswers[q.id]?.trim()).length;
$('app').innerHTML=heading('Extra oefenen','Je hebt de tien sommen doorlopen')+`<div class="panel"><p>Je hebt bij ${seen} van de 10 sommen een antwoord ingevuld. Controleer je berekeningen met de uitwerkingen; deze open sommen krijgen geen automatische score.</p><div class="row"><button class="btn primary" id="drillAgain">Oefenreeks opnieuw</button><button class="btn" id="drillReturn">Terug naar module</button></div>${drillGroup.map((q,i)=>`<details><summary>Som ${i+1}: ${esc(q.topic)} – bekijk het antwoord</summary><p><b>Jouw antwoord:</b> ${esc(drillAnswers[q.id]||'Niet ingevuld')}</p>${drillExplain(q)}</details>`).join('')}</div>`;
$('drillAgain').onclick=()=>startDrill(mod,drillGroup[0].section,drillGroup[0].topic);$('drillReturn').onclick=()=>drillReturn()}
document.addEventListener('click',e=>{let b=e.target.closest('[data-drill-topic]');if(b)startDrill(b.dataset.drillMod,b.dataset.drillSec,b.dataset.drillTopic)});
function chickenCase(){return `<div class="case-anchor"><div class="eyebrow">Doorlopende praktijkcasus · kip voor een salade</div><h3>Van ingekochte kip naar bruikbaar product</h3><p>Je bereidt een salade en koopt 5 kg kip voor € 6,90 per kg. Tijdens het schoonmaken verlies je 360 gram. Hoeveel kip kun je gebruiken en wat betaal je per kilogram bruikbare kip? In leeronderdeel 3 en 4 werk je met deze gegevens.</p><div class="row"><span class="tag">Inkoop 5,000 kg</span><span class="tag">Verlies 0,360 kg</span><span class="tag">Prijs € 6,90/kg</span></div></div>`}
function extraMath(){return `<div class="support-math"><div class="eyebrow">Aanvullende rekenstappen · extra inzicht</div><h3>Wil je ook verlies en rendement in procenten berekenen?</h3><p>Dit helpt je het gewicht te controleren. Voor de gecorrigeerde inkoopprijs heb je vooral het bruikbare gewicht nodig.</p><p><b>Verliespercentage:</b> 0,360 ÷ 5,000 × 100% = <b>7,2%</b>.</p><p><b>Rendement:</b> 4,640 ÷ 5,000 × 100% = <b>92,8%</b>.</p><p><b>Controle:</b> 7,2% verlies + 92,8% rendement = 100%.</p></div>`}
function priceGuide(){return `<details class="price-guide"><summary>Hoe wordt de consumentenprijs opgebouwd? <span class="small muted">Toon het volledige prijsschema</span></summary><div class="guide-body"><p>In deze module bereken je eerst de kostprijs. Om tot een verkoopprijs te komen kan een bedrijf een winstbedrag toevoegen. Daarna komt de btw.</p><table class="learning-table"><tbody><tr><th>Ingrediëntenkosten</th><td>€ 7,40</td></tr><tr><td>+ Condimenten 5%</td><td>€ 0,37</td></tr><tr><th>Totale ingrediëntenkosten</th><th>€ 7,77</th></tr><tr><td>+ Kostenopslag 55%</td><td>€ 4,27</td></tr><tr><th>Kostprijs voor 4 porties</th><th>€ 12,04</th></tr><tr><th>Kostprijs per portie</th><th>€ 3,01</th></tr><tr><td>+ Extra bedrag boven de kostprijs (voorbeeld)</td><td>€ 0,99</td></tr><tr><th>Verkoopprijs excl. btw</th><th>€ 4,00</th></tr><tr><td>+ btw bij 21% (voorbeeld)</td><td>€ 0,84</td></tr><tr><th>Consumentenprijs incl. btw</th><th>€ 4,84</th></tr></tbody></table><p><b>100% + 9% btw = 109%. 100% + 21% btw = 121%.</b> Je rekent dus bijvoorbeeld € 4,00 × 1,21 = € 4,84.</p><p class="small muted">De percentages 5% en 55% zijn hier rekenafspraken of gegeven bedragen voor deze oefeningen, geen algemene regels voor ieder bedrijf. Een winstopslag is iets anders dan een winstmarge.</p></div></details>`}
function practiceSolutions(m,i){const examples={
'3-6':[

['Gecorrigeerde inkoopprijs','3,0 × € 2,40 = € 7,20 inkoopkosten. € 7,20 ÷ 2,4 kg = € 3,00 per bruikbare kilogram.'],
['Vergelijken en adviseren','A: 5 × € 2,00 = € 10,00; € 10,00 ÷ 4 = € 2,50/kg. B: 4 × € 2,65 = € 10,60; € 10,60 ÷ 4 = € 2,65/kg. A is € 0,15/kg goedkoper op grondstofkosten, maar arbeidskosten zijn niet meegerekend.']],
'4-6':[

['Integrale calculatie','Condimenten: € 15,00 × 0,05 = € 0,75. Inclusief condimenten: € 15,75. Kostenopslag: € 15,75 × 0,60 = € 9,45. Totale kostprijs: € 25,20. Per portie: € 25,20 ÷ 5 = € 5,04.']]};let arr=examples[`${m}-${i}`];if(!arr)return '';return `<div class="solution-guide"><b>Controleer je zelfstandige opgaven</b><p>Probeer eerst de opdrachten zelf. Open daarna per opdracht de uitwerking.</p>${arr.map((e,j)=>`<details><summary>Opgave ${j+1} – ${esc(e[0])}: stap voor stap uitwerken</summary><p>${esc(e[1])}</p></details>`).join('')}</div>`}

results=function(){previousResults();let row=document.querySelector('#goBack')?.parentElement;if(row){row.insertAdjacentHTML('beforeend',`<button class="btn level-control l${Math.min(level+1,3)}" id="nextLevelRoute">${level<3?'Naar level '+(level+1)+' →':'Naar volledige oefenexamens →'}</button>${level===1?'<button class="btn level-control l3" id="skipLevelRoute">Direct naar level 3 →</button>':''}`);$('nextLevelRoute').onclick=()=>{if(level<3)startPractice(level+1);else navigate('exams')};if($('skipLevelRoute'))$('skipLevelRoute').onclick=()=>startPractice(3)}};
