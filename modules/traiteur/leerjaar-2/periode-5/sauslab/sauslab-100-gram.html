<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sauslab — van recept naar etiket</title><style>
:root{--ink:#142e38;--blue:#006a86;--line:#d3e1e7;--bg:#edf3f7;--gold:#f5c847}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}header{background:var(--ink);color:white;padding:20px max(24px,calc((100vw - 1200px)/2));display:flex;align-items:center;justify-content:space-between;gap:20px}header strong{font-size:26px;letter-spacing:-1px}header span{color:#c9e1e7;font-size:14px}.brand{display:flex;gap:14px;align-items:center}.mark{font-weight:800;background:var(--gold);color:var(--ink);padding:9px;border-radius:50%;font-size:16px}main{max-width:1200px;margin:0 auto;padding:26px 24px 70px}nav{display:flex;gap:8px;margin-bottom:26px;flex-wrap:wrap}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:9px;padding:10px 16px;background:white;color:var(--ink);font-weight:650}button:hover{border-color:var(--blue);background:#effaff}button.primary,nav button.active{background:var(--blue);color:white;border-color:var(--blue)}button:disabled{opacity:.45;cursor:not-allowed}button.small{padding:6px 10px;font-size:14px}h1{font-size:34px;letter-spacing:-1px;line-height:1.15;margin:0 0 12px}h2{font-size:22px;margin:0 0 14px}h3{font-size:17px;margin:0 0 12px}p{margin:8px 0 18px}.muted{color:#506873}.grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px}.card{background:white;border:1px solid var(--line);border-radius:15px;padding:24px;margin-bottom:18px}aside .card{position:sticky;top:20px}label{display:block;font-size:14px;font-weight:650;margin-bottom:16px}input,select,textarea{display:block;width:100%;border:1px solid #9db2bf;border-radius:7px;background:white;padding:10px;margin-top:5px;color:var(--ink);min-width:0}input[type=checkbox]{display:inline;width:auto;margin:0 8px 0 0}textarea{min-height:84px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.pill{border-radius:20px;background:#e9f5f7;color:#065569;padding:5px 10px;font-size:14px;display:inline-block}.notice{padding:14px 16px;border-left:4px solid var(--gold);background:#fff7db;border-radius:6px;margin:16px 0;font-size:14px}.good{background:#e7f5ee;border-color:#27734f}.big{font-size:46px;font-weight:750;letter-spacing:-2px}.meter{height:8px;background:#dce7ec;border-radius:8px;overflow:hidden;margin:10px 0}.meter i{display:block;height:100%;background:var(--blue)}.ingredient{display:grid;grid-template-columns:1fr 105px 75px 42px;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.ingredient input{margin:0}.ingredient small{display:block;color:#526b76}.ingredient button{padding:8px}.empty{padding:28px 0;color:#506873}.nutrition{width:100%;border-collapse:collapse}.nutrition td{padding:8px 0;border-bottom:1px solid var(--line)}.nutrition td:last-child{text-align:right;font-variant-numeric:tabular-nums}.tablewrap{overflow:auto}table.sources{width:100%;border-collapse:collapse}table.sources th,table.sources td{padding:12px;text-align:left;border-bottom:1px solid var(--line)}details{margin:15px 0}summary{cursor:pointer;font-weight:650}a{color:var(--blue)}.footnav{display:flex;justify-content:space-between;margin-top:20px}#printarea{display:none}.label{background:white;color:#111;border:2px solid #111;padding:6mm;width:100mm;font:10pt/1.4 Arial,sans-serif;overflow-wrap:anywhere;max-width:100%}.label h2{font:bold 20pt/1.1 Arial;margin:0 0 3mm}.label p{margin:2mm 0}.label .nutrition td{padding:1.4mm 0;border-color:#ccc}.draft{font-weight:bold;border:2px solid #111;padding:3mm;margin-bottom:4mm}.label .net{font-size:14pt;font-weight:bold}.tag{font-size:12px;color:#805100}.label strong{font-weight:800}.editor{border:2px solid var(--blue)}.stepnum{color:var(--blue);font-size:14px;font-weight:800;letter-spacing:1px;margin-bottom:8px}.screenonly{display:block}@media(max-width:760px){main{padding:20px 14px}.grid,.two{grid-template-columns:1fr}.card{padding:18px}header{padding:16px}header span{display:none}h1{font-size:28px}nav button{flex:1 1 42%;font-size:14px;padding:10px}aside .card{position:static}.ingredient{grid-template-columns:1fr 78px 53px 35px;gap:6px}.ingredient small{font-size:12px}.big{font-size:38px}}@media print{@page{size:A4;margin:12mm}body{background:white}header,main{display:none!important}#printarea{display:block}.label{max-width:none;break-inside:avoid}.report{font:11pt/1.4 Arial}.report table{width:100%;border-collapse:collapse}.report td,.report th{padding:7px;border-bottom:1px solid #bbb;text-align:left}.report h1{font-size:24pt}.report .label{margin-top:20px}}
</style><header><div class="brand"><div class="mark">100g</div><strong>Sauslab</strong></div><span>TRAITEUR · KOUDE SAUZEN</span><button id="teacher" class="small">Ingrediëntgegevens</button></header><main><a href="../../../../../index.html#/traiteur/leerjaar-2/periode-5" style="display:inline-block;margin-bottom:18px">← Terug naar SVO Academy · Traiteur · Periode 5</a><nav aria-label="Stappen"></nav><div id="app"></div></main><div id="printarea"></div><script>
const nutrientNames=['Energie (kJ)','Energie (kcal)','Vetten','Waarvan verzadigde vetzuren','Koolhydraten','Waarvan suikers','Eiwitten','Zout'];
const allergens=['EI','MELK','MOSTERD','VIS','TARWE','GERST','ROGGE','HAVER','SOJA','PINDA','NOTEN','SELDERIJ','SESAM','SULFIET','LUPINE','SCHAALDIEREN','WEEKDIEREN'];
const seed=[
['oil','Neutrale olie',[3700,900,100,10,0,0,0,0],'zonnebloemolie',''],
['egg','Gepasteuriseerde eidooier',[1347,322,26.5,9.6,3.6,.6,15.9,.12],'eidooier (EI)','EI'],
['water','Water',[0,0,0,0,0,0,0,0],'water',''],
['mustard','Mosterd / Dijon',[600,145,8,.5,6,3,6,5],'water, MOSTERDzaad, azijn, zout','MOSTERD'],
['vinegar','Azijn / wijnazijn',[75,18,0,0,.5,.5,0,0],'azijn',''],
['lemon','Citroensap',[100,24,.2,0,2.5,2.5,.4,0],'citroensap',''],
['yogurt','Yoghurt vol',[255,61,3.2,2.1,4,4,3.5,.1],'yoghurt (MELK)','MELK'],
['creme','Crème fraîche',[1220,296,30,20,3,3,2,.08],'crème fraîche (MELK)','MELK'],
['ketchup','Ketchup',[425,100,.1,0,23,20,1,2],'tomaat, azijn, suiker, zout, specerijen',''],
['worc','Worcestersaus',[330,78,0,0,19,10,0,2.5],'azijn, melasse, suiker, zout, ansjovis (VIS), tamarinde, specerijen','VIS'],
['paprika','Paprikapoeder',[1180,282,13,2.1,19,10,14,.17],'paprikapoeder',''],
['cayenne','Cayennepeper',[1330,318,17,3.3,30,10,12,.08],'cayennepeper',''],
['pickle','Augurk uitgelekt',[85,20,.2,0,3,2,1,1.5],'augurk, water, azijn, suiker, zout, specerijen',''],
['capers','Kappertjes uitgelekt',[96,23,.9,.2,1.7,.4,2.4,3],'kappertjes, water, azijn, zout',''],
['parsley','Peterselie',[150,36,.8,.1,3,.9,3,.14],'peterselie',''],
['chives','Bieslook',[126,30,.7,.1,2,1.9,3.3,.01],'bieslook',''],
['tarragon','Dragon vers',[190,45,1,.2,5,1,3,.02],'dragon',''],
['chervil','Kervel vers',[150,36,.6,.1,3,1,3,.02],'kervel',''],
['curry','Kerriepoeder',[1360,325,14,2,25,3,13,.13],'specerijenmengsel',''],
['chutney','Mango chutney',[1000,235,.5,.1,57,55,.5,1.5],'mango, suiker, azijn, zout, specerijen',''],
['honey','Honing',[1370,325,0,0,81,81,.3,.01],'honing',''],
['garlic','Knoflook',[620,149,.5,.1,28,1,6,.04],'knoflook',''],
['shallot','Sjalot',[300,72,.1,0,14,8,2.5,.03],'sjalot',''],
['onion','Ui',[170,40,.1,0,8,4,1.1,.01],'ui',''],
['salt','Zout',[0,0,0,0,0,0,0,100],'zout',''],
['pepper','Zwarte peper',[1050,251,3.3,1.4,39,.6,10,.05],'zwarte peper','']];
let db=Object.fromEntries(seed.map(([id,name,n,decl,al])=>[id,{name,n,decl,al,add:'',source:'Algemene oefenwaarden; vervang door het gebruikte product',verified:false}]));
let base=[{id:'oil',g:75},{id:'egg',g:8},{id:'water',g:8},{id:'vinegar',g:5},{id:'mustard',g:4}];
let state={step:0,recipe:[],name:'',student:'',dish:'',flavour:'',improvement:'',description:'',date:'',dateType:'Te gebruiken tot',storage:'',after:'',owner:'',lot:'',approved:false,question:''};let editing=false;
try{const saved=JSON.parse(localStorage.getItem('sauslab-v1'));if(saved){db=saved.db;base=saved.base;state={...state,...saved.state}}}catch(e){}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(x,d=1)=>Number(x).toLocaleString('nl-NL',{maximumFractionDigits:d});
function num(v){let x=Number(String(v).replace(',','.'));return Number.isFinite(x)&&x>=0?x:0}
function save(){try{localStorage.setItem('sauslab-v1',JSON.stringify({db,base,state}))}catch(e){}}
function ingredient(id){if(id!=='mayo')return db[id];let t=base.reduce((s,r)=>s+r.g,0);let n=Array(8).fill(0);base.forEach(r=>db[r.id].n.forEach((v,i)=>n[i]+=v*r.g/(t||1)));return {name:'Eigen basismayonaise',n,decl:base.filter(r=>r.g>0).sort((a,b)=>b.g-a.g).map(r=>db[r.id].decl).join(', '),al:[...new Set(base.filter(r=>r.g>0).flatMap(r=>db[r.id].al.split(',').map(x=>x.trim()).filter(Boolean)))].join(', '),add:base.filter(r=>r.g>0).map(r=>db[r.id].add).filter(Boolean).join('; '),source:'Berekend uit de basisreceptuur',verified:t>0&&base.filter(r=>r.g>0).every(r=>db[r.id].verified)}}
function calc(rows=state.recipe){let total=rows.reduce((s,r)=>s+r.g,0),n=Array(8).fill(0);rows.forEach(r=>ingredient(r.id).n.forEach((v,i)=>n[i]+=v*r.g/100));return {total,n,per:n.map(v=>total?v*100/total:0)}}
function field(key,label,type='text'){return `<label>${label}<input type="${type}" data-key="${key}" value="${esc(state[key])}"></label>`}
function area(key,label){return `<label>${label}<textarea data-key="${key}">${esc(state[key])}</textarea></label>`}
function nutrition(n){return `<table class="nutrition">${nutrientNames.map((s,i)=>`<tr><td>${s.replace(/ \(.+\)/,'')}</td><td>${fmt(n[i],i===7?2:i<2?0:1)} ${i===0?'kJ':i===1?'kcal':'g'}</td></tr>`).join('')}</table>`}
function emphasis(s,al){let out=esc(s);const terms=al.split(',').map(x=>x.trim()).filter(Boolean).sort((a,b)=>b.length-a.length);for(const word of terms){const re=new RegExp(word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');out=out.replace(re,m=>`<strong>${m.toUpperCase()}</strong>`)}return out}
function list(){let t=calc().total;return [...state.recipe].filter(r=>r.g>0).sort((a,b)=>b.g-a.g).map(r=>{const d=ingredient(r.id);return `${esc(d.name)} ${fmt(r.g/(t||1)*100)}% (${emphasis(d.decl,d.al)})`}).join(', ')}
function issues(){let a=[];if(Math.abs(calc().total-100)>.02)a.push('Het recept moet samen 100 g zijn.');if(state.recipe.some(r=>r.g>0&&!ingredient(r.id).verified))a.push('Er worden nog ongecontroleerde oefengegevens gebruikt.');for(const [k,l]of [['name','naam'],['description','productomschrijving'],['date','houdbaarheidsdatum'],['storage','bewaaradvies'],['owner','naam en adres verantwoordelijke'],['lot','lotcode']])if(!state[k].trim())a.push(`Vul ${l} in.`);if(!state.approved)a.push('Laat de docent recept, gegevens en etiket controleren.');return a}
function labelHTML(){return `<div class="label">${issues().length?'<div class="draft">OEFENETIKET · NOG CONTROLEREN<br>Niet gebruiken als verkoopetiket</div>':''}<h2>${esc(state.name||'Mijn eigen saus')}</h2><p>${esc(state.description||'Productomschrijving nog invullen')}</p><p class="net">Netto-inhoud 100 g</p><p><b>Ingrediënten:</b> ${list()||'Nog geen ingrediënten gekozen.'}</p><h3>Gemiddelde voedingswaarde per 100 g</h3>${nutrition(calc().per)}<p><b>${esc(state.dateType)}:</b> ${esc(state.date?state.date.split('-').reverse().join('-'):'nog invullen')}</p><p><b>Bewaren:</b> ${esc(state.storage||'nog invullen')}</p>${state.after?`<p><b>Na openen:</b> ${esc(state.after)}</p>`:''}<p>${esc(state.owner||'Naam en adres nog invullen')}</p><p>Lotcode: ${esc(state.lot||'nog invullen')}</p></div>`}
function summary(){let c=calc();return `<div class="card"><span class="pill">Jouw recept</span><div class="big">${fmt(c.total,2)} <small>g</small></div><div class="meter"><i style="width:${Math.min(100,c.total)}%"></i></div><p>${Math.abs(c.total-100)<.02?'Precies 100 gram.':c.total<100?`Nog ${fmt(100-c.total,2)} g toevoegen.`:`${fmt(c.total-100,2)} g boven 100 gram.`}</p><h3>Voedingswaarde per 100 g</h3>${nutrition(c.per)}<p class="tag">Voorlopige berekening zolang brongegevens niet gecontroleerd zijn.</p></div>`}
function render(){save();document.querySelector('nav').innerHTML=['Mijn saus','Recept maken','Onderzoeken','Mijn etiket'].map((s,i)=>`<button class="${!editing&&state.step===i?'active':''}" data-step="${i}">${i+1}. ${s}</button>`).join('');if(editing){renderEditor();document.querySelectorAll('[data-step]').forEach(e=>e.onclick=()=>{state.step=+e.dataset.step;editing=false;render()});return}let body='';if(state.step===0)body=`<div class="stepnum">STAP 1 / IDEE EN SMAAK</div><h1>Wat wordt jouw saus?</h1><p class="muted">Ontwikkel, proef en verbeter. De app rekent met je mee.</p><div class="card">${field('student','Naam of duo')}${field('name','Naam van je saus')}${field('dish','Bij welk gerecht past jouw saus?')}${area('flavour','Welke smaak en structuur wil je bereiken?')}${area('improvement','Wat heb je na het proeven verbeterd?')}</div>`;
if(state.step===1)body=`<div class="stepnum">STAP 2 / WEGEN EN MENGEN</div><h1>Jouw recept, 100 gram</h1><p class="muted">Kies een ingrediënt en vul het gewicht in. Bij 100 g is elk aantal grammen meteen het percentage.</p><div class="card"><div class="row"><select id="pick" aria-label="Kies ingrediënt" style="flex:1">${['mayo',...Object.keys(db)].map(id=>`<option value="${id}">${esc(ingredient(id).name)}</option>`).join('')}</select><button class="primary" id="add">Toevoegen</button></div><div id="rows">${state.recipe.length?state.recipe.map((r,i)=>`<div class="ingredient"><div><b>${esc(ingredient(r.id).name)}</b><small>${ingredient(r.id).verified?'Bron gecontroleerd':'Oefengegevens'}</small></div><input aria-label="Gram ${esc(ingredient(r.id).name)}" data-weight="${i}" type="number" min="0" max="10000" step="0.1" value="${r.g}"><span>${fmt(calc().total?r.g/calc().total*100:0)}%</span><button data-remove="${i}" aria-label="Verwijder ${esc(ingredient(r.id).name)}">×</button></div>`).join(''):'<div class="empty">Voeg eerst je basismayonaise toe. Kies daarna je smaakmakers.</div>'}</div><div class="row" style="margin-top:20px"><button id="scale" ${calc().total?'':'disabled'}>Recept omzetten naar 100 g</button><span class="muted">Dezelfde verhouding, nieuwe afweeglijst.</span></div></div><details class="card"><summary>Hoe rekent de app?</summary><p>Per ingrediënt: gebruikte grammen × voedingswaarde per 100 g ÷ 100. Daarna tellen we de bijdragen op.</p><p>Voorbeeld: 30 g yoghurt met 3 g vet per 100 g levert 0,9 g vet. Bij een totaal anders dan 100 g wordt de uitkomst omgerekend naar 100 g.</p></details><div class="notice">Proef apart. Weeg je definitieve saus volgens het recept af en vul netto 100 g in een schoon bakje. Volg de koel- en hygiëneafspraken van school.</div>`;
if(state.step===2)body=`<div class="stepnum">STAP 3 / KIJK VERDER DAN SMAAK</div><h1>Wat zit er in jouw saus?</h1><p class="muted">Controleer de echte verpakkingen. Ook een verse saus kan via mosterd of ketchup additieven bevatten.</p><div class="card tablewrap"><table class="sources"><thead><tr><th>Ingrediënt</th><th>Allergenen</th><th>Additieven</th></tr></thead><tbody>${state.recipe.filter(r=>r.g>0).map(r=>{let d=ingredient(r.id);return `<tr><td>${esc(d.name)}<br><small>${d.verified?'Gecontroleerd':'Nog controleren'}</small></td><td>${esc(d.al||'Geen geregistreerd; controleer bron')}</td><td>${esc(d.add||'Nog niet geregistreerd')}</td></tr>`}).join('')||'<tr><td colspan="3">Kies eerst je ingrediënten in stap 2.</td></tr>'}</tbody></table></div><div class="card">${area('question','Welk ingrediënt levert een allergeen of additief? Wat doet dat additief?')}<p>De eidooier helpt de mayonaise te emulgeren. Een fabrikant kan daarnaast stabilisatoren of verdikkingsmiddelen gebruiken voor de gewenste structuur en stabiliteit.</p><button id="openEditor">Brongegevens bekijken en aanpassen</button></div><div class="notice">Allergenen worden benadrukt in de ingrediëntenlijst. Een waarschuwing voor kruisbesmetting volgt alleen na beoordeling door de docent; de app voegt die niet automatisch toe.</div>`;
if(state.step===3)body=`<div class="stepnum">STAP 4 / VAN RECEPT NAAR ETIKET</div><h1>Maak je etiket af</h1><p class="muted">Neem de gecontroleerde gegevens over. Houdbaarheid en bewaring bepaal je samen met de docent.</p><div class="card">${field('name','Naam van je saus')}${field('description','Duidelijke productomschrijving')}<div class="two"><label>Houdbaarheidsvermelding<select data-key="dateType"><option ${state.dateType==='Te gebruiken tot'?'selected':''}>Te gebruiken tot</option><option ${state.dateType==='Ten minste houdbaar tot'?'selected':''}>Ten minste houdbaar tot</option></select></label>${field('date','Datum','date')}</div>${field('storage','Bewaaradvies inclusief temperatuur')}${field('after','Na openen indien van toepassing')}${field('owner','Naam en volledig adres verantwoordelijke')}${field('lot','Lotcode')}<label><input type="checkbox" data-key="approved" ${state.approved?'checked':''}>De docent heeft de brongegevens, receptuur, allergenen, eventuele extra vermeldingen, houdbaarheid en het etiket gecontroleerd.</label></div><div class="notice ${issues().length?'':'good'}" id="checks">${issues().length?`<b>Nog te controleren</b><ul>${issues().map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`:'Alle ingevulde controles zijn afgerond.'}</div><div class="row"><button class="primary" id="printLabel">Etiket printen / PDF</button><button id="printRecipe">Receptblad printen / PDF</button></div><p class="muted" style="margin-top:12px">Kies ‘Opslaan als PDF’ in het afdrukvenster. Het etiket is 100 mm breed; druk op 100% af, zonder kop- en voetteksten. Hoogte hangt af van de ingrediëntenlijst.</p>`;
document.querySelector('#app').innerHTML=`<div class="grid"><section>${body}<div class="footnav"><button data-step="${Math.max(0,state.step-1)}" ${state.step===0?'disabled':''}>Vorige</button>${state.step<3?`<button class="primary" data-step="${state.step+1}">Verder naar stap ${state.step+2}</button>`:''}</div></section><aside>${state.step===3?`<div id="liveLabel">${labelHTML()}</div>`:summary()}</aside></div>`;bind()}
function renderEditor(){document.querySelector('#app').innerHTML=`<div class="stepnum">GEGEVENS VOOR DE LES</div><h1>Ingrediënten en basismayonaise</h1><p>De startwaarden zijn afgeronde oefenwaarden, geen gecontroleerde merkgegevens. Vul de echte etiketten in voordat je een definitief etiket gebruikt. Aanpassingen blijven alleen in deze browser bewaard.</p><div class="notice">Controleer voedingswaarden, volledige samenstelling, allergenen en additieven. Vooral worcestersaus, augurken, mosterd en kruidenmengsels verschillen per merk. Zet bij additieven ‘geen’ wanneer dit gecontroleerd is.</div><div class="card"><h2>Eigen basismayonaise</h2><p>Dit is een oefenrecept. Pas de gramgewichten aan jullie daadwerkelijk gewogen recept aan. De app berekent de voedingswaarde van de basis per 100 g.</p><div class="two">${base.map((r,i)=>`<label>${esc(db[r.id].name)} (g)<input data-base="${i}" type="number" min="0" step="0.1" value="${r.g}"></label>`).join('')}</div><p>Basisgewicht: <b id="basetotal">${fmt(base.reduce((s,r)=>s+r.g,0))} g</b></p><label><input type="checkbox" id="baseconfirm">Ik heb deze basisreceptuur gecontroleerd (controleer ook de vijf bronproducten hieronder).</label></div><div class="card editor"><h2>Productgegevens aanpassen</h2><label>Ingrediënt<select id="editpick">${Object.entries(db).map(([id,d])=>`<option value="${id}">${esc(d.name)}</option>`).join('')}</select></label><div id="editfields"></div></div><button class="primary" id="closeEditor">Terug naar mijn saus</button><p style="margin-top:18px;font-size:14px">Etiketteringskader: <a target="_blank" rel="noopener" href="https://www.nvwa.nl/onderwerpen/etikettering-van-levensmiddelen">NVWA</a>. Het etiketmodel ondersteunt deze lesopdracht; bijzondere ingrediënten of claims vragen aanvullende controle.</p>`;editFields('oil');document.querySelector('#editpick').onchange=e=>editFields(e.target.value);document.querySelectorAll('[data-base]').forEach(e=>e.onchange=()=>{base[+e.dataset.base].g=num(e.value);state.baseConfirmed=false;document.querySelector('#baseconfirm').checked=false;state.approved=false;save();document.querySelector('#basetotal').textContent=fmt(base.reduce((s,r)=>s+r.g,0))+' g'});document.querySelector('#closeEditor').onclick=()=>{editing=false;render()};document.querySelector('#baseconfirm').onchange=e=>{state.baseConfirmed=e.target.checked;state.approved=false;save()};document.querySelector('#baseconfirm').checked=!!state.baseConfirmed}
function editFields(id){let d=db[id];document.querySelector('#editfields').innerHTML=`<div class="two">${nutrientNames.map((s,i)=>`<label>${s} per 100 g<input data-n="${i}" type="number" min="0" step="0.01" value="${d.n[i]}"></label>`).join('')}</div><label>Volledige ingrediëntenlijst van dit product<textarea data-prop="decl">${esc(d.decl)}</textarea></label><label>Allergenen, gescheiden door komma’s<input data-prop="al" value="${esc(d.al)}"></label><p class="muted">Gebruik bijvoorbeeld EI, MELK, MOSTERD of de specifieke graan- of notensoort. Zorg dat de naam ook in de ingrediëntenlijst staat.</p><label>Additieven met functie en naam of E-nummer<input data-prop="add" value="${esc(d.add)}"></label><label>Bron (merk, product en etiketdatum)<input data-prop="source" value="${esc(d.source)}"></label><label><input type="checkbox" id="verified" ${d.verified?'checked':''}>Gegevens gecontroleerd aan de hand van de echte verpakking of betrouwbare productinformatie.</label>`;document.querySelectorAll('[data-n]').forEach(e=>e.onchange=()=>{d.n[+e.dataset.n]=num(e.value);d.verified=false;state.approved=false;save();document.querySelector('#verified').checked=false});document.querySelectorAll('[data-prop]').forEach(e=>e.oninput=()=>{d[e.dataset.prop]=e.value;d.verified=false;state.approved=false;document.querySelector('#verified').checked=false;save()});document.querySelector('#verified').onchange=e=>{d.verified=e.target.checked;state.approved=false;save()}}
function bind(){document.querySelectorAll('[data-step]').forEach(e=>e.onclick=()=>{state.step=+e.dataset.step;editing=false;render();window.scrollTo(0,0)});document.querySelectorAll('[data-key]').forEach(e=>e.oninput=()=>{state[e.dataset.key]=e.type==='checkbox'?e.checked:e.value;if(e.dataset.key!=='approved')state.approved=false;save();if(state.step===3){document.querySelector('#liveLabel').innerHTML=labelHTML();document.querySelector('#checks').innerHTML=issues().length?'<b>Nog te controleren</b><ul>'+issues().map(s=>`<li>${esc(s)}</li>`).join('')+'</ul>':'Alle ingevulde controles zijn afgerond.';document.querySelector('[data-key=approved]').checked=state.approved}});document.querySelectorAll('[data-weight]').forEach(e=>e.onchange=()=>{state.recipe[+e.dataset.weight].g=num(e.value);state.approved=false;render()});document.querySelectorAll('[data-remove]').forEach(e=>e.onclick=()=>{state.recipe.splice(+e.dataset.remove,1);state.approved=false;render()});let a=document.querySelector('#add');if(a)a.onclick=()=>{let id=document.querySelector('#pick').value;if(!state.recipe.some(r=>r.id===id))state.recipe.push({id,g:0});state.approved=false;render()};let sc=document.querySelector('#scale');if(sc)sc.onclick=()=>{let t=calc().total;if(!t)return;let values=state.recipe.map(r=>Math.round(r.g/t*10000));let max=values.indexOf(Math.max(...values));values[max]+=10000-values.reduce((a,b)=>a+b,0);state.recipe.forEach((r,i)=>r.g=values[i]/100);state.approved=false;render()};let ed=document.querySelector('#openEditor');if(ed)ed.onclick=()=>{editing=true;render()};let pl=document.querySelector('#printLabel');if(pl)pl.onclick=()=>printIt(false);let pr=document.querySelector('#printRecipe');if(pr)pr.onclick=()=>printIt(true)}
function printIt(report){document.querySelector('#printarea').innerHTML=report?`<div class="report"><h1>${esc(state.name||'Mijn saus')}</h1><p>${esc(state.student)}</p><p><b>Gerecht:</b> ${esc(state.dish)}<br><b>Smaak:</b> ${esc(state.flavour)}<br><b>Verbetering:</b> ${esc(state.improvement)}</p><table><tr><th>Ingrediënt</th><th>Gram</th><th>Percentage</th></tr>${state.recipe.map(r=>`<tr><td>${esc(ingredient(r.id).name)}</td><td>${fmt(r.g,2)}</td><td>${fmt(calc().total?r.g/calc().total*100:0)}%</td></tr>`).join('')}<tr><th>Totaal</th><th>${fmt(calc().total,2)} g</th><th></th></tr></table><p><b>Onderzoek:</b> ${esc(state.question)}</p>${labelHTML()}</div>`:labelHTML();window.print()}
document.querySelector('#teacher').onclick=()=>{editing=!editing;render()};
const originalIssues=issues;issues=function(){let a=originalIssues();if(state.recipe.some(r=>r.id==='mayo'&&r.g>0)&&!state.baseConfirmed)a.push('De gebruikte basisreceptuur moet nog worden bevestigd.');return a};
render();window.Sauslab={calc,ingredient,get state(){return state},get db(){return db},issues};
</script></html>
