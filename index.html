<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Kies je opleiding en open een zelfstandige oefenmodule van Academy Oefenplein.">
    <title>SVO Academy Oefenplein</title>
    <link rel="icon" type="image/png" href="assets/svo-vakopleider-food-logo.png">
    <link rel="apple-touch-icon" href="assets/svo-vakopleider-food-logo.png">
    <script>
        (() => {
            const validPreferences = ["system", "light", "dark"];
            let preference = "system";
            try {
                const storedPreference = localStorage.getItem("academy-theme-preference");
                if (validPreferences.includes(storedPreference)) preference = storedPreference;
            } catch (_) {}
            const systemTheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            document.documentElement.dataset.theme = preference === "system" ? systemTheme : preference;
        })();
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="page-width header-layout">
            <div class="site-brand">
                <a class="site-title" href="#" aria-label="SVO Academy Oefenplein - beginscherm">
                    <img class="academy-logo" src="assets/svo-vakopleider-food-logo.png" alt="">
                    <span>SVO Academy Oefenplein</span>
                </a>
                <p>Van theorie naar vakmanschap.</p>
            </div>
            <fieldset class="theme-control" aria-label="Kleurthema">
                <legend class="visually-hidden">Kleurthema</legend>
                <button type="button" data-theme-preference="system" aria-pressed="false">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="12" x="3" y="4" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
                    <span>Systeem</span>
                </button>
                <button type="button" data-theme-preference="light" aria-pressed="false">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
                    <span>Licht</span>
                </button>
                <button type="button" data-theme-preference="dark" aria-pressed="false">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
                    <span>Donker</span>
                </button>
            </fieldset>
        </div>
    </header>

    <main id="main-content" class="page-width">
        <nav id="breadcrumb" class="breadcrumb" aria-label="Kruimelpad" hidden></nav>
        <div id="app"></div>
    </main>

    <script src="app.js"></script>
</body>
</html>
